  function injectCSS() {
    if (document.getElementById('ah-splash3d-css')) return;
    var s = document.createElement('style');
    s.id = 'ah-splash3d-css';
    s.textContent = CSS;
    document.head.appendChild(s);
  }

  var PREFILL_HTML = '<div class="ahfs-prefill" aria-hidden="true"><span class="ahfs-prefill-tile">✦</span><b>Admission Hub</b><span>তোমার স্টাডি স্পেস প্রস্তুত হচ্ছে…</span></div>';

  function mount(root) {
    if (!root) return null;
    injectCSS();
    if (!root.querySelector('.ahfs-scene')) {
      try {
        root.innerHTML = sceneHTML();
      } catch (_) {
        // fail-safe: কখনো blank নয়, brand prefill থাকে
        if (!root.querySelector('.ahfs-prefill')) root.innerHTML = PREFILL_HTML;
      }
    }
    var sc = root.querySelector('.ahfs-scene');
    if (!sc) return null;
    sc.dataset.mountedAt = String(Date.now());
    var reduced = false;
    try { reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (_) {}
    if (reduced) sc.classList.add('ahfs-reduced');
    if (!sc.dataset.played) {
      sc.dataset.played = '1';
      sc.classList.add('ahfs-play');
      if (!reduced) {
        setTimeout(function () { sc.classList.add('ahfs-idle'); }, 2200);
      }
    }
    current = { root: root, sc: sc };
    return sc;
  }

  function setStage(text) {
    if (!current || !current.sc) return;
    var el = current.sc.querySelector('.ahfs-stage-text');
    if (el && text) el.textContent = text;
  }

  function setProgress(p) {
    if (!current || !current.sc) return;
    var bar = current.sc.querySelector('.ahfs-bar');
    if (!bar) return;
    if (p === null || p === undefined) {
      bar.classList.add('ahfs-indet');
    } else {
      bar.classList.remove('ahfs-indet');
      bar.style.transform = 'scaleX(' + Math.max(0.04, Math.min(1, Number(p))) + ')';
    }
  }

  function dismiss(duration) {
    if (!current || !current.sc) return Promise.resolve(true);
    var root = current.root;
    var sc = current.sc;
    current = null;
    window.__admissionSplashDone = true; // autoMount আর কখনো আবার scene বানাবে না
    return new Promise(function (resolve) {
      // ⚠️ blank-proof: scene সরানোর আগেই root-এ brand prefill ফেরাও -
      // যাতে render()-এর মাঝে এক মুহূর্তের জন্যও খালি পর্দা না আসে।
      if (root && root.parentNode) {
        root.innerHTML = PREFILL_HTML;
      }
      // minimum display: অ্যানিমেশন টাইমলাইন পুরোটা দেখার জন্য (দ্রুত boot-এও)
      var mountedAt = Number(sc.dataset.mountedAt) || Date.now();
      var waitExtra = Math.max(0, 1500 - (Date.now() - mountedAt));
      var fix = document.createElement('div');
      fix.className = 'ahfs-overlay';
      sc.classList.add('ahfs-still');
      sc.classList.remove('ahfs-play', 'ahfs-idle');
      document.body.appendChild(fix);
      fix.appendChild(sc);
      setTimeout(function () {
        fix.classList.add('ahfs-leave');
        setTimeout(function () {
          if (fix.parentNode) fix.parentNode.removeChild(fix);
          // 🔒 শেষ নিশ্চিতকরণ: মাঝপথে কেউ scene re-mount করলেও root কখনো blank না
          try {
            if (root && root.parentNode && !root.querySelector('.page') && !root.querySelector('.app-fallback') && !root.querySelector('.ahfs-scene')) {
              root.innerHTML = PREFILL_HTML;
            }
          } catch (_) {}
          resolve(true);
        }, (duration || 560) + 80);
      }, waitExtra);
    });
  }

  // 🔒 জরুরি force-hide (১০-সেকেন্ড watchdog): যেকোনো অবস্থায় splash সরাও,
  // সব splash-root-এ ব্র্যান্ড prefill ফেরাও, অ্যাপ কখনো blank না।
  function forceHide() {
    try {
      document.querySelectorAll('.ahfs-overlay').forEach(function (f) { if (f.parentNode) f.parentNode.removeChild(f); });
    } catch (_) {}
    current = null;
    try {
      document.querySelectorAll('#ahSplash, #phase1-splash, .app-loading').forEach(function (r) {
        if (r && !r.querySelector('.ahfs-scene') && !r.querySelector('.app-fallback') && !r.querySelector('.page')) {
          if (!r.querySelector('.ahfs-prefill')) r.innerHTML = PREFILL_HTML;
        }
      });
    } catch (_) {}
  }

  window.AdmissionSplash3D = { mount: mount, setStage: setStage, setProgress: setProgress, dismiss: dismiss, forceHide: forceHide };

  /* প্রথম UI-তে থাকা splash-গুলোতে অটো mount */
  function autoMount() {
    if (window.__admissionSplashDone) return; // dismiss-এর পরে আর mount নয়, blank-loop বন্ধ
    var targets = [];
    var appMain = document.querySelector('#app > .app-loading');
    if (appMain) targets.push(appMain);
    var phase1 = document.getElementById('phase1-splash');
    if (phase1) targets.push(phase1);
    targets.forEach(function (t) { try { mount(t); } catch (_) {} });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', autoMount, { once: true });
  } else {
    autoMount();
  }
})();
</script>
<script>
  AdmissionSplash3D.mount(document.getElementById('ahSplash'));
  setTimeout(function(){ AdmissionSplash3D.setStage('তোমার বিষয় ও অগ্রগতি প্রস্তুত হচ্ছে…'); AdmissionSplash3D.setProgress(0.8); }, 2600);
  setTimeout(function(){ AdmissionSplash3D.setStage('প্রায় প্রস্তুত…'); AdmissionSplash3D.setProgress(1); }, 3600);
  setTimeout(function(){ AdmissionSplash3D.dismiss(520); }, 4300);
  var z=document.createElement('button'); z.className='zoom'; z.textContent='↻ আবার দেখুন';
  z.onclick=function(){ var r=document.getElementById('ahSplash'); window.__admissionSplashDone=false; r.innerHTML=''; AdmissionSplash3D.mount(r); };
  document.body.appendChild(z);
</script>
</body>
</html>
