function weeklyActivity(){
  const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const now=new Date();
  const map={};
  for(let i=0;i<7;i++){ const d=new Date(now); d.setDate(now.getDate()-i); map[todayKey(d)]={q:0}; }
  CACHE.examResults.forEach(r=>{
    const k=todayKey(new Date(r.date));
    if(map[k]!==undefined) map[k].q += (r.correct+r.wrong+r.skipped);
  });
  const out=[];
  for(let i=6;i>=0;i--){ const d=new Date(now); d.setDate(now.getDate()-i); const k=todayKey(d); out.push({label:days[(d.getDay()+6)%7], v: map[k]? map[k].q:0}); }
  return out;
}

    toast('Restore complete'); navigate('dashboard');

/* ================= BOOT ================= */
  /* The global appearance engine (`AhAppearance`, key `ah-appearance`) owns the
     theme. These legacy `setTheme`/`applyTheme` helpers predate it and read a
     second, independent source (`CACHE.settings.theme`, IndexedDB), whose
     default is 'light'. Left unbridged they fought the engine: boot painted
     light, then any profile render re-applied the owner's choice, so users saw
     the theme land on "some cards" and not the app. Delegate to the engine
     instead of writing the attribute from two places. */
  function applyTheme(){
    if(window.AhAppearance){ window.AhAppearance.apply(); return; }
    const theme=(CACHE.settings && CACHE.settings.theme) || 'light';
    if(theme==='light') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', theme);
  }
  async function setTheme(theme){
    CACHE.settings.theme=theme;
    if(window.AhAppearance) window.AhAppearance.set(theme);
    await dbPut('settings',CACHE.settings);
    applyTheme();
    render();
  }
/* ---------------- read-only startup diagnostics ----------------
 * These legacy names remain available for compatibility, but startup must never
 * delete, re-home, merge, or rewrite a user's subject, topic, or question. */
async function purgeDuplicateGeneralTopics(){
  const topics=await dbGetAll('topics').catch(()=>[]);
  const groups={};
  topics.filter(t=>String(t?.name||'').trim().toLowerCase()==='general').forEach(t=>{(groups[t.subjectId]||(groups[t.subjectId]=[])).push(t.id);});
  const duplicateGroups=Object.values(groups).filter(ids=>ids.length>1);
  if(duplicateGroups.length) console.warn('[Admission Hub] Duplicate General topics detected; no records were changed.',duplicateGroups);
  return {changed:false,duplicateGroups};
}
async function purgeImportedSubjects(){
  const subjects=await dbGetAll('subjects').catch(()=>[]);
  const imported=subjects.filter(s=>String(s?.name||'').trim().toLowerCase()==='imported').map(s=>s.id);
  if(imported.length) console.warn('[Admission Hub] Imported subjects detected; no records were changed.',imported);
  return {changed:false,imported};
}
async function boot(){
  window.__admissionBootStatus='loading';
  window.__admissionFinalModulesReady=false;
  window.__admissionDataReady=false;
  try{
    await openDB();
    await seedIfEmpty();
    // Startup remains read/validate-only; no automatic content migration runs here.
    await loadCache();
  }catch(err){
    // A suspended/locked Safari database must not trap the app behind a recovery
    // page. Memory mode is session-only and never clears or rewrites saved IDB data.
    console.error('[Admission Hub] Data load failed, memory fallback.',err);
    useMemoryStorage(err);
    try{await loadCache();}catch(_){}
  }
  try{applyTheme();}catch(_){}
  Router.path=location.hash.slice(1)||'dashboard';
  window.__admissionDataReady=true;
  window.__admissionBootStatus='ready';
  document.body.classList.remove('app-booting');
  window.__admissionCoreBootComplete=true;
  window.dispatchEvent(new CustomEvent('admission:boot-ready',{detail:{storageMode:STORAGE_MODE}}));
  // Warm the deferred data packs after the dashboard is interactive, so the
  // result and mock screens still open with no wait.
  const warmPacks=()=>{ ['result-analysis-500','one-time-mock-seed'].forEach(n=>{ try{ window.admissionLoadPack(n).catch(()=>{}); }catch(_){} }); };
  const queueWarmPacks=()=>setTimeout(()=>{if(typeof requestIdleCallback==='function') requestIdleCallback(warmPacks,{timeout:6000});else warmPacks();},5000);
  if(document.readyState==='complete')queueWarmPacks();else window.addEventListener('load',queueWarmPacks,{once:true});
  // Deferred dashboard code owns the first real render. Marking modules ready in
  // boot caused a race where renderDashboard was still absent and the loader lived forever.
  if(typeof window.__admissionRequestFinalRender==='function') window.__admissionRequestFinalRender();

  // Resume handling is non-critical for first paint and must never block the dashboard.
  const resumable=await checkResumableExam();
  let returningFromManualAi=false;
  try {
    const pending=JSON.parse(sessionStorage.getItem('admission_gemini_pending_note_v2')||'null');
    returningFromManualAi=!!pending && pending.source==='Flash Test' && pending.returnPath==='exam/running';
  } catch (_) {}
  if(resumable && resumable.configuration && resumable.configuration.resume===false){
    try{ await dbDel('exams', resumable.id); CACHE.exams=await dbGetAll('exams'); } catch(_) {}
  } else if(resumable){
    ActiveExam=applyExamBackup(resumable);
    if(resumable.mode==='mock' && computeRemaining(resumable)<=0){
      try{ await submitExam(true); } catch(submitErr){ console.warn('[AdmissionHub] boot auto-submit deferred', submitErr); }
    } else if(!returningFromManualAi) {
      openModal(`<h3>Resume Active Exam?</h3>
        <p class="muted">You have an unfinished ${resumable.mode==='mock'?'Mock':'Flash'} test with ${Object.keys(resumable.selectedAnswers).length}/${resumable.questions.length} answered.</p>
        <div class="row" style="margin-top:14px;">
          <button class="btn ghost" style="flex:1" onclick="discardActiveExam()">Discard</button>
          <button class="btn" style="flex:1" onclick="resumeActiveExam()">Resume Exam</button>
        </div>`);
    }
  }
}

  renderSettings=function(){const s=normalizeSettings(CACHE.settings), cards=s.dashboardCards, toggle=(label,key,group='root')=>`<div class="togglerow"><span>${label}</span><div class="toggle ${((group==='cards'?cards[key]:s[key])?'on':'')}" onclick="toggleUpgrade('${group}','${key}')"><div class="dot"></div></div></div>`; const html=`<div class="explorer-head"><div class="explorer-kicker">Personalization</div><div class="explorer-title">Settings</div><div class="explorer-subtitle">Tune the study environment without touching your existing records.</div><div class="h2" style="margin-top:0">Appearance</div><div class="card"><div class="muted">Theme</div><div class="filter-row" style="margin-top:8px">${[['light','Emerald Light'],['dark','Soft Dark'],['midnight','Midnight'],['focus','Focus Mode']].map(([v,l])=>`<button class="chip ${s.theme===v?'active':''}" onclick="setTheme('${v}')">${l}</button>`).join('')}</div><div class="muted" style="margin-top:12px">Accent</div><div class="filter-row" style="margin-top:8px">${[['emerald','Emerald'],['blue','Blue'],['violet','Violet'],['amber','Amber']].map(([v,l])=>`<button class="chip ${s.accent===v?'active':''}" onclick="setAccent('${v}')">${l}</button>`).join('')}</div><label class="flabel">UI Density</label><select onchange="CACHE.settings.density=this.value;persistUpgradeSetting()"><option value="comfortable" ${s.density==='comfortable'?'selected':''}>Comfortable</option><option value="compact" ${s.density==='compact'?'selected':''}>Compact</option></select><label class="flabel">Card Style</label><select onchange="CACHE.settings.cardStyle=this.value;persistUpgradeSetting()"><option value="soft" ${s.cardStyle==='soft'?'selected':''}>Soft</option><option value="minimal" ${s.cardStyle==='minimal'?'selected':''}>Minimal</option><option value="elevated" ${s.cardStyle==='elevated'?'selected':''}>Elevated</option></select></div><div class="h2">Animation & Feedback</div><div class="card">${toggle('Animations','animation')} ${toggle   window.toggleUpgrade=async function(group,key){const s=normalizeSettings(CACHE.settings); if(group==='cards') s.dashboardCards[key]=s.dashboardCards[key]===false; else if(group==='feedback') s.feedback[key]=s.feedback[key]===false; else if(group==='examDefaults') s.examDefaults[key]=s.examDefaults[key]===false; else if(key==='animation') s.animation=s.animation==='on'?'off':'on'; else s[key]=!s[key]; CACHE.settings=s; await dbPut('settings',s); applyUpgradePrefs(); render();};

  function mistakeRows(){return CACHE.mistakes.map(m=>{const q=CACHE.questions.find(x=>x.id===m.questionId); if(!q)return null; const attempts=Math.max(Number(m.attempts||0),Number(q.stats&&q.stats.attempts||0),Number(m.wrongCount||0)); const wrong=Math.max(Number(m.wrongCount||0),Number(q.stats&&q.stats.wrong||0)); const correct=Math.max(0,Number(m.correctCount||0),Number(q.stats&&q.stats.correct||0)); const acc=attempts?round2(correct/attempts*100):0; const age=Math.max(0,Date.now()-Number(m.lastWrongAt||m.updatedAt||0)); const priority=wrong>=5||acc<50?'high':wrong>=2||acc<75?'medium':'low'; return {m,q,attempts,wrong,correct,acc,age,priority};}).filter(Boolean);}
  renderMistakes=function(){const filter=window.MistakeFilter||'all', now=Date.now(), rows=mistakeRows().filter(r=>filter==='all'||filter==='today'?(filter==='all'||todayKey(new Date(r.m.lastWrongAt||0))===todayKey()):filter==='frequent'?r.wrong>=3:filter==='recent'?r.age<7*86400000:filter==='critical'?r.priority==='high':filter==='weak'?r.acc<70:filter==='mastered'?r.m.mastered===true:filter==='pending'?r.m.mastered!==true:true).sort((a,b)=>({high:0,medium:1,low:2}[a.priority]-({high:0,medium:1,low:2}[b.priority])||b.wrong-a.wrong)); const pendingCt=rows.filter(r=>r.m.mastered!==true).length, masteredCt=rows.length-pendingCt; const html=`<div class="explorer-head"><div class="explorer-kicker">Revision System</div><div class="explorer-title">Mistake Bank 2.0</div><div class="explorer-subtitle">${rows.length} mistakes · <b>${pendingCt} pending</b> · ${masteredCt} mastered</div></div><div class="row wrap" style="gap:7px;margin-bottom:10px"><button class="btn sm" onclick="openMistakePracticeModal()">🔁 Practice My Mistakes</button><button class="btn secondary sm" onclick="startMistakeExam('flash')">⚡ Flash</button></div><div class="filter-row" style="margin-bottom:12px">${[['all','All'],['pending','Needs Review'],['mastered','Mastered'],['today','Today'],['frequent','Frequently Wrong'],['recent','Recently Wrong'],['critical','Critical'],['weak','Weak Topic']].map(([v,l])=>`<button class="chip ${(filter===v?'active':'')}" onclick="MistakeFilter='${v}';render()">${l}</button>`).join('')}</div>${rows.length?rows.map(r=>`<article class="card mistake-row priority-${r.priority}" style="cursor:pointer"><div class="row between" style="align-items:flex-start;gap:8px"><div style="min-width:0;flex:1"><b>${esc(r.q.question||'Untitled')}</b><div class="muted" style="margin-top:5px">${esc(subjectName(r.q.subjectId))} · ${esc(topicName(r.q.topicId))}</div></div><span class="pill ${r.priority==='high'?'red':'orange'}">${r.priority.toUpperCase()}</span>${r.m.mastered?`<span class="pill" style="background:var(--mint);color:var(--emerald-d);margin-left:6px">✓ MASTERED</span>`:''}</div><div class="history-tool-stats"><span>Wrong ${r.wrong}×</span><span>Attempts ${r.attempts}</span><span>Correct ${r.correct}</span><span>Accuracy ${r.acc}%</span></div><div class="row wrap" style="margin-top:9px;gap:6px"><button class="btn ghost sm" onclick="event.stopPropagation();startQuestionPractice(['${r.q.id}'])">Review</button><button class="btn secondary sm" onclick="event.stopPropagation();beginExamFromPool([CACHE.questions.find(q=>q.id==='${r.q.id}')],'flash')">Flash Test</button><button class="btn ghost sm" onclick="event.stopPropagation();toggleQuestionBookmark('${r.q.id}')">${r.q.bookmarked?'★':'☆'} Bookmark</button><button class="btn ghost sm" onclick="event.stopPropagation();setMistakeMastered('${r.q.id}',${!r.m.mastered})">${r.m.mastered?'↩️ আবার শিখি':'✅ শিখে গেছি'}</button><button class="btn danger sm" onclick="event.stopPropagation();removeMistake('${r.m.id}')">Remove</button></div></article>`).join(''):emptyState('✅','Mistake Bank is Empty','Wrong answers will appear here automatically after completed exams.')}`; renderShell(html,{title:'Mistake Bank',back:"navigate('exam')"});};
  window.MistakeFilter='all'; window.setMistakeMastered=async function(qid,val){const m=CACHE.mistakes.find(x=>x.questionId===qid);if(!m){toast('Mistake record not found');return;}m.mastered=val===true;m.revisionStatus=m.mastered?'mastered':'pending';if(m.mastered)m.masteredAt=Date.now();else delete m.masteredAt;await dbPut('mistakes',m);CACHE.mistakes=await dbGetAll('mistakes');toast(m.mastered?'✅ শিখে গেছি, Mastered':'↩️ আবার অনুশীলনে');render();};

/* ================= PWA UPDATE / CACHE INVALIDATION ================= */
(function(){
  function activateWaiting(registration){
    const waiting=registration.waiting;
    if(!waiting) return false;
    waiting.postMessage({type:'SKIP_WAITING'});
    return true;
  }
  async function registerPwaUpdates(){
    if(!('serviceWorker' in navigator)) return;
    // Do not reload on controllerchange: iOS standalone clients can enter a blank-screen reload loop.
    // The updated worker takes control now; the current document remains usable and the next launch uses the new shell.
    try{

      // Must equal the BUILD_ID in sw.js: the cache name below is built from
      // this, and sw.js already purges every shell whose name is not its own
      // current build. A stale value here deletes the live offline shell on
      // every launch, so the iOS instant-startup cache never survives.
      const expectedSwVersion = 'v364-sky-goal';
      // register() on the same scope performs an in-place update. Never unregister
      // the active iOS worker first: that discards the instant offline shell.
      const registration=await navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'});
      await registration.update().catch(()=>{});
      // Purge every old app-shell cache (any build id ≠ current). This guarantees
      // stale pre-retirement application shells can never be served from cache again.
      try {

        const cur = 'admission-hub-shell-v364-sky-goal';
        const names = await caches.keys();
        for (const name of names) {
          if (name.startsWith('admission-hub-shell-') && name !== cur) await caches.delete(name).catch(()=>{});
        }
      } catch (_) {}
      // Apply an already-installed worker immediately; never require a cache-clear action.
      activateWaiting(registration);
      registration.addEventListener('updatefound',()=>{
        const worker=registration.installing;
        if(!worker) return;
        worker.addEventListener('statechange',()=>{
          if(worker.state==='installed') activateWaiting(registration);
        });
      });
      // Foreground resume (iOS standalone) never navigates, so the SW update
      // check would not run: ping it whenever the app becomes visible again.
      document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ registration.update().catch(()=>{}); } });
      // Last-resort self-heal. If the document never becomes usable AND even the
      // 3.8s fast usable shell never produced a screen, the shell we were served
      // is broken (the phone is on an old worker). Drop the worker + every cache
      // once and reload, so a device heals itself without "clear website data".
      // A sessionStorage guard makes the loop impossible.
      setTimeout(async()=>{
        try{
          if(window.__admissionBootStatus==='ready') return;
          const app=document.getElementById('app');
          if(app&&app.querySelector('.page,.ai-agent-root,[data-admission-usable="true"]')) return;
          if(sessionStorage.getItem('ah-sw-heal')==='1') return;
          sessionStorage.setItem('ah-sw-heal','1');
          const regs=await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r=>r.unregister().catch(()=>{})));
          for(const n of await caches.keys()) await caches.delete(n).catch(()=>{});
          location.reload();
        }catch(_){}
      },15000);
      // 💤 NO auto-reload on controllerchange: পরিবর্তিত worker পরের launch-এ apply হবে,
      // বর্তমান সেশন ও স্ক্রোল-অবস্থা কখনো হারাবে না (ব্যাকগ্রাউন্ড state ধরে থাকে)।
    }catch(error){console.warn('PWA registration failed',error)}
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',registerPwaUpdates,{once:true}); else registerPwaUpdates();
})();

/* ================= USABLE-SHELL DEADLINE (সর্বোচ্চ ৫ সেকেন্ড) =================
   কোনো recovery/warning screen নয়। ধীর Safari storage/module startup হলেও ৩.৮
   সেকেন্ডে normal navigation shell খুলবে; data boot শেষ হলে full dashboard replaces it. */
(function(){
  function hasUsableScreen(app){return !!app.querySelector('.page,.ai-agent-root,[data-admission-usable="true"]');}
  function openUsableShell(){
    try{
      const app=document.getElementById('app');
      if(!app||hasUsableScreen(app)) return;
      if(window.__admissionBootStatus==='loading') window.__admissionBootStatus='usable';
      window.__admissionFinalModulesReady=true;
      document.body.classList.remove('app-booting');
      if(typeof window.__admissionRequestFinalRender==='function') window.__admissionRequestFinalRender({force:true});
      if(hasUsableScreen(app)) return;
      const quick='<section class="card" data-admission-usable="true" style="margin-top:18px;padding:20px"><span class="pill">ADMISSION HUB</span><h1 style="font-size:calc(24px * var(--ah-ts,1));margin:14px 0 6px">আজকের প্রস্তুতি শুরু করো</h1><p class="muted" style="margin:0 0 18px">Question Bank, Exam, AI ও Progress-সব টুল এক জায়গায়।</p><div class="grid2"><button class="btn" onclick="navigate(\'question-bank\')">📚 Question Bank</button><button class="btn secondary" onclick="navigate(\'exam\')">📝 Exam</button><button class="btn secondary" onclick="navigate(\'ai\')">🤖 AI</button><button class="btn ghost" onclick="navigate(\'progress\')">📊 Progress</button></div></section>';
      if(typeof renderShell==='function') renderShell(quick,{title:'Dashboard'});
      else app.innerHTML='<main class="page">'+quick+'</main>';
    }catch(error){console.warn('[Admission Hub] Fast usable shell skipped.',error);}
  }
  window.__admissionOpenUsableShell=openUsableShell;
  window.__admissionSplashWatchdog=setTimeout(openUsableShell,3800);
})();

(function(){
  const oldSubmitForBook=submitExam;
  async function enrichMistakeRecord(m,s,result){
    const q=CACHE.questions.find(x=>x.id===s.questionId);
    const source=q||s;
    m.questionId=s.questionId; m.question=source.question||s.question||''; m.options=source.options||s.options||[];
    m.subjectId=s.subjectId; m.topicId=s.topicId; m.correctAnswerIndex=Number(s.answerIndex??source.answer??0);
    m.correctAnswer=(m.options||[])[m.correctAnswerIndex]||''; m.explanation=source.explanation||s.explanation||'';
    m.examId=result.id; m.lastWrongAt=Date.now(); m.revisionStatus=m.revisionStatus||'pending'; m.mastered=m.mastered===true;
    return m;
  }
  submitExam=async function(autoSubmit){
    await oldSubmitForBook(autoSubmit);
    const result=LastResult;
    if(result?.snapshot){
      for(const s of result.snapshot.filter(x=>x.status==='wrong')){
        let m=CACHE.mistakes.find(x=>x.questionId===s.questionId);
        if(!m)m={id:uid(),questionId:s.questionId,wrongCount:0,revisionStatus:'pending',correctAfterMistake:0,revisionCount:0,firstWrongAt:Date.now()};
        const beforeWrong=Number(m.wrongCount||0);
        m=await enrichMistakeRecord(m,s,result);
        m.firstWrongAt=m.firstWrongAt||Date.now();
        m.wrongCount=beforeWrong+1;
        m.revisionCount=Number(m.revisionCount||0)+1;
        m.status='UNRESOLVED';
        m.mastered=false;
        await dbPut('mistakes',m);
      }
      CACHE.mistakes=await dbGetAll('mistakes');
    }
  };

  const oldRenderFinal=render;
  render=function(){return oldRenderFinal();};
})();
