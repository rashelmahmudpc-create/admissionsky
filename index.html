<script>
/* ADMISSION HUB, Global Appearance Engine (blueprint §18):
   light / dark / system / green (Premium Green). Single source of truth:
   <html data-theme="...">, app chrome, profile, sheets all follow. */
(function () {
  var KEY = 'ah-appearance';
  var MODES = ['light', 'dark', 'system', 'green'];
  function get() {
    try { var v = localStorage.getItem(KEY); return MODES.indexOf(v) >= 0 ? v : 'light'; }
    catch (_) { return 'light'; }
  }
  function resolved() {
    var m = get();
    if (m === 'system') {
      try { return (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'; }
      catch (_) { return 'light'; }
    }
    return m;
  }
  function apply() {
    var r = resolved();
    var root = document.documentElement;
    if (r === 'light') { root.removeAttribute('data-theme'); root.style.colorScheme = 'light'; }
    else { root.setAttribute('data-theme', r); root.style.colorScheme = (r === 'green') ? 'light' : r; }
    try {
      var dark = (r === 'dark' || r === 'midnight');
      var inSky = !!(document.getElementById('app') && document.getElementById('app').classList.contains('sky'));
      var color = inSky ? (dark ? '#0B1020' : '#F6F9FF') : (dark ? (r === 'midnight' ? '#071512' : '#121212') : (r === 'green' ? '#eef7f1' : '#edf7f1'));
      var metas = document.querySelectorAll('meta[name="theme-color"]');
      /* Every theme-color tag, including the media-scoped light/dark ones the
         mobile browser actually reads, so the status bar matches the app. */
      metas.forEach(function (m) { m.setAttribute('content', color); });
      root.style.setProperty('--ah-chrome', color);
      if (document.body) document.body.style.backgroundColor = color;
    } catch (_) {}
  }
  function set(mode) {
    if (MODES.indexOf(mode) < 0) mode = 'light';
    try { localStorage.setItem(KEY, mode); } catch (_) {}
    apply();
    try { window.dispatchEvent(new CustomEvent('ah:appearance', { detail: { mode: mode, resolved: resolved() } })); } catch (_) {}
  }
  try { if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { if (get() === 'system') apply(); }); } catch (_) {}
  window.AhAppearance = { get: get, set: set, resolved: resolved, apply: apply };
  apply();
})();

/* Text size engine - the owner's call (2026-10-22): pinch-zoom stays OFF so the
   layout can never be scaled into a broken state, and the student gets a real
   setting instead. Every px font-size in this file reads --ah-ts, so this one
   variable resizes all text at once. Icons are inline SVG (not a font), so they
   keep their exact size and the app's face does not move. The AI composer lives
   in ai-agent-chat.js and keeps its literal 16px: below that iOS Safari zooms
   the whole page on focus, which is the bug that guard exists for. */
(function () {
  var KEY = 'ah-textscale';
  var STEPS = [0.9, 1, 1.15, 1.3];
  function get() {
    try { var v = parseFloat(localStorage.getItem(KEY)); return STEPS.indexOf(v) >= 0 ? v : 1; }
    catch (_) { return 1; }
  }
  function apply(v) {
    try { document.documentElement.style.setProperty('--ah-ts', String(v == null ? get() : v)); } catch (_) {}
  }
  function set(v) {
    if (STEPS.indexOf(v) < 0) v = 1;
    try { localStorage.setItem(KEY, String(v)); } catch (_) {}
    apply(v);
    try { window.dispatchEvent(new CustomEvent('ah:textscale', { detail: { scale: v } })); } catch (_) {}
  }
  window.AhTextScale = { get: get, set: set, apply: apply, steps: STEPS };
  apply();
})();

/* ADMISSION HUB, Global i18n Engine (blueprint §17): bn (default) / en.
   Canonical key: ahLang (AI page reads it too). Markup contract for the
   whole app: [data-bn]/[data-en] text, [data-ph-bn]/[data-ph-en] placeholder,
   [data-aria-bn]/[data-aria-en] aria-label. */
(function () {
  var KEY = 'ahLang';
  var LANGS = ['bn', 'en'];
  function get() {
    try { var v = localStorage.getItem(KEY); return LANGS.indexOf(v) >= 0 ? v : 'bn'; }
    catch (_) { return 'bn'; }
  }
  function apply(root) {
    var lang = get();
    var scope = root || document;
    scope.querySelectorAll('[data-bn]').forEach(function (el) {
      var t = el.getAttribute(lang === 'bn' ? 'data-bn' : 'data-en');
      if (t != null && t !== '') el.textContent = t;
    });
    scope.querySelectorAll('[data-ph-bn]').forEach(function (el) {
      var t = el.getAttribute(lang === 'bn' ? 'data-ph-bn' : 'data-ph-en');
      if (t != null) el.setAttribute('placeholder', t);
    });
    scope.querySelectorAll('[data-aria-bn]').forEach(function (el) {
      var t = el.getAttribute(lang === 'bn' ? 'data-aria-bn' : 'data-aria-en');
      if (t != null) el.setAttribute('aria-label', t);
    });
    try { document.documentElement.setAttribute('lang', lang === 'bn' ? 'bn' : 'en'); } catch (_) {}
  }
  function set(lang) {
    if (LANGS.indexOf(lang) < 0) lang = 'bn';
    try { localStorage.setItem(KEY, lang); } catch (_) {}
    /* Keep the profile preference agree, because profile-ui reconciles this
       key into `ah-profile-prefs-v1` once at boot and only then. A choice made
       here (the welcome picker is the first control a visitor meets) would
       otherwise stay unsynced, and a stale saved preference outranks `ahLang`
       on the next load, silently restoring Bengali. */
    try {
      var prefsKey = 'ah-profile-prefs-v1';
      var prefs = JSON.parse(localStorage.getItem(prefsKey) || 'null');
      if (prefs && typeof prefs === 'object') {
        prefs.language = lang;
        localStorage.setItem(prefsKey, JSON.stringify(prefs));
      }
    } catch (_) {}
    apply();
    try { window.dispatchEvent(new CustomEvent('ah:lang', { detail: { lang: lang } })); } catch (_) {}
  }
  window.AhI18n = { get: get, set: set, apply: apply };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { apply(); });
  else apply();
})();
</script>

<style>
:root{
  --emerald:#0f6b4f;
  --emerald-d:#0b4f3b;
  --mint:#e7f4ee;
  --bg:#faf9f6;
  --card:#ffffff;
  --text:#1a1d1b;
  --sub:#6b7370;
  --line:#e7e5e0;
  --green:#1e8e5a;
  --red:#c0392b;
  --orange:#c98a2c;
  --radius:14px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  --shadow: 0 4px 12px rgba(0,0,0,0.05);
  --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
/* Launch-shell rule: first paint is a stable mint shell. The data-backed route
   replaces it immediately when ready; a normal usable shell has a hard deadline.
   These read the tokens, not literals: a literal here repainted the whole shell
   light after the owner chose Dark or Premium Green. The two `!important`
   booting rules mirror `--bg`/`--text` so they vary with the theme too. */
html{background:var(--bg);}
html,body,#app{background-color:var(--bg);}
body.app-booting,body.app-booting #app{background:var(--bg)!important;color:var(--text)!important;}
#app>.app-loading{min-height:100dvh;display:grid;place-content:center;justify-items:center;gap:9px;padding:calc(24px + env(safe-area-inset-top,0px)) 24px 24px;color:var(--text);background:var(--bg);text-align:center;opacity:1;}
#app>.app-loading .app-loading-mark{display:grid;place-items:center;width:48px;height:48px;border-radius:15px;background:var(--emerald);color:#fff;font-size:calc(25px * var(--ah-ts,1));box-shadow:0 10px 24px rgba(15,107,79,.18);}
#app>.app-loading b{font-size:calc(15px * var(--ah-ts,1));letter-spacing:-.01em;}
#app>.app-loading span{font-size:calc(12px * var(--ah-ts,1));color:var(--sub);}
[data-theme="dark"]{
  --emerald:#22c55e;
  --emerald-d:#16a34a;
  --mint:#173a2b;
  --bg:#121212;
  --card:#1c1c1e;
  --text:#f2f2f0;
  --sub:#9aa39d;

}

}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{min-height:100%; height:auto; overflow-x:hidden;}
html,body,#app,.page,#examScrollContainer{overflow-anchor:none;}
body{
  margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg); color:var(--text); overscroll-behavior:none;
  touch-action:manipulation; -webkit-user-select:none; user-select:none;
  padding-top:var(--safe-t);
  transition:background .2s ease, color .2s ease;
}input,textarea,[contenteditable]{-webkit-user-select:text; user-select:text;}
button{font-family:inherit;}
/* App-like scrolling: functional scroll, no visible scrollbars (master prompt §30) */
html,body,#app,.setup-scroll,#examScrollContainer{scrollbar-width:none;-ms-overflow-style:none;}
html::-webkit-scrollbar,body::-webkit-scrollbar,#app::-webkit-scrollbar,.setup-scroll::-webkit-scrollbar,#examScrollContainer::-webkit-scrollbar{width:0;height:0;display:none;}
#app{max-width:760px; margin:0 auto; min-height:100%; padding-bottom:calc(82px + var(--safe-b)); overflow-x:hidden;}
/* P16: on a laptop/tablet the phone column would look like a sliver down the
   middle of a wide screen. Widen it and calm the bottom bar into a centred
   floating pill so the app reads as finished, not stretched. Phones are
   untouched, this only ever applies at >=900px. */
@media(min-width:900px){
  body #app{max-width:1080px; padding-bottom:calc(96px + var(--safe-b));}
  body #navRoot .bottomnav{left:50%!important;right:auto!important;width:auto!important;max-width:640px!important;
    transform:translateX(-50%)!important;border-radius:18px!important;
    bottom:calc(14px + var(--safe-b))!important;padding:6px 14px!important;height:auto!important;
    box-shadow:0 14px 34px rgba(14,60,44,.16)!important;}
  .modal{max-width:640px;}
}
#app.no-nav{padding-bottom:calc(24px + var(--safe-b));}
/* Keep navigation outside the scrolling app content and locked to the viewport bottom. */
#navRoot{position:fixed!important;left:0!important;right:0!important;top:auto!important;bottom:0!important;height:calc(74px + var(--safe-b))!important;max-height:none!important;z-index:1000!important;display:block!important;transform:none!important;pointer-events:none!important;}
#navRoot .bottomnav{position:fixed!important;left:0!important;right:0!important;top:auto!important;bottom:0!important;width:100%!important;max-width:none!important;height:calc(74px + var(--safe-b))!important;margin:0!important;transform:none!important;visibility:visible!important;pointer-events:auto!important;}
body.modal-open #navRoot{visibility:hidden!important;pointer-events:none!important;}
#modalRoot{position:relative;z-index:2000;}
.hide{display:none !important;}
.page{overflow-wrap:break-word; word-break:break-word;}

/* Top bar */
.topbar{position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter:blur(8px);
  display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--line);}
.topbar h1{font-size:calc(17px * var(--ah-ts,1)); margin:0; flex:1; font-weight:700;}
.iconbtn{background:none; border:none; font-size:calc(19px * var(--ah-ts,1)); padding:6px 8px; border-radius:10px; cursor:pointer; color:var(--emerald-d);}
.iconbtn:active{background:var(--mint);}
.backbtn{background:none;border:none;font-size:calc(20px * var(--ah-ts,1));padding:4px 6px;color:var(--emerald-d);cursor:pointer;}

/* Bottom nav */
.bottomnav{position:static!important; left:auto!important; right:auto!important; top:auto!important; bottom:auto!important; z-index:auto!important; background:var(--card);
  border-top:1px solid var(--line); display:flex; padding-bottom:var(--safe-b);
  max-width:560px; margin:0 auto; opacity:.94; transform:translateY(3px); transition:opacity .3s ease, transform .3s ease;}
.bottomnav:hover{opacity:1; transform:translateY(0);}
.navbtn{flex:1; background:none; border:none; padding:9px 0 8px; display:flex; flex-direction:column;
  align-items:center; gap:2px; color:var(--sub); font-size:calc(10.5px * var(--ah-ts,1)); cursor:pointer;}
.navbtn .ic{font-size:calc(20px * var(--ah-ts,1));}
.navbtn.active{color:var(--emerald);}

.page{padding:14px 16px 24px;}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:16px; box-shadow: var(--shadow); transition: var(--transition);}
.card:active{transform:scale(.985);}
.premium-card{background: linear-gradient(135deg, var(--emerald), var(--emerald-d)); color: #fff; border: none;}
.premium-card .muted{color: rgba(255,255,255,0.8);}
.premium-card .progbar{background: rgba(255,255,255,0.2);}
.premium-card .progbar>div{background: #fff;}
.stat-value{font-size: 22px; font-weight: 800; letter-spacing: -0.5px;}
.stat-label{font-size: 11px; text-transform: uppercase; font-weight: 600; opacity: 0.7; margin-top: 2px;}
.focus-tag{padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 600;}
.focus-tag.revision{background: #fee2e2; color: #ef4444;}
.focus-tag.improving{background: #fef3c7; color: #d97706;}
.focus-tag.strong{background: #dcfce7; color: #16a34a;}
.animate-count{display: inline-block;}
.btn-press{transition: transform 0.1s ease;}
.btn-press:active{transform: translateY(2px);}
@keyframes countUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.fade-in{animation: fadeUp 0.5s ease-out forwards;}
.stagger-1{animation-delay: 0.1s;}
.stagger-2{animation-delay: 0.2s;}
.stagger-3{animation-delay: 0.3s;}
.row{display:flex; align-items:center; gap:10px;}
.between{justify-content:space-between;}
.wrap{flex-wrap:wrap;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
.muted{color:var(--sub); font-size:calc(12.5px * var(--ah-ts,1));}
.big{font-size:calc(26px * var(--ah-ts,1)); font-weight:800;}
.h2{font-size:calc(15px * var(--ah-ts,1)); font-weight:700; margin:18px 0 8px;}
.pill{background:var(--mint); color:var(--emerald-d); font-size:calc(11.5px * var(--ah-ts,1)); padding:3px 9px; border-radius:20px; font-weight:600;}
.pill.red{background:color-mix(in srgb, var(--red) 15%, var(--card)); color:var(--red);}
.pill.orange{background:color-mix(in srgb, var(--orange) 15%, var(--card)); color:var(--orange);}
.btn{background:var(--emerald); color:#fff; border:none; border-radius:11px; padding:12px 14px; font-size:calc(14.5px * var(--ah-ts,1)); font-weight:700; cursor:pointer; width:100%;}

<script>
/* Crash safety net: real errors surface on-screen (invisible unless something breaks). */

  'use strict';
  if (window.__ahCrashWatch) return;
  window.__ahCrashWatch = true;
  let pill = null;
  const trace = (tag, detail) => {
    try {

      // 'unhandledrejection'. Show it once, not twice.

      try { sessionStorage.setItem('ah-last-crash', full); } catch (_) {}

let SYNC_APPLYING_SERVER_ROWS=false;
let STUDENT_SYNC_SCHEDULED=0;
/* Mirror a local write to the server (fire-and-forget; never blocks the write
   and never fails it). The sync engine ignores stores it does not own. */
function announceLocalWrite(store,id,op,doc,updatedAt){
  if(!STUDENT_SYNC_STORES.has(store))return;
  if(SYNC_APPLYING_SERVER_ROWS)return;
  if(doc&&typeof doc==='object'&&doc.syncedAt)return;
  try{
    window.dispatchEvent(new CustomEvent('admissionhub:local-write',{detail:{store,id:String(id),op,doc:op==='delete'?null:doc,updated_at:updatedAt}}));
  }catch(_){}
}
window.addEventListener('admissionhub:sync-apply-start',()=>{SYNC_APPLYING_SERVER_ROWS=true;});
window.addEventListener('admissionhub:sync-apply-end',()=>{SYNC_APPLYING_SERVER_ROWS=false;});
/* After the engine lands server rows, rebuild the in-memory cache once (not per
   row) so the UI shows the restored data without a reload. */
window.addEventListener('admissionhub:sync-applied',()=>{
  if(STUDENT_SYNC_SCHEDULED)return;
  STUDENT_SYNC_SCHEDULED=setTimeout(()=>{
    STUDENT_SYNC_SCHEDULED=0;
    if(typeof loadCache!=='function')return;
    Promise.resolve(loadCache()).then(()=>{
      try{if(typeof render==='function')render();}catch(_){}
      try{window.dispatchEvent(new CustomEvent('admission:boot-ready',{detail:{storageMode:STORAGE_MODE,sync:true}}));}catch(_){}
    }).catch(()=>{});
  },300);
});
function dbPut(store,obj){
  if(!obj||typeof obj!=='object')return Promise.resolve(obj);
  if(obj.id===undefined||obj.id===null||obj.id==='')obj.id='auto-'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  if(obj.updatedAt===undefined)obj.updatedAt=Date.now();
  if(!persistentDataScope()){MEMORY_DB.get(store)?.set(obj.id,{...obj});announceLocalWrite(store,obj.id,'put',obj,obj.updatedAt);return Promise.resolve(obj);}
  const deferred=waitForBootStorage(()=>dbPut(store,obj));if(deferred)return deferred;
  if(!DB)return Promise.reject(new Error('Account storage is unavailable'));
  return runDbRequest(store,'readwrite',objectStore=>objectStore.put(toScopedRecord(obj))).then(()=>{announceLocalWrite(store,obj.id,'put',obj,obj.updatedAt);return obj;});
}
function dbDelRaw(store,id){
  if(!persistentDataScope()){MEMORY_DB.get(store)?.delete(id);announceLocalWrite(store,id,'delete',null,Date.now());return Promise.resolve(true);}
  const deferred=waitForBootStorage(()=>dbDelRaw(store,id));if(deferred)return deferred;
  if(!DB)return Promise.reject(new Error('Account storage is unavailable'));
  return runDbRequest(store,'readwrite',objectStore=>objectStore.delete(scopedRecordId(id))).then(()=>{announceLocalWrite(store,id,'delete',null,Date.now());return true;});
}
async function dbDel(store,id){
  if(store==='questions'){
    const question=await dbGet(store,id);
    if(question){
      await dbPut('deletedQuestions',{...question,deletedAt:Date.now(),deletedFrom:'question-bank'});
      return dbDelRaw(store,id);
    }
  }
  return dbDelRaw(store,id);
}
function dbDelPermanent(store,id){return dbDelRaw(store,id);}
async function dbClear(store){
  const counts=await dbClearStoresAtomically([store]);
  return counts[store]||0;
}
async function dbClearStoresAtomically(stores){
  const names=[...new Set((stores||[]).filter(Boolean))];
  const counts=Object.create(null);
  if(!names.length)return counts;
  if(!persistentDataScope()){
    for(const store of names){
      const rows=[...(MEMORY_DB.get(store)?.values()||[])];
      counts[store]=rows.length;
      for(const row of rows) announceLocalWrite(store,row.id,'delete',null,Date.now());
      MEMORY_DB.get(store)?.clear();
    }
    return counts;
  }
  const deferred=waitForBootStorage(()=>dbClearStoresAtomically(names));
  if(deferred)return deferred;
  if(!DB)throw new Error('Account storage is unavailable');
  const KeyRange=window.IDBKeyRange;
  if(!KeyRange||typeof KeyRange.bound!=='function')throw new Error('Scoped data reset is unavailable in this browser');
  const prefix=String(DATA_SCOPE)+'::';
  const range=KeyRange.bound(prefix,prefix+'\uffff');
  const syncedIds=new Map();
  await queueDb(()=>new Promise((resolve,reject)=>{
    let tx,settled=false;
    try{
      tx=DB.transaction(names,'readwrite');
      for(const name of names){
        const objectStore=tx.objectStore(name);
        const countRequest=objectStore.count(range);
        countRequest.onsuccess=()=>{counts[name]=Number(countRequest.result)||0;};
        if(STUDENT_SYNC_STORES.has(name)){
          const rowsRequest=objectStore.getAll(range);
          rowsRequest.onsuccess=()=>{syncedIds.set(name,(rowsRequest.result||[]).map(fromScopedRecord).filter(Boolean).map(row=>String(row.id)));};
        }
        // Range-delete by scoped primary key; do not deserialize Blob/File values.
        objectStore.delete(range);
      }
      tx.oncomplete=()=>{if(!settled){settled=true;resolve(true);}};
      tx.onerror=()=>{if(!settled){settled=true;reject(tx.error||new Error('Scoped data reset failed'));}};
      tx.onabort=()=>{if(!settled){settled=true;reject(tx.error||new Error('Scoped data reset aborted'));}};
    }catch(error){try{tx?.abort();}catch(_){}if(!settled){settled=true;reject(error);}}
  }));
  for(const [store,ids] of syncedIds)for(const id of ids)announceLocalWrite(store,id,'delete',null,Date.now());
  return counts;
}
async function dbPutMany(store,arr){for(const o of arr) await dbPut(store,o); return true;}

/* ---------------- in-memory cache (mirrors DB, refreshed on write) ---------------- */
const CACHE={subjects:[],topics:[],questions:[],deletedQuestions:[],exams:[],examResults:[],mistakes:[],vocabulary:[],vocabularyMaster:[],dailyStats:[],activityLogs:[],notes:[],settings:{},admissionPlans:[],planDays:[]};
// Cache reads may overlap after a fast action. Only the newest completed read may update the UI cache.
let CACHE_LOAD_VERSION=0;
let CACHE_LOAD_PROMISE=Promise.resolve(true);
window.__admissionBootStatus='loading';
window.__admissionFinalModulesReady=false;

function normalizeExamResult(r){
  if(!r) return r;
  const count=Number(r.questionCount||r.totalQuestions||(r.snapshot||[]).length||0);
  const time=Number(r.timeUsed||r.totalTime||0);
  const correct=Number(r.correct||0), wrong=Number(r.wrong||0), skipped=Number(r.skipped||0);
  const marks=Number(r.configuration?.marksPerQ??r.marksPerQ??1)||1;
  const positive=Number(r.positive??(correct*marks));
  const storedScore=Number(r.score??(positive-Number(r.negativeMarks??r.negative??0)));
  const negative=Number(r.negativeMarks??r.negative??Math.max(0,positive-storedScore));
  return {...r,
    questionCount:count, totalQuestions:count, timeUsed:time, totalTime:time,
    averageTimePerQuestion:Number(r.averageTimePerQuestion??r.avgTimePerQuestion??(time/Math.max(1,count))),
    avgTimePerQuestion:Number(r.avgTimePerQuestion??r.averageTimePerQuestion??(time/Math.max(1,count))),
    negativeMarks:Math.max(0,negative), negative:Math.max(0,negative),
    accuracy:Number(r.accuracy??((correct+wrong)?correct/(correct+wrong)*100:0)),
    subjects:Array.isArray(r.subjects)?r.subjects:[], topics:Array.isArray(r.topics)?r.topics:[],
    snapshot:Array.isArray(r.snapshot)?r.snapshot:[],
    subjectBreakdown:r.subjectBreakdown||null, topicBreakdown:r.topicBreakdown||null,
    timeAnalysis:r.timeAnalysis||null,
    positive, score:storedScore, attemptRate:Number(r.attemptRate??(count?(correct+wrong)/count*100:0)),
    testType:r.testType||((r.configuration&&r.configuration.testType)||((r.configuration&&r.configuration.mistakeRevision)?'mistake':(r.mode==='mock'?'mock':'flash')))
  };
}
function examTypeLabel(r){
  const t=normalizeExamResult(r).testType;
  return ({mock:'Mock Test',flash:'Flash Test',mistake:'Mistake Test',weak:'Weak Topic Test',custom:'Custom Test'})[t]||((r.mode||'flash').toUpperCase()+' TEST');
}
function loadCache(){
  const loadVersion=++CACHE_LOAD_VERSION;
  const task=(async()=>{
    const read=async(store,fallback=[])=>{
      try{const value=await dbGetAll(store);return Array.isArray(value)?value.filter(Boolean):fallback;}
      catch(error){console.warn(`[Admission Hub] Could not read ${store}; keeping the app usable.`,error);return fallback;}
    };
    const [subjects,topics,questions,deletedQuestions,exams,examResults,mistakes,vocabulary,vocabularyMaster,dailyStats,activityLogs,notes,settings,admissionPlans,planDays]=await Promise.all([
      read('subjects'), read('topics'), read('questions'), read('deletedQuestions'), read('exams'),
      read('examResults'), read('mistakes'), read('vocabulary'), read('vocabularyMaster'), read('dailyStats'),
      read('activityLogs'), read('notes'), read('settings'), read('ADMISSION_PLANS'), read('PLAN_DAYS')
    ]);
    // A superseded caller waits for the newest complete read before allowing its renderer to continue.
    if(loadVersion!==CACHE_LOAD_VERSION) return CACHE_LOAD_PROMISE;
    CACHE.subjects=subjects; CACHE.topics=topics; CACHE.questions=questions; CACHE.deletedQuestions=deletedQuestions; CACHE.exams=exams;
    CACHE.examResults=examResults.map(normalizeExamResult).filter(Boolean); CACHE.mistakes=mistakes;
    CACHE.vocabulary=vocabulary; CACHE.vocabularyMaster=vocabularyMaster;
    CACHE.dailyStats=dailyStats; CACHE.activityLogs=activityLogs; CACHE.notes=notes;
    CACHE.settings=(settings[0]&&typeof settings[0]==='object')?settings[0]:defaultSettings();
    CACHE.admissionPlans=admissionPlans; CACHE.planDays=planDays;
    return true;
  })();
  CACHE_LOAD_PROMISE=task;
  return task;
}

function defaultSettings(){
  return {id:'main', theme:'light', animation:'on', sound:'off', feedback:'visual',
    dailyTarget:100, examDefaults:{count:20,duration:20,negative:0,marksPerQ:1,mode:'mock'},
    qPrefs:{showExplanation:true,showQNumber:true,randomizeQ:false,randomizeOpt:false,oneScreen:true}};
}

/* ---------------- seed default data (only if empty) ---------------- */
async function seedIfEmpty(){
  const [subs,meta,settings]=await Promise.all([
    dbGetAll('subjects'),
    dbGet('appMeta','flags'),
    dbGet('settings','main')
  ]);
  if(subs.length===0 && !meta){
    const defaults=[
      {name:'বাংলা', icon:'📘', color:'#0f6b4f'},
      {name:'English', icon:'📗', color:'#0b4f3b'},
      {name:'GK', icon:'🌍', color:'#c98a2c'},
      {name:'IBA / Math', icon:'🧮', color:'#5b6bd6'}
    ];
    let order=0;
    for(const d of defaults){
      await dbPut('subjects',{id:uid(), name:d.name, icon:d.icon, color:d.color, order:order++, createdAt:Date.now()});
    }
  }
  const bootstrapWrites=[];
  if(!meta) bootstrapWrites.push(dbPut('appMeta',{id:'flags', seeded:true, createdAt:Date.now()}));
  if(!settings) bootstrapWrites.push(dbPut('settings', defaultSettings()));
  if(bootstrapWrites.length) await Promise.all(bootstrapWrites);
}

let DATA_SCOPE_CHANGE=0;
/* One-time adoption of pre-account (unscoped) local records into the account
 * that just signed in. Relabels in place, never overwrites account rows, never
 * touches another account's rows. See legacy-adoption.js. */
async function adoptLegacyRecords(scope){
  try{
    if(!scope||typeof window.AHLegacyAdoption!=='object')return;
    if(!persistentDataScope())return;
    await waitForBootStorage(()=>true);
    await window.AHLegacyAdoption.migrate({
      scope,
      stores:STORES,
      scanStore:dbScanRaw,
      writeStore:dbRelabelRaw,
      flagStore:{read:k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch{return null}},write:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}},
      snapshot:()=>window.AdmissionDataProtection&&window.AdmissionDataProtection.snapshot?window.AdmissionDataProtection.snapshot(DB_NAME,'pre-legacy-adoption'):null,
      onAdopted:(store,ops)=>{for(const op of ops){const bare={...op.doc,id:op.doc.__ahId};delete bare.__ahOwner;delete bare.__ahId;announceLocalWrite(store,bare.id,'put',bare,op.doc.updatedAt||Date.now());}},
      log:(...a)=>console.info('[LegacyAdoption]',...a),
      warn:(...a)=>console.warn('[LegacyAdoption]',...a)
    });
  }catch(error){console.warn('[LegacyAdoption] skipped safely.',error);}
}
window.addEventListener('admissionhub:authchange',event=>{
  const detail=event&&event.detail||{};
  const next=detail.authenticated===true&&/^[A-Za-z0-9_-]{8,128}$/.test(String(detail.user&&detail.user.id||''))?String(detail.user.id):'';
  if(next===DATA_SCOPE)return;
  const change=++DATA_SCOPE_CHANGE;
  DATA_SCOPE=next;
  try{sessionStorage.removeItem('admissionHub:performance:activeExamBackup:v1');}catch(_){}
  if(!next) MEMORY_DB.forEach(store=>store.clear());
  Promise.resolve()
    .then(()=>adoptLegacyRecords(next))
    .then(seedIfEmpty).then(loadCache).then(()=>{
    if(change!==DATA_SCOPE_CHANGE)return;
    try{if(typeof ActiveExam!=='undefined')ActiveExam=null;}catch(_){}
    try{if(typeof render==='function')render();}catch(_){}
  }).catch(error=>console.warn('[Admission Hub] Account data scope switch failed safely.',error));
});

async function recordCompletedExamDaily(result){

  const key=todayKey(new Date(result.date||Date.now()));

    grossScore:round2(Number(existing.grossScore||0)+Number(result.positive||0)),
    negativeScore:round2(Number(existing.negativeScore||0)+Number(result.negativeMarks??result.negative??0)),
    netScore:round2(Number(existing.netScore||0)+Number(result.score||0)),
    bestScore:Math.max(Number(existing.bestScore??-Infinity),Number(result.score||0)),
    lastScore:Number(result.score||0),lastExamAt:Number(result.completedAt||result.date||Date.now()),updatedAt:Date.now()};
  await dbPut('dailyStats',next);
  CACHE.dailyStats=await dbGetAll('dailyStats');
  window.dispatchEvent(new CustomEvent('admission:activity',{detail:{type:'TEST_COMPLETED',resultId:result.id,score:result.score,negative:result.negativeMarks||0,day:key,questionCount:result.questionCount,correct:result.correct,wrong:result.wrong,skipped:result.skipped,accuracy:result.accuracy,duration:result.timeUsed||result.totalTime,mode:result.mode,testType:result.testType}}));
  return next;
}

const Router={ path:(location.hash.slice(1).split('?')[0]||'dashboard'), params:{}, };
// PWA launch always opens the existing Dashboard; 90 Day Planner remains available at progress/plan.
(function normalizePwaLaunch(){
  try{
    const source=new URLSearchParams(location.search).get('source');
    const launchPath=location.hash.replace(/^#\/?/,'').split('?')[0] || 'dashboard';
    if(source==='pwa' && launchPath !== 'dashboard' && launchPath !== 'exam/running'){
      history.replaceState(null,document.title,location.pathname+location.search+'#dashboard');
      Router.path='dashboard';
    }
  }catch(_){/* keep normal startup safe if URL parsing is unavailable */}
})();
function navigate(path){
  const next=String(path||'dashboard').replace(/^#\/?/,'');
  const current=location.hash.replace(/^#\/?/,'');
  Router.path=next.split('?')[0]||'dashboard';
  if(current===next){
    if(typeof window.__admissionRenderRoute==='function') window.__admissionRenderRoute();
    else if(typeof window.render==='function') window.render();
  }else{
    location.hash=next;
  }
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',()=>{
  const raw=location.hash.replace(/^#\/?/,'')||'dashboard';
  Router.path=raw.split('?')[0]||'dashboard';
  if(typeof window.__admissionRenderRoute==='function') window.__admissionRenderRoute();
  else if(typeof window.render==='function') window.render();
});

function baseTab(path){
  if(path.startsWith('ai-chat')) return ''; /* মালিক-নির্দেশ ২০২৬-০৯-০৮: AI চ্যাট-রুট সম্পূর্ণ বাদ, removedRoute-এ redirect */
  if(path.startsWith('smart-formatter')) return 'smart-formatter';
  /* History এখন Exam সেকশনের ভিতরে, তাই Exam tab-ই active হয়। */
  if(path.startsWith('exam')||path.startsWith('history')) return 'exam';
  if(path.startsWith('question-bank')||path.startsWith('subject')||path.startsWith('topic')||path.startsWith('question')||path.startsWith('add-question')||path.startsWith('edit-question')) return 'question-bank';
  /* Mistake Bank ও Smart Revision এখন Bank-এর ভিতরের টুল। */
  if(path==='mistakes-bank'||path==='smart-revision') return 'question-bank';
  if(path.startsWith('notes')) return '';
  if(path==='notifications') return ''; /* full-screen inbox, no bottom-nav tab (bell entry) */
  if(path.startsWith('study-hub/quick-notes')) return 'study-hub/quick-notes';
  if(path.startsWith('progress/plan')) return 'dashboard';
  if(path.startsWith('progress')) return 'dashboard';
  if(path==='my-profile') return 'my-profile'; /* Phase 7, Profile tab (route name avoids the retired 'profile' legacy route) */
  return 'dashboard';
}

/* Profile renderer missing (profile-ui.js failed to load/run), a VISIBLE,
 * recoverable state instead of silently re-rendering the dashboard

/* A tool's script can finish AFTER the user reaches its route, a slow link, or
 * a device still on a stale shell. The old behavior stranded them on a dead
 * "লোড হয়নি" card until they pressed Retry by hand (owner screenshots
 * 2026-10-12: "ভাই এসব কি তাহলে", path=ai inside the card). Watch for the
 * renderer and re-render the moment it is ready, but only while the user is
 * still on that same route, never yank them off a page they moved to. */
const LAZY_RENDERER = { ai: 'renderAiAgentPage', dictionary: 'renderDictionaryV2', 'question-bank/settings': 'renderQuestionBankV2' };
const __ahRenderWait = {};
function waitForRenderer(path, test){
  if (typeof __ahRenderWait[path] !== 'undefined') return;
  let tries = 40; // ~12s
  const tick = () => {
    if (test()) { delete __ahRenderWait[path]; if (Router.path === path) render(); return; }
    if (--tries <= 0) { delete __ahRenderWait[path]; return; }
    __ahRenderWait[path] = setTimeout(tick, 300);
  };
  __ahRenderWait[path] = setTimeout(tick, 300);
}
function renderProfileFallback(){
  waitForRenderer('my-profile', () => typeof window.renderProfilePage === 'function');
  renderShell(`<div style="text-align:center;padding:56px 20px"><div style="font-size:calc(40px * var(--ah-ts,1))">👤</div><h2 style="margin:10px 0 6px;font-size:calc(18px * var(--ah-ts,1))">Profile লোড হয়নি</h2><p style="font-size:calc(13px * var(--ah-ts,1));color:#64748b;margin:0 auto;max-width:380px;line-height:1.7">একটু পর আবার চেষ্টা করুন, বা পেজটা Refresh করুন।</p><div style="display:flex;gap:10px;justify-content:center;margin-top:16px"><button class="btn" onclick="location.reload()">🔄 Retry</button><button class="btn ghost" onclick="navigate('dashboard')">🏠 Home</button></div></div>`,{title:'Profile'});
}
function renderLazyToolFallback(path){
  const fnName = LAZY_RENDERER[path];
  if (fnName) waitForRenderer(path, () => typeof window[fnName] === 'function');
  const diag=[];
  try{diag.push('path='+path);}catch(_){}

function getStudyTimeToday(){
  const key=todayKey();
  let total=0;
  CACHE.examResults.forEach(r=>{
    if(todayKey(new Date(r.date))===key) total += (r.timeUsed||0);
  });
  const daily = (CACHE.dailyStats || []).find(row => row.id === key);
  const liveSeconds = Math.floor(Number(daily?.timeMs || 0) / 1000);
  return Math.max(total, liveSeconds);
}

function getSmartFocusTopics(){
  const topicStats = {};
  CACHE.examResults.forEach(r => {
    (r.snapshot || []).forEach(q => {
      if (!topicStats[q.topicId]) topicStats[q.topicId] = { correct: 0, total: 0, name: topicName(q.topicId) };
      topicStats[q.topicId].total++;
      if (q.status === 'correct') topicStats[q.topicId].correct++;
    });
  });

  const mistakes = {};
  CACHE.mistakes.forEach(m => {
    const q = CACHE.questions.find(x => x.id === m.questionId);
    if (q) {
      if (!mistakes[q.topicId]) mistakes[q.topicId] = 0;
      mistakes[q.topicId] += m.wrongCount;
    }
  });

  const results = Object.keys(topicStats).map(tid => {
    const s = topicStats[tid];
    const acc = s.total > 0 ? (s.correct / s.total) * 100 : 0;
    const mCount = mistakes[tid] || 0;
    let status = 'strong', label = 'Strong', cls = 'strong';
    if (mCount > 0 && (acc < 60 || mCount > 5)) { status = 'revision'; label = 'Needs Revision'; cls = 'revision'; }
    else if (acc < 85 || mCount > 2) { status = 'improving'; label = 'Improving'; cls = 'improving'; }
    return { id: tid, name: s.name, acc, mCount, status, label, cls };
  });

  return results.sort((a, b) => {
    if (a.status === 'revision' && b.status !== 'revision') return -1;
    if (a.status !== 'revision' && b.status === 'revision') return 1;
    return b.mCount - a.mCount;
  }).slice(0, 3);
}

function resultCounts(r){
  const snapshot=Array.isArray(r?.snapshot)?r.snapshot:[];
  if(snapshot.length){
    const correct=snapshot.filter(q=>q&&q.status==='correct').length;
    const wrong=snapshot.filter(q=>q&&q.status==='wrong').length;
    const skipped=snapshot.length-correct-wrong;
    return {total:snapshot.length,correct,wrong,skipped:Math.max(0,skipped)};
  }
  const correct=Math.max(0,Number(r?.correct||0));
  const wrong=Math.max(0,Number(r?.wrong||0));
  const declaredTotal=Math.max(correct+wrong,Number(r?.questionCount||r?.totalQuestions||0));
  const skipped=Math.max(0,declaredTotal-correct-wrong);
  return {total:correct+wrong+skipped,correct,wrong,skipped};
}
function todayPerformance(){
  const key=todayKey(), out={total:0,correct:0,wrong:0,skipped:0};
  CACHE.examResults.forEach(r=>{if(todayKey(new Date(r.date))!==key)return;const c=resultCounts(r);out.total+=c.total;out.correct+=c.correct;out.wrong+=c.wrong;out.skipped+=c.skipped;});
  out.attempted=out.correct+out.wrong; out.accuracy=out.attempted?round2(out.correct/out.attempted*100):0; return out;
}
function computeLifetimeStats(){
  const results=CACHE.examResults;
  let totalQuestions=0, attempted=0, correct=0, wrong=0, skipped=0, exams=results.length, mock=0, flash=0, points=0, negPoints=0;
  let best=0, bestAcc=0, sumScore=0;
  results.forEach(r=>{
    const c=resultCounts(r); totalQuestions+=c.total; attempted+=c.correct+c.wrong; correct+=c.correct; wrong+=c.wrong; skipped+=c.skipped;
    if(r.mode==='mock') mock++; else flash++;
    points += Number(r.positive||0); negPoints += Number(r.negative||r.negativeMarks||0); sumScore += Number(r.score||0);
    if(Number(r.score||0)>best) best=Number(r.score||0);
    if(c.correct+c.wrong>0){ const a=c.correct/(c.correct+c.wrong)*100; if(a>bestAcc) bestAcc=a; }
  });
  const accuracy = attempted>0 ? round2(correct/attempted*100) : 0;
  const avgScore = exams>0 ? round2(sumScore/exams) : 0;
  return {totalQuestions, attempted, correct, wrong, skipped, exams, mock, flash, points:round2(points), negPoints:round2(negPoints), accuracy, avgScore, best:round2(best), bestAcc:round2(bestAcc)};
}
function computeStreak(){
  const days=new Set(CACHE.activityLogs.map(a=>a.day));
  CACHE.examResults.forEach(r=>days.add(todayKey(new Date(r.date))));
  let streak=0; let d=new Date();
  while(true){
    const key=todayKey(d);
    if(days.has(key)){ streak++; d.setDate(d.getDate()-1); } else break;
  }
  return streak;
}
function subjectPerformance(){
  const map={};
  CACHE.subjects.forEach(s=>map[s.id]={name:s.name, icon:s.icon, correct:0, wrong:0});
  CACHE.examResults.forEach(r=>{
    (r.snapshot||[]).forEach(q=>{
      if(!map[q.subjectId]) return;
      if(q.status==='correct') map[q.subjectId].correct++;
      else if(q.status==='wrong') map[q.subjectId].wrong++;
    });
  });
  return Object.values(map).map(s=>({...s, acc: (s.correct+s.wrong)>0 ? round2(s.correct/(s.correct+s.wrong)*100) : null}))
    .filter(s=>s.acc!==null).sort((a,b)=>b.acc-a.acc);
}

function nextQuestionNumberForTopic(topicId, excludeId=''){
  const topicKey=String(topicId||'');
  const scoped=CACHE.questions.filter(q=>String(q.topicId||'')===topicKey && String(q.id||'')!==String(excludeId||''));
  const numbers=scoped.map(q=>Number(q.questionNumber ?? q.number)).filter(Number.isFinite);

const ExplorerState={
  query:'', subjectId:'', topicId:'', status:'all', difficulty:'all',
  bookmarked:false, mistakes:false, recentlyAdded:false, sort:'newest',
  visibleCount:40, selected:new Set()
};
function explorerStats(q){return q.stats||{attempts:0,correct:0,wrong:0};}
function explorerMistake(q){
  const st=explorerStats(q);
  return st.wrong>0 || CACHE.mistakes.some(m=>m.questionId===q.id && (m.wrongCount||0)>0);
}
function explorerMostRecent(q){
  const m=CACHE.mistakes.find(x=>x.questionId===q.id);
  return Math.max(q.createdAt||0,q.updatedAt||0,m&&m.lastWrongAt||0);
}
function explorerMatchesSearch(q){
  const term=(ExplorerState.query||'').trim().toLowerCase();
  if(!term) return true;
  const hay=[q.question,...(q.options||[]),q.explanation,subjectName(q.subjectId),topicName(q.topicId),...(q.tags||[]),...(q.keywords||[])];
  return hay.some(v=>String(v||'').toLowerCase().includes(term));
}
function explorerFilterAndSort(){
  const now=Date.now(), recentCutoff=now-30*24*60*60*1000;
  let rows=CACHE.questions.filter(q=>{
    const st=explorerStats(q);
    if(!explorerMatchesSearch(q)) return false;
    if(ExplorerState.subjectId && q.subjectId!==ExplorerState.subjectId) return false;
    if(ExplorerState.topicId && q.topicId!==ExplorerState.topicId) return false;
    if(ExplorerState.status==='correct' && !(st.correct>0)) return false;
    if(ExplorerState.status==='wrong' && !(st.wrong>0)) return false;
    if(ExplorerState.status==='unattempted' && (st.attempts>0)) return false;
    if(ExplorerState.difficulty!=='all' && (q.difficulty||'medium')!==ExplorerState.difficulty) return false;
    if(ExplorerState.bookmarked && q.bookmarked!==true) return false;
    if(ExplorerState.mistakes && !explorerMistake(q)) return false;
    if(ExplorerState.recentlyAdded && (q.createdAt||0)<recentCutoff) return false;
    return true;
  });
  const alpha=(q)=>String(q.question||'').toLocaleLowerCase();
  rows.sort((a,b)=>{
    const sa=explorerStats(a), sb=explorerStats(b), ma=explorerMistake(a)?Math.max(sa.wrong||0,CACHE.mistakes.find(m=>m.questionId===a.id)?.wrongCount||0):0, mb=explorerMistake(b)?Math.max(sb.wrong||0,CACHE.mistakes.find(m=>m.questionId===b.id)?.wrongCount||0):0;
    let n=0;
    if(ExplorerState.sort==='oldest') n=(a.createdAt||0)-(b.createdAt||0);
    else if(ExplorerState.sort==='alphabetical') n=alpha(a).localeCompare(alpha(b));
    else if(ExplorerState.sort==='most-attempted') n=(sb.attempts||0)-(sa.attempts||0);
    else if(ExplorerState.sort==='least-attempted') n=(sa.attempts||0)-(sb.attempts||0);
    else if(ExplorerState.sort==='most-mistakes') n=mb-ma;
    else n=(b.createdAt||0)-(a.createdAt||0);
    return n || String(a.id).localeCompare(String(b.id));
  });
  return rows;
}

function setupBankFeedObserver(){

async function commitPendingBankAnswers(){
  const rows=Object.values(PendingBankAnswers);if(!rows.length)return;
  const now=Date.now();
  for(const row of rows){
    const q=CACHE.questions.find(x=>x.id===row.qid);if(!q)continue;
    q.stats=q.stats||{attempts:0,correct:0,wrong:0};const priorAttempts=Number(q.stats.attempts||0);q.stats.attempts++;q.stats[row.isCorrect?'correct':'wrong']++;q.updatedAt=now;await dbPut('questions',q);
    if(!row.isCorrect){
      let m=CACHE.mistakes.find(x=>x.questionId===row.qid);if(!m)m={id:uid(),questionId:row.qid,wrongCount:0,revisionStatus:'pending',mastered:false};
      m.question=q.question;m.options=q.options||[];m.subjectId=q.subjectId;m.topicId=q.topicId;m.correctAnswerIndex=row.correct;m.correctAnswer=(q.options||[])[row.correct]||'';m.wrongAnswer=(q.options||[])[row.idx]||'';m.selectedAnswer=m.wrongAnswer;m.explanation=q.explanation||'';m.wrongCount=Number(m.wrongCount||0)+1;m.lastWrongAt=now;m.time=now;m.status='needs-review';m.revisionStatus='pending';m.mastered=false;await dbPut('mistakes',m);

async function saveQuestionForm(qid){
  const subjectId=document.getElementById('qfSubject').value;
  const topicId=document.getElementById('qfTopic').value;
  const question=document.getElementById('qfQuestion').value.trim();
  const options=[0,1,2,3].map(i=>document.getElementById('qfOpt'+i).value.trim());
  const answer=parseInt(document.getElementById('qfAnswer').value);
  const explanation=document.getElementById('qfExplain').value.trim();
  const tags=document.getElementById('qfTags').value.split(',').map(t=>t.trim()).filter(Boolean);
  const difficulty=document.getElementById('qfDiff').value;
  if(!question || options.some(o=>!o) || !topicId){toast('Please fill question, 4 options and select a topic'); return;}
  if(qid){
    const q=CACHE.questions.find(x=>x.id===qid);
    Object.assign(q,{subjectId,topicId,question,options,answer,explanation,tags,difficulty,updatedAt:Date.now()});
    await dbPut('questions',q);
  } else {
    await dbPut('questions',{id:uid(),subjectId,topicId,question,options,answer,explanation,tags,difficulty,
      questionNumber:nextQuestionNumberForTopic(topicId), source:'manual', createdAt:Date.now(), updatedAt:Date.now(), stats:{attempts:0,correct:0,wrong:0}});
  }
  CACHE.questions=await dbGetAll('questions');
  toast('Question saved');
  navigate('question-bank');

/* ---------- Parsers ---------- */
function letterToIndex(ch){
  if(!ch) return null;
  const m={'A':0,'B':1,'C':2,'D':3,'ক':0,'খ':1,'গ':2,'ঘ':3};
  const up=ch.trim();
  if(m[up]!==undefined) return m[up];
  const upC=up.toUpperCase();
  if(m[upC]!==undefined) return m[upC];
  return null;
}
function resolveAnswerIndex(raw, options){
  if(raw===null || raw===undefined) return null;
  if(typeof raw==='number') return (raw>=0&&raw<=3)? raw : null;
  const trimmed=String(raw).trim().replace(/^\(|\)$/g,'');
  if(trimmed.length<=2){
    const idx=letterToIndex(trimmed);
    if(idx!==null) return idx;
  }
  const norm=s=>(s||'').trim().toLowerCase().replace(/\s+/g,' ');
  const t=norm(trimmed);
  for(let i=0;i<options.length;i++){ if(options[i] && norm(options[i])===t) return i; }
  const m=trimmed.match(/^([A-Dকখগঘ])/);
  if(m) return letterToIndex(m[1]);
  return null;
}
function hasContent(arr){return arr.some(l=>l.trim().length>0);}

function splitQuestionBlocks(text){
  const lines=text.split(/\r?\n/);
  const headerRe=/^\s*(?:Q(?:uestion)?\.?\s*\d+\s*[:.\)]?|\d+\s*[\.\)])\s*(.*)$/i;
  const blocks=[]; let current=null;
  for(const line of lines){
    const m=line.match(headerRe);
    if(m && (current===null || hasContent(current))){
      if(current) blocks.push(current);
      current=[];
      if(m[1] && m[1].trim()) current.push(m[1].trim());
      continue;
    }
    if(current===null) current=[];
    current.push(line);
  }
  if(current) blocks.push(current);
  return blocks.filter(hasContent);
}
function parseTextBlock(lines){
  const optRe=/^\s*([A-Da-dকখগঘ])\s*[\.\)\-:]\s*(.+)$/;
  const ansRe=/^\s*(?:Correct\s*Answer|Answer|Correct|Ans|উত্তর|সঠিক\s*উত্তর)\s*[:=]\s*(.+?)\s*$/i;
  const expRe=/^\s*(?:Explanation|ব্যাখ্যা|Explain)\s*[:=]\s*(.*)$/i;
  let qLines=[], options={}, answerRaw=null, explanationLines=[], mode='question';
  for(let raw of lines){
    const line=(raw||'').trim();
    if(!line) continue;
    const om=line.match(optRe);
    if(om && mode!=='explanation'){
      const idx=letterToIndex(om[1]);
      if(idx!==null) options[idx]=om[2].trim();
      mode='options'; continue;
    }
    const am=line.match(ansRe);
    if(am){ answerRaw=am[1].trim().replace(/^\(|\)$/g,''); mode='answer'; continue; }
    const em=line.match(expRe);
    if(em){ explanationLines.push(em[1]); mode='explanation'; continue; }
    if(mode==='explanation'){ explanationLines.push(line); continue; }
    qLines.push(line);
  }
  const optionsArr=[0,1,2,3].map(i=>options[i]||'');
  return {
    question: qLines.join(' ').trim(),
    options: optionsArr,
    answerIndex: resolveAnswerIndex(answerRaw, optionsArr),
    explanation: explanationLines.join(' ').trim(),
    tags:[], subjectName:null, topicName:null
  };
}
function parseBulkText(text){
  let blocks=splitQuestionBlocks(text);
  if(blocks.length<=1){
    const paras=text.split(/\n\s*\n+/).map(p=>p.split(/\r?\n/)).filter(hasContent);
    if(paras.length>1) blocks=paras;
  }
  return blocks.map(parseTextBlock);
}

function parseJSONText(text){
  let data;
  try{ data=JSON.parse(text); }
  catch(e){ return {error:'⚠️ Invalid JSON, please check the format and try again.'}; }
  let arr = Array.isArray(data) ? data : (Array.isArray(data.questions) ? data.questions : null);
  if(!arr) return {error:'⚠️ JSON must be an array of questions.'};
  const items = arr.map(item=>{
    if(!item || typeof item!=='object') return null;
    const question = item.question || item.q || item.text || '';
    let options;
    if(Array.isArray(item.options)) options=item.options.slice(0,4);
    else if(item.options && typeof item.options==='object') options=['A','B','C','D'].map(k=>item.options[k]!==undefined?item.options[k]:(item.options[k.toLowerCase()]||''));
    else options=['','','',''];
    while(options.length<4) options.push('');
    const answerRaw = item.answer!==undefined?item.answer : item.correctAnswer!==undefined?item.correctAnswer :
      item.correct_answer!==undefined?item.correct_answer : item.correct!==undefined?item.correct : null;
    const explanation = item.explanation || item.explain || '';
    const tags = Array.isArray(item.tags) ? item.tags : [];
    return {
      question: String(question||'').trim(),
      options: options.map(o=>String(o==null?'':o).trim()),
      answerIndex: resolveAnswerIndex(answerRaw, options),
      explanation: String(explanation||'').trim(),
      tags, subjectName: item.subject||item.subjectName||null, topicName: item.topic||item.topicName||null
    };
  }).filter(Boolean);
  return {items};
}

function htmlToText(node){
  const clone=node.cloneNode(true);
  clone.querySelectorAll('br').forEach(br=>br.replaceWith('\n'));
  clone.querySelectorAll('p,div,li,h1,h2,h3,h4,tr,section').forEach(el=>{ el.insertAdjacentText('afterend','\n'); });
  return clone.textContent;
}
function parseHTMLDoc(htmlStr){
  const doc=new DOMParser().parseFromString(htmlStr,'text/html');
  const candidates=Array.from(doc.querySelectorAll('.question,.mcq,.quiz-question,[class*="question"]'));
  // Prefer outermost question containers; nested question-text/option nodes must not become duplicate records.
  const containers=candidates.filter(c=>!candidates.some(other=>other!==c&&other.contains(c)));
  if(containers.length===0){
    return parseBulkText(htmlToText(doc.body));
  }
  return containers.map(c=>parseTextBlock(htmlToText(c).split('\n')));
}

/* ---------- Validation / dedup ---------- */
function normalizeQ(s){ return (s||'').trim().toLowerCase().replace(/[^\p{L}\p{N}\s]/gu,'').replace(/\s+/g,' ').trim(); }
function buildValidated(raws){
  // Duplicate checks must be scoped to the currently selected destination.
  // A question in another subject/topic is not a duplicate for this import.
  const destSubjectId=ImportState.destSubjectId, destTopicId=ImportState.destTopicId;
  const existingQuestions = (CACHE.questions||[])
    .filter(q=>destSubjectId && destTopicId && String(q.subjectId)===String(destSubjectId) && String(q.topicId)===String(destTopicId))
    .map(q=>({norm:normalizeQ(q.question), id:q.id}));
  const seen=[];
  const validated = raws.map(raw=>{
    raw.options=(raw.options||['','','','']).slice(0,4); while(raw.options.length<4) raw.options.push('');
    if(raw.answerIndex===undefined) raw.answerIndex=null;
    const issues=[];
    if(!raw.question || !raw.question.trim()) issues.push('Question text missing');
    ['A','B','C','D'].forEach((L,i)=>{ if(!raw.options[i] || !raw.options[i].trim()) issues.push('Option '+L+' missing'); });
    if(raw.answerIndex===null || raw.answerIndex<0 || raw.answerIndex>3) issues.push('Missing/invalid correct answer');
    const infoOnly=[];
    if(!raw.explanation || !raw.explanation.trim()) infoOnly.push('Explanation missing');
    const norm=normalizeQ(raw.question||'');
    let isDuplicate=false, duplicateId=null;
    if(norm){
      const existing = existingQuestions.find(eq=>eq.norm===norm);
      if(seen.includes(norm)||existing) isDuplicate=true;
      if(existing) duplicateId=existing.id;
      seen.push(norm);
    }
    let matchedSubjectId=null, matchedTopicId=null;
    if(raw.subjectName){
      const s=CACHE.subjects.find(s=>s.name.trim().toLowerCase()===String(raw.subjectName).trim().toLowerCase());
      if(s){ matchedSubjectId=s.id;
        if(raw.topicName){ const t=CACHE.topics.find(t=>t.subjectId===s.id && t.name.trim().toLowerCase()===String(raw.topicName).trim().toLowerCase()); if(t) matchedTopicId=t.id; }
      }
    }
    return {raw, issues, infoOnly, isDuplicate, duplicateId, matchedSubjectId, matchedTopicId, status: issues.length?'invalid':'valid', selected:true};
  });
  ImportState.validated=validated;
  ImportState.visibleCount=20;
  // Keep destination selection explicit. The parser must never silently choose a subject/topic.
  const selectedSubject = CACHE.subjects.some(s=>String(s.id||'')===String(ImportState.destSubjectId||''));
  if(!selectedSubject) ImportState.destSubjectId = '';
  const selectedTopic = CACHE.topics.some(t=>String(t.id||'')===String(ImportState.destTopicId||'') && String(t.subjectId||'')===String(ImportState.destSubjectId||''));
  if(!selectedTopic) ImportState.destTopicId = '';
}
function reValidateOne(idx){
  const v=ImportState.validated[idx]; const raw=v.raw;
  const issues=[];
  if(!raw.question || !raw.question.trim()) issues.push('Question text missing');
  ['A','B','C','D'].forEach((L,i)=>{ if(!raw.options[i] || !raw.options[i].trim()) issues.push('Option '+L+' missing'); });
  if(raw.answerIndex===null || raw.answerIndex<0 || raw.answerIndex>3) issues.push('Missing/invalid correct answer');
  v.issues=issues; v.status=issues.length?'invalid':'valid';
}

/* ---------- Save (chunked, non-blocking) ---------- */
async function saveImportedQuestions(){
  const st=ImportState;
  if(st.saving){toast('Import is already running, please wait.');return;}
  st.saving=true;
  const destination=Object.freeze({subjectId:String(st.destSubjectId||''),topicId:String(st.destTopicId||'')});
  try{
  const subject = CACHE.subjects.find(s=>String(s.id||'')===destination.subjectId);
  const topic = CACHE.topics.find(t=>String(t.id||'')===destination.topicId && String(t.subjectId||'')===destination.subjectId);
  if(!subject || !topic){ toast('Select a Subject and Topic before importing'); return; }// Re-check destination-scoped duplicates immediately before writing.
  const selected=(st.validated||[]).map(v=>v.selected!==false); const raws=(st.validated||[]).map(v=>v.raw);
  buildValidated(raws); st.validated.forEach((v,i)=>{v.selected=selected[i]!==false});
  // Imports are always additive. Existing questions are preserved and duplicate imports become new records.
  const toSave = st.validated.filter(v=> v.selected && v.status==='valid');
  if(toSave.length===0){ toast('No questions to save'); return; }
  let nextNumber=nextQuestionNumberForTopic(destination.topicId);
  openModal(`<h3>Importing…</h3>
    <div class="progbar"><div id="impProgFill" style="width:0%"></div></div>
    <div class="muted" id="impProgLabel" style="margin-top:8px;">0 / ${toSave.length}</div>`);
  let saved=0;
  for(const v of toSave){
    const subjectId = subject.id;
    const topicId = topic.id;
    const obj={
      id: uid(), subjectId, topicId,
      question: v.raw.question.trim(),
      options: v.raw.options.map(o=>o.trim()),
      answer: v.raw.answerIndex,
      explanation: (v.raw.explanation||'').trim(),
      tags: v.raw.tags||[], difficulty:'medium',
      source: 'import', createdAt: Date.now(), updatedAt: Date.now(),
      stats: {attempts:0,correct:0,wrong:0},
      bookmarked: false,
      questionNumber: nextNumber
    };
    try{ await dbPut('questions', obj); saved++; nextNumber++; }
    catch(e){ console.error(e); }
    if(saved % 20 === 0 || saved===toSave.length){
      const fill=document.getElementById('impProgFill'); const lbl=document.getElementById('impProgLabel');
      if(fill) fill.style.width = Math.round((saved/toSave.length)*100)+'%';
      if(lbl) lbl.textContent = saved+' / '+toSave.length;
      await new Promise(r=>setTimeout(r,0));
    }
  }
  CACHE.questions = await dbGetAll('questions');
  try{
    await dbPut('activityLogs',{id:uid(), day:todayKey(), ts:Date.now(), type:'import', source:st.mode, count:saved});
    CACHE.activityLogs = await dbGetAll('activityLogs');
  }catch(e){}
  closeModal();
  st.lastSavedCount=saved;
  st.lastSkippedCount=0;
  st.lastImportedDuplicateCount=st.validated.filter(v=>v.selected && v.status==='valid' && v.isDuplicate).length;
  st.lastWarningCount=st.validated.filter(v=>v.infoOnly&&v.infoOnly.length).length;
  st.lastSubjectId=st.destSubjectId; st.lastTopicId=st.destTopicId;
  importSetScreen('success');
  }finally{st.saving=false}
}

function parseCustomSerialSpec(raw){
  const text=String(raw||'').replace(/[০-৯]/g,d=>String('০১২৩৪৫৬৭৮৯'.indexOf(d))).replace(/[，、]/g,',').replace(/[–-−]/g,'-').trim();
  if(!text)return {numbers:[],error:'Custom serial লিখুন, যেমন 1-20 বা 45-50।'};
  const numbers=[];
  for(const token of text.split(',')){
    const part=token.trim(); if(!part)continue;
    const m=part.match(/^(\d+)\s*(?:-\s*(\d+))?$/);
    if(!m)return {numbers:[],error:`ভুল serial format: ${part}. উদাহরণ: 1-20,45-50,88`};
    const start=Number(m[1]), end=m[2]===undefined?start:Number(m[2]);
    if(start<1||end<start)return {numbers:[],error:`ভুল serial range: ${part}`};
    if(end-start>2000)return {numbers:[],error:'একটি range সর্বোচ্চ ২০০১টি serial পর্যন্ত দেওয়া যাবে।'};
    for(let n=start;n<=end;n++)numbers.push(n);
  }
  return {numbers:[...new Set(numbers)]};
}function selectCustomSerialQuestions(pool,raw){
  if(!ExamSetup.topicIds||ExamSetup.topicIds.length!==1)return {error:'Custom serial ব্যবহার করতে একটি Topic নির্বাচন করুন।'};
  const spec=parseCustomSerialSpec(raw); if(spec.error)return spec;
  const topicId=ExamSetup.topicIds[0];
  const scoped=pool.filter(q=>String(q.topicId)===String(topicId)).map((q,index)=>({q,index,serial:Number(q.questionNumber??q.number)})).sort((a,b)=>{
    const av=Number.isFinite(a.serial)&&a.serial>0?a.serial:Infinity, bv=Number.isFinite(b.serial)&&b.serial>0?b.serial:Infinity;
    return av-bv||a.index-b.index;
  });
  const bySerial=new Map();
  scoped.forEach((row,index)=>{const serial=Number.isFinite(row.serial)&&row.serial>0?row.serial:index+1;if(!bySerial.has(serial))bySerial.set(serial,row.q);});
  const missing=spec.numbers.filter(n=>!bySerial.has(n));
  if(missing.length)return {error:`এই Topic-এ serial ${missing.slice(0,8).join(', ')} পাওয়া যায়নি${missing.length>8?'সহ':''}।`};
  return {questions:spec.numbers.map(n=>bySerial.get(n))};
}

/* P08, adaptive-testing foundation. A pure, dependency-free selector that reads
   the difficulty/expected-time tags the Question Engine (P07) writes and can
   filter or warm-up-order a paper by difficulty. Kept pure so it is testable
   without a DOM, and defensive so an untagged bank still behaves. */
const ExamSelect=(function(){
  const DIFFS=['easy','medium','hard'];
  const TARGET={easy:0.3,medium:0.5,hard:0.2};
  const FALLBACK_TIME={easy:35,medium:55,hard:85};
  function difficultyOf(q){
    const d=String((q&&q.difficulty)||'').toLowerCase();
    if(DIFFS.includes(d)) return d;
    const eng=window.AhQuestionEngine;
    if(eng&&typeof eng.difficultyOf==='function') return eng.difficultyOf(q);
    return 'medium';
  }
  function expectedTime(q){
    const t=Number(q&&q.expectedTime);
    if(t>0) return t;
    const eng=window.AhQuestionEngine;
    if(eng&&typeof eng.expectedTime==='function') return eng.expectedTime(q);
    return FALLBACK_TIME[difficultyOf(q)]||55;
  }
  function filterByDifficulty(pool,difficulty){
    const list=Array.isArray(pool)?pool:[];
    if(!difficulty||difficulty==='mixed'||difficulty==='all') return [...list];
    return list.filter(q=>difficultyOf(q)===difficulty);
  }
  /* Interleave easy→medium→hard so a paper warms up, without dropping a question. */
  function adaptive(pool){
    const list=Array.isArray(pool)?pool:[];
    const buckets={easy:[],medium:[],hard:[]};
    for(const q of list) buckets[difficultyOf(q)].push(q);
    const out=[];
    while(out.length<list.length){
      for(const d of DIFFS){ if(buckets[d].length) out.push(buckets[d].shift()); }
    }
    return out;
  }
  /* Difficulty mix for a test of `count` questions, from the target weights.
     Rounding drift is absorbed so the parts always add up to the count. */
  function mixFor(count){
    count=Math.max(0,Math.floor(count)||0);
    const parts=DIFFS.map(d=>({d,n:Math.round(count*TARGET[d])}));
    let sum=parts.reduce((a,x)=>a+x.n,0);
    while(sum<count){ parts[1].n++; sum++; }
    while(sum>count){ const m=parts.filter(x=>x.n>0).sort((a,b)=>b.n-a.n)[0]; if(!m) break; m.n--; sum--; }
    return Object.fromEntries(parts.map(x=>[x.d,x.n]));
  }
  /* Difficulty mix for a test of `count` questions, from the target weights.
     Rounding drift is absorbed so the parts always add up to the count. */
  function mixForBand(count, band){
    count=Math.max(0,Math.floor(count)||0);
    let weights=TARGET;
    const eng=typeof self!=='undefined'?self.AhAdaptiveEngine:undefined;
    if(eng&&typeof eng.targetMix==='function') weights=eng.targetMix(band);
    const parts=DIFFS.map(d=>({d,n:Math.round(count*(weights[d]||0))}));
    let sum=parts.reduce((a,x)=>a+x.n,0);
    while(sum<count){ parts[1].n++; sum++; }
    while(sum>count){ const m=parts.filter(x=>x.n>0).sort((a,b)=>b.n-a.n)[0]; if(!m) break; m.n--; sum--; }
    return Object.fromEntries(parts.map(x=>[x.d,x.n]));
  }/* Pick `count` questions matching the target difficulty mix, then warm up. */
  function selectAdaptive(pool,count){
    const list=Array.isArray(pool)?pool:[];
    const buckets={easy:[],medium:[],hard:[]};
    for(const q of list) buckets[difficultyOf(q)].push(q);
    const want=Math.min(count,list.length);
    const mix=mixFor(want);
    const chosen=[];
    for(const d of DIFFS){ for(let i=0;i<mix[d]&&buckets[d].length;i++) chosen.push(buckets[d].shift()); }
    for(const d of DIFFS){ while(chosen.length<want&&buckets[d].length) chosen.push(buckets[d].shift()); }
    return adaptive(chosen).slice(0,want);
  }/* P11, the same selection, but the difficulty mix follows the student's own
     measured band (from the Adaptive Engine) instead of the fixed target. */
  function selectAdaptiveFor(pool,count,band){
    const list=Array.isArray(pool)?pool:[];
    const buckets={easy:[],medium:[],hard:[]};
    for(const q of list) buckets[difficultyOf(q)].push(q);
    const want=Math.min(count,list.length);
    const mix=mixForBand(want,band);
    const chosen=[];
    for(const d of DIFFS){ for(let i=0;i<mix[d]&&buckets[d].length;i++) chosen.push(buckets[d].shift()); }
    for(const d of DIFFS){ while(chosen.length<want&&buckets[d].length) chosen.push(buckets[d].shift()); }
    return adaptive(chosen).slice(0,want);
  }
  function validate(){
    const p=[];
    if(!DIFFS.length) p.push('no difficulties');
    const order=adaptive([{difficulty:'hard'},{difficulty:'medium'},{difficulty:'easy'}]).map(q=>q.difficulty);
    if(order[0]!=='easy'||order[order.length-1]!=='hard') p.push('adaptive warm-up order wrong');
    const mix=mixFor(10); if(mix.easy+mix.medium+mix.hard!==10) p.push('mix does not sum to count');
    const sel=selectAdaptive([{id:1,difficulty:'easy'},{id:2,difficulty:'hard'},{id:3,difficulty:'medium'}],3);
    if(sel.length!==3) p.push('selectAdaptive lost questions');
    return p;
  }
  return {DIFFS,TARGET,difficultyOf,expectedTime,filterByDifficulty,adaptive,mixFor,mixForBand,selectAdaptive,selectAdaptiveFor,validate};
})();
function examSelectValidate(){ return ExamSelect.validate(); }

/* P11, read the student's measured difficulty band from the Adaptive Engine.
   Falls back to the fixed mix when the engine or history is unavailable. */
function adaptiveBand(){
  try{ const eng=window.AhAdaptiveEngine; if(!eng||typeof eng.analyze!=='function') return 'mixed';
    const m=eng.analyze({results:(CACHE.examResults||[]),questions:CACHE.questions||[]});

  }catch(_){ return 'mixed'; }
}

function selectQuestionsByMode(pool,mode,count){
  const attempts=q=>(q.stats&&q.stats.attempts)||0;
  const wrong=q=>(q.stats&&q.stats.wrong)||0 || (CACHE.mistakes.find(m=>m.questionId===q.id)?.wrongCount||0);
  const sortNewest=(a,b)=>(b.createdAt||0)-(a.createdAt||0);
  let candidates=[...pool];
  if(mode==='newest') candidates.sort(sortNewest);
  else if(mode==='unattempted') candidates=candidates.filter(q=>attempts(q)===0).concat(candidates.filter(q=>attempts(q)>0).sort(sortNewest));
  else if(mode==='wrong') candidates=candidates.filter(q=>wrong(q)>0).concat(candidates.filter(q=>wrong(q)===0).sort(sortNewest));
  else if(mode==='bookmarked') candidates=candidates.filter(q=>q.bookmarked===true).concat(candidates.filter(q=>!q.bookmarked).sort(sortNewest));
  else if(mode==='weak') {const weak=new Set(weakTopicIds()); candidates.sort((a,b)=>{const aw=weak.has(a.topicId)?0:1,bw=weak.has(b.topicId)?0:1; return aw-bw||wrong(b)-wrong(a);});}
  else if(mode==='mixed'){
    const groups=[candidates.filter(q=>attempts(q)===0),candidates.filter(q=>wrong(q)>0),candidates.filter(q=>q.bookmarked===true),shuffleArr(candidates)];
    const seen=new Set(); candidates=[]; let round=0; while(candidates.length<pool.length && round<pool.length*2){const g=groups[round%groups.length]; const q=g[Math.floor(round/groups.length)]; if(q&&!seen.has(q.id)){seen.add(q.id); candidates.push(q);} round++;}
  }
  else if(mode==='adaptive'){ const band=adaptiveBand(); candidates=band&&band!=='mixed'?selectAdaptiveFor(candidates,count,band):selectAdaptive(candidates,count); }
  else candidates=shuffleArr(candidates);
  return candidates.slice(0,count);
}

function shuffleArr(a){const arr=[...a]; for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]];} return arr;}

async function beginExam(){
  const st=ExamSetup;
  let pool=CACHE.questions;
  if(st.onlyQuestionIds && st.onlyQuestionIds.length) pool=pool.filter(q=>st.onlyQuestionIds.includes(q.id));
  else if(st.mode==='mistake') {
    const qids=CACHE.mistakes.map(m=>m.questionId);
    pool=pool.filter(q=>qids.includes(q.id));
  }
  else if(st.topicIds.length>0) pool=pool.filter(q=>st.topicIds.includes(q.topicId));
  else if(st.subjectIds.length>0) pool=pool.filter(q=>st.subjectIds.includes(q.subjectId));
  if(pool.length===0){toast('No questions available for this selection'); return;}let selected=[];
  let requestedCount=0;
  if(st.selectionMode==='custom'){
    const custom=selectCustomSerialQuestions(pool,st.customSerial);
    if(custom.error){toast(custom.error);return;}
    selected=custom.questions;
    requestedCount=selected.length;
  } else {
    const distributionTopicIds = st.distribution==='custom' ? (st.topicIds.length ? st.topicIds : [...new Set(pool.map(q=>q.topicId))]) : [];
    requestedCount = st.distribution==='custom' ? distributionTopicIds.reduce((sum,topicId)=>sum+(parseInt(st.customCounts[topicId])||0),0) : st.totalCount;
    if(requestedCount<=0){toast('Choose at least one question in the custom distribution'); return;}
    if(st.distribution==='custom' && distributionTopicIds.length){
      const used=new Set();
      distributionTopicIds.forEach(topicId=>{
        const want=Math.max(0,parseInt(st.customCounts[topicId])||0);
        const topicPool=pool.filter(q=>q.topicId===topicId && !used.has(q.id));
        selectQuestionsByMode(topicPool,st.selectionMode||'random',want).forEach(q=>{if(!used.has(q.id)){used.add(q.id); selected.push(q);}});
      });
      if(selected.length<requestedCount) selectQuestionsByMode(pool.filter(q=>!used.has(q.id)),st.selectionMode||'random',requestedCount-selected.length).forEach(q=>selected.push(q));
    } else {
      selected=selectQuestionsByMode(pool,st.selectionMode|| (st.randomizeQ?'random':'newest'),Math.min(requestedCount,pool.length));
    }
  }selected = selected.slice(0, Math.min(requestedCount, selected.length));
  if(st.order==='adaptive' && typeof adaptiveOrder==='function'){ selected=adaptiveOrder(selected); }
  if(['easy','medium','hard'].includes(st.difficulty) && typeof filterByDifficulty==='function'){
    const only=filterByDifficulty(selected, st.difficulty);
    if(only.length) selected=only;
  }const questions = selected.map(q=>{
    let optOrder=[0,1,2,3];
    if(st.randomizeOpt) optOrder=shuffleArr(optOrder);
    return {id:q.id, subjectId:q.subjectId, topicId:q.topicId, question:q.question,
      options:optOrder.map(i=>q.options[i]), answerIndex: optOrder.indexOf(q.answer),
      explanation:q.explanation||'', optOrder};
  });

  const startTime=Date.now();
  const durationSec = (st.mode==='mock' && st.duration > 0) ? st.duration*60 : null;
  const exam={
    id:uid(),mode:st.mode, questionIds:questions.map(q=>q.id), questions,
    currentIndex:0, selectedAnswers:{}, startTime,
    duration: durationSec,
    endTime: durationSec ? (startTime + durationSec*1000) : null,
    negative: Math.max(0, Math.min(Number(st.negative)||0, (Number(st.marksPerQ)||1) - 0.05)),
    status:'running', isSubmitting:false, timeExpired:false, configuration:{...st},
    bookmarks: new Set(),
    flags: new Set(),
    timing: {}, // qid -> {ms, startedAt, answeredAt}
    questionStartedAt:Object.fromEntries(questions.map(q=>[q.id,startTime])),
    flashResults:{} // for flash mode: qid -> {correct:bool}
  };
  await dbPut('exams', exam);
  CACHE.exams=await dbGetAll('exams');
  ActiveExam=exam;
  startTimerLoop();
  navigate('exam/running');
}

function liveScoreOf(e){

    for(const qid in e.flashResults){ const r=e.flashResults[qid]; if(r&&r.correct===true) correct++; else if(r&&r.correct===false) wrong++; }
  } else {
    for(const q of e.questions){ const sel=e.selectedAnswers[q.id]; if(sel===undefined) continue; if(sel===q.answerIndex) correct++; else wrong++; }
  }
  const marks=Number(e.configuration&&e.configuration.marksPerQ)||1;

function scheduleExamExpiry(){
  clearTimeout(timerExpiryHandle);
  if(!ActiveExam || ActiveExam.mode!=='mock' || !ActiveExam.endTime) return;
  timerExpiryHandle=setTimeout(()=>{ void examTimerTick(); }, Math.max(0, ActiveExam.endTime - Date.now()) + 250);
}
function bindExamWakeHandlers(){
  if(timerWakeBound) return;
  timerWakeBound=true;
  const wake=()=>{
    if(document.hidden) return;
    if(!ActiveExam || ActiveExam.status!=='running' || ActiveExam.mode!=='mock' || ActiveExam.isSubmitting) return;
    void examTimerTick();
  };
  document.addEventListener('visibilitychange', wake);
  window.addEventListener('pageshow', wake);
  window.addEventListener('focus', wake);
}
function startTimerLoop(){
  clearExamTimers();
  if(!ActiveExam || ActiveExam.mode!=='mock') return;
  bindExamWakeHandlers();
  void examTimerTick();
  timerHandle=setInterval(()=>{ void examTimerTick(); },1000);
}

function renderExamRunning(){
  if(!ActiveExam){
    checkResumableExam().then(e=>{
      if(e){ ActiveExam=e; startTimerLoop(); render(); }
      else navigate('exam/setup');
    });
    renderShell('<div class="empty">Loading…</div>', {topbar:false, hideNav:true});
    return;
  }
  if(ActiveExam.mode==='mock') return renderMockRunning();
  return renderFlashRunning();
}

function mockQuestionMarkup(q, idx, e){
  const selected=e.selectedAnswers[q.id];
  const locked=e.mode==='mock' && selected!==undefined;
  return `<div id="q-row-${idx}" data-question-id="${esc(q.id)}" class="card exam-q-card" style="margin-bottom:16px; border-left:4px solid ${selected!==undefined?'var(--emerald)':'transparent'};">
    <div class="row between" style="margin-bottom:12px;">
      <span class="pill">Q${idx+1}</span>
      <div class="row exam-card-actions">
        <button class="iconbtn ${e.bookmarks.has(q.id)?'explorer-bookmark':''}" data-exam-bookmark="1" onclick="toggleExamBookmark('${esc(q.id)}')" aria-label="Bookmark question">${e.bookmarks.has(q.id)?'★':'☆'}</button>
        <button class="iconbtn" data-exam-flag="1" style="color:${e.flags.has(q.id)?'var(--red)':'var(--sub)'}" onclick="toggleExamFlag('${esc(q.id)}')" aria-label="Flag question">🚩</button>
      </div>
    </div>
    <div class="exam-question-text">${esc(q.question)}</div>
    <div class="options-list">
      ${q.options.map((o,i)=>`<div class="opt ${selected===i?'selected':''} ${locked?'locked':''}" data-option-index="${i}" ${locked?'aria-disabled="true"':'onclick="selectMockAnswer(\''+esc(q.id)+'\','+i+')"'}><div class="let">${String.fromCharCode(65+i)}</div><div>${esc(o)}</div></div>`).join('')}
    </div>
  </div>`;

function updateMockAnswerUI(qid){
  const e=ActiveExam;
  if(!e) return;
  const card=[...document.querySelectorAll('.exam-q-card[data-question-id]')].find(node=>node.dataset.questionId===String(qid));
  if(card){
    const selected=e.selectedAnswers[qid];
    card.style.borderLeftColor=selected===undefined?'transparent':'var(--emerald)';
    const locked=e.mode==='mock'&&selected!==undefined;
    card.classList.toggle('answer-locked',locked);
    card.querySelectorAll('.opt[data-option-index]').forEach(opt=>{opt.classList.toggle('selected',Number(opt.dataset.optionIndex)===selected);opt.classList.toggle('locked',locked);if(locked){opt.removeAttribute('onclick');opt.setAttribute('aria-disabled','true');}});
  }const total=e.questions.length;
  const answered=Object.keys(e.selectedAnswers).length;
  const count=document.getElementById('examAnsweredCount'); if(count) count.textContent=answered;
  const bar=document.querySelector('#examProgressBar>div'); if(bar) bar.style.width=`${total?Math.round(answered/total*100):0}%`;
}
function updateMockCardControls(qid){
  const e=ActiveExam;
  const card=[...document.querySelectorAll('.exam-q-card[data-question-id]')].find(node=>node.dataset.questionId===String(qid));
  if(!card||!e) return;
  const bookmark=card.querySelector('[data-exam-bookmark]'); if(bookmark){bookmark.textContent=e.bookmarks.has(qid)?'★':'☆'; bookmark.classList.toggle('explorer-bookmark',e.bookmarks.has(qid));}
  const flag=card.querySelector('[data-exam-flag]'); if(flag) flag.style.color=e.flags.has(qid)?'var(--red)':'var(--sub)';

function renderMockPagedRunning(){

function mockPage(dir){
  if(!ActiveExam||ActiveExam.questions.length<=80)return;
  MockPage=Math.max(0,Math.min(Math.ceil(ActiveExam.questions.length/MOCK_PAGE_SIZE)-1,MockPage+Number(dir||0)));
  renderMockPagedRunning();
  const resetPageScroll=()=>{if(ActiveExam&&Router.path==='exam/running'){window.scrollTo({top:0,left:0,behavior:'auto'});if(document.scrollingElement)document.scrollingElement.scrollTop=0;document.body.scrollTop=0;}};
  requestAnimationFrame(()=>requestAnimationFrame(resetPageScroll));
  window.setTimeout(resetPageScroll,90);
}
function scrollToQuestion(idx){
  if(ActiveExam&&ActiveExam.questions.length>80){const target=Math.max(0,Math.min(ActiveExam.questions.length-1,Number(idx)||0)),lastPage=Math.floor(target/MOCK_PAGE_SIZE)===Math.ceil(ActiveExam.questions.length/MOCK_PAGE_SIZE)-1;MockPage=Math.floor(target/MOCK_PAGE_SIZE);renderMockPagedRunning();const align=()=>{if(!ActiveExam||Router.path!=='exam/running')return;const max=Math.max(0,document.scrollingElement.scrollHeight-document.scrollingElement.clientHeight);window.scrollTo({top:lastPage?max:0,left:0,behavior:'auto'});document.scrollingElement.scrollTop=lastPage?max:0;};requestAnimationFrame(()=>requestAnimationFrame(align));window.setTimeout(align,80);return;}
  const el=document.getElementById('q-row-'+idx);
  if(el){
    document.querySelectorAll('.exam-q-card').forEach(c=>c.style.borderLeftColor='transparent');
    el.style.borderLeftColor='var(--emerald)';
    el.scrollIntoView({behavior:'auto',block:'start'});
    window.scrollBy(0,-82);
  }
}
async function toggleExamBookmark(qid){
  const e=ActiveExam;
  if(e.bookmarks.has(qid)) e.bookmarks.delete(qid); else e.bookmarks.add(qid);
  if(window.AdmissionHubPerformance?.queueExamPersist) window.AdmissionHubPerformance.queueExamPersist(); else void dbPut('exams',e).catch(()=>{});
  updateMockCardControls(qid);
}
async function toggleExamFlag(qid){
  const e=ActiveExam;
  if(e.flags.has(qid)) e.flags.delete(qid); else e.flags.add(qid);
  if(window.AdmissionHubPerformance?.queueExamPersist) window.AdmissionHubPerformance.queueExamPersist(); else void dbPut('exams',e).catch(()=>{});
  updateMockCardControls(qid);
}async function selectMockAnswer(qid,idx){
  const e=ActiveExam;
  if(!e) return;
  if(e.timeExpired) return;
  if(e.mode==='mock' && e.selectedAnswers[qid]!==undefined) return;
  if(e.selectedAnswers[qid]===idx) delete e.selectedAnswers[qid];
  else {
    e.selectedAnswers[qid]=idx;
    if(!e.timing[qid]) e.timing[qid]={ms:Math.max(0,Date.now()-(e.questionStartedAt&&e.questionStartedAt[qid]||e.startTime)),startedAt:e.questionStartedAt&&e.questionStartedAt[qid]||e.startTime,answeredAt:Date.now()};
    /* Phase 2 M3: a committed answer is a per-question learning signal. The
     * exam id is the quiz_id so attempts join the quiz_complete row. */
    try{const q=e.questions.find(x=>x.id===qid)||{};const t=e.timing[qid]||{};window.dispatchEvent(new CustomEvent('admission:activity',{detail:{type:'QUESTION_ATTEMPT',quizId:e.id,questionId:String(qid),quizType:e.mode==='mock'?'mock':'practice',correct:idx===q.answerIndex,duration:t.ms?Math.round(t.ms/1000):undefined,questionNumber:e.questions.findIndex(x=>x.id===qid)+1,subjectId:q.subjectId,topicId:q.topicId,mode:e.mode}}))}catch(_){}
  }
  if(window.AdmissionHubPerformance?.queueExamPersist) window.AdmissionHubPerformance.queueExamPersist(); else void dbPut('exams',e).catch(()=>{});
  updateMockAnswerUI(qid);
  updateLiveScore();
}

  if(ni>=e.questions.length){ render(); return; } // last -> stays, shows review state via submit
  e.currentIndex=ni;
  dbPut('exams',e);

}
function jumpMock(i){ ActiveExam.currentIndex=i; dbPut('exams',ActiveExam); render(); }
function skipMock(){

  if(e.timeExpired) return;

  if(e.currentIndex<e.questions.length-1) e.currentIndex++;
  dbPut('exams',e); render();
}
function confirmSubmitExam(){
  const e=ActiveExam;
  if(e && e.configuration && e.configuration.confirmSubmit===false){ submitExam(false); return; }const answered=Object.keys(e.selectedAnswers).length;
  const unanswered=e.questions.length-answered;
  const flagged=e.flags.size;
  confirmModal('Submit Exam', `
    <div style="text-align:center; padding:10px 0;">
      <div class="row between" style="margin-bottom:8px;"><span>Answered:</span><b>${answered}</b></div>
      <div class="row between" style="margin-bottom:8px;"><span>Unanswered:</span><b>${unanswered}</b></div>

    </div>
    <div class="muted" style="margin-top:10px;">Are you sure you want to submit? This action cannot be undone.</div>
  `, ()=>submitExam(false), 'Submit Exam');
}

  let streak=0;
  for(let i=(r.snapshot||[]).length-1;i>=0;i--){
    if(r.snapshot[i].status==='correct') streak++;
    else break;
  }
  return streak;
}

/* ---- submit & scoring (shared) ---- */
let submitRetryAttempt=0;
let submitRetryHandle=null;
window.addEventListener('online',()=>{
  /* Network-failure recovery: when connectivity returns and a submit result is
     still pending, stop waiting out the backoff and send it now. */
  const e=ActiveExam;
  if(!e || e.status!=='running' || !submitRetryHandle) return;
  clearTimeout(submitRetryHandle); submitRetryAttempt=0;
  submitRetryHandle=setTimeout(()=>{ const cur=ActiveExam; if(cur && cur.id===e.id && cur.status==='running') void submitExam(true); },300);
  try{ toast('নেটওয়ার্ক ফিরল, ফলাফল আবার পাঠানো হচ্ছে…'); }catch(_){}
});
async function submitExam(autoSubmit){
  const e=ActiveExam;
  if(!e || e.isSubmitting) return;
  e.isSubmitting=true;
  const examId=e.id;
  clearExamTimers();
  try {
  const timeUsed = e.mode==='mock' ? (e.duration-computeRemaining(e)) : Math.round((Date.now()-e.startTime)/1000);

let HistoryFilters={type:'all',from:'',to:'',subject:'',topic:'',sort:'dateDesc'};
function historyRows(){
  return CACHE.examResults.map(normalizeExamResult).filter(r=>{
    const d=new Date(r.date); const day=new Date(d.getFullYear(),d.getMonth(),d.getDate());
    const from=HistoryFilters.from?new Date(HistoryFilters.from+'T00:00:00'):null;
    const to=HistoryFilters.to?new Date(HistoryFilters.to+'T23:59:59'):null;
    const type=HistoryFilters.type==='all'||r.testType===HistoryFilters.type;
    const sub=!HistoryFilters.subject||(r.subjects||[]).includes(HistoryFilters.subject);
    const top=!HistoryFilters.topic||(r.topics||[]).includes(HistoryFilters.topic);
    return type&&sub&&top&&(!from||d>=from)&&(!to||d<=to);
  }).sort((a,b)=>{
    const s=HistoryFilters.sort; if(s==='scoreDesc'||s==='scoreAsc') return (s==='scoreDesc'?-1:1)*(Number(a.score||0)-Number(b.score||0));
    if(s==='accuracyDesc'||s==='accuracyAsc') return (s==='accuracyDesc'?-1:1)*(Number(a.accuracy||0)-Number(b.accuracy||0));
    return Number(b.date||0)-Number(a.date||0);
  });
}
