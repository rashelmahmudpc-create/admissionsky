<style>
/* ============================================================
   প্রত্যয় • Visual Admission Master Guide, premium UI
   ============================================================ */
:root{
  --bg:#070d1a; --bg2:#0b1526; --card:#101c31cc; --card-b:#1d2c47;
  --ink:#eaf1ff; --mut:#93a4c3; --acc:#38e1b0; --acc2:#4f9dff; --acc3:#ffb454;
  --good:#2fe6a0; --bad:#ff5d7a; --warn:#ffb454;
  --grad:linear-gradient(120deg,#38e1b0,#4f9dff 55%,#8f7bff);
  --shadow:0 14px 40px -18px #000c;
  --r:18px;
}
[data-theme="light"]{
  --bg:#f2f6fb; --bg2:#ffffff; --card:#ffffffe6; --card-b:#dbe6f4;
  --ink:#122036; --mut:#5b6d8a; --acc:#0c9d7a; --acc2:#1f6fe0; --acc3:#d97b12;
  --good:#0c9d6e; --bad:#e0345c; --warn:#c77a10;
  --shadow:0 14px 34px -20px #1c3a6b40;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Hind Siliguri','Noto Sans Bengali','Vrinda','Shonar Bangla',system-ui,sans-serif;
  font-size:16.5px; line-height:1.75;
  background-image:radial-gradient(1100px 500px at 85% -10%, #4f9dff18, transparent 60%),
                   radial-gradient(900px 460px at -10% 110%, #38e1b014, transparent 60%);
  min-height:100vh;
}
h1,h2,h3,h4,.stag,.lno{font-family:'Noto Serif Bengali','Hind Siliguri',serif}
button{font:inherit; color:inherit; cursor:pointer}
::selection{background:#38e1b055}

/* ---------- layout ---------- */
.shell{display:flex; min-height:100vh}
#side{
  width:270px; flex:0 0 270px; padding:22px 14px; position:sticky; top:0; height:100vh; overflow-y:auto;
  background:var(--bg2); border-right:1px solid var(--card-b);
  display:flex; flex-direction:column; gap:4px; z-index:40;
}
.brand{padding:6px 12px 16px; border-bottom:1px dashed var(--card-b); margin-bottom:12px}
.brand .b1{font-size:12px; letter-spacing:.28em; color:var(--mut); text-transform:uppercase}
.brand .b2{font-size:26px; font-weight:800; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent}
.brand .b3{font-size:12.5px; color:var(--mut)}
.nvi{display:flex; gap:11px; align-items:center; width:100%; text-align:left; border:0; background:transparent;
  padding:10px 12px; border-radius:12px; color:var(--mut); font-weight:600; font-size:15px; transition:.18s}
.nvi .ic{width:22px; text-align:center}
.nvi:hover{background:#ffffff10; color:var(--ink)}
.nvi.on{background:linear-gradient(90deg,#38e1b022,#4f9dff22); color:var(--ink); box-shadow:inset 0 0 0 1px #38e1b044}
#main{flex:1; min-width:0; padding:26px clamp(14px,4vw,46px) 90px}
.topbar{display:none; position:sticky; top:0; z-index:50; background:var(--bg2); border-bottom:1px solid var(--card-b);
  padding:10px 14px; align-items:center; gap:10px; justify-content:space-between}
#burger{border:1px solid var(--card-b); background:var(--card); border-radius:10px; padding:6px 10px; font-size:18px}
#theme-btn{border:1px solid var(--card-b); background:var(--card); border-radius:10px; padding:6px 10px; font-size:16px}
.tb-title{font-weight:800; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent}
.themer{position:fixed; right:18px; bottom:18px; z-index:60}
.themer button{border:1px solid var(--card-b); background:var(--bg2); border-radius:999px; padding:10px 16px; box-shadow:var(--shadow); font-size:16px}

/* ---------- hero ---------- */
.hero{padding:34px 8px 26px; text-align:center}
.hero-badge{display:inline-block; font-size:12.5px; letter-spacing:.18em; color:var(--acc); border:1px solid #38e1b055; padding:5px 14px; border-radius:999px; background:#38e1b012}
.hero h1{font-size:clamp(44px,7vw,84px); margin:14px 0 6px; line-height:1.15}
.grad{background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent}
.tag{color:var(--mut); max-width:760px; margin:6px auto 22px}
.statrow{display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin:10px 0 24px}
.stat{min-width:96px; padding:12px 16px; border-radius:16px; background:var(--card); border:1px solid var(--card-b); box-shadow:var(--shadow)}
.stat b{display:block; font-size:22px; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent}
.stat span{font-size:12.5px; color:var(--mut)}
.cta{display:flex; gap:12px; justify-content:center; flex-wrap:wrap}

/* ---------- buttons ---------- */
.btn{border:0; border-radius:13px; padding:11px 20px; font-weight:700; transition:.18s; letter-spacing:.01em}
.btn.primary{background:var(--grad); color:#04231b; box-shadow:0 10px 26px -12px #38e1b0aa}
[data-theme="light"] .btn.primary{color:#fff}
.btn.primary:hover{transform:translateY(-2px)}
.btn.ghost{background:transparent; border:1px solid var(--card-b); color:var(--ink)}
.btn.ghost:hover{border-color:var(--acc)}
.btn.soft{background:#4f9dff1c; color:var(--acc2); border:1px solid #4f9dff44}
.btn:disabled{opacity:.45; cursor:not-allowed; transform:none}

/* ---------- cards & grids ---------- */
.card{background:var(--card); border:1px solid var(--card-b); border-radius:var(--r); padding:20px 22px; box-shadow:var(--shadow); backdrop-filter:blur(8px); margin-top:16px}
.card h3{margin:0 0 12px; font-size:19px}
.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(330px,1fr)); gap:0 18px}
.grid3{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:0 18px}
.txt{color:var(--ink)}
.sub{color:var(--mut)}
.vt{margin:26px 0 6px; font-size:26px}
.lst{margin:6px 0; padding-left:4px; list-style:none}
.lst li{padding:7px 0 7px 26px; position:relative}
.lst li::before{content:'▸'; position:absolute; left:4px; color:var(--acc)}

/* difficulty / plan / features */
.dstep{display:flex; gap:12px; align-items:flex-start; margin:10px 0}
.dnum{flex:0 0 30px; height:30px; display:grid; place-items:center; border-radius:10px; background:var(--grad); color:#04231b; font-weight:800}
[data-theme="light"] .dnum{color:#fff}
.dstep p{margin:2px 0 0; color:var(--mut); font-size:14.5px}
.darr{color:var(--acc); text-align:center; margin:2px 0}
.plan{display:flex; gap:12px; padding:9px 0; border-bottom:1px dashed var(--card-b)}
.plan:last-child{border:0}
.plan b{flex:0 0 56px; color:var(--acc)}
.plan span{font-size:14.5px}
.bigstat{display:flex; align-items:baseline; gap:10px; margin:10px 0 4px}
.bigstat b{font-size:34px; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent}
.bigstat span{color:var(--mut); font-size:14px}
.bar{height:9px; border-radius:99px; background:#ffffff14; overflow:hidden; border:1px solid var(--card-b)}
[data-theme="light"] .bar{background:#0b152612}
.bar i{display:block; height:100%; background:var(--grad); border-radius:99px; transition:width .5s}
.feat{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px}
.feat-i{display:flex; gap:12px; padding:12px; border:1px dashed var(--card-b); border-radius:14px}
.feat-i span{font-size:24px}
.feat-i p{margin:2px 0 0; color:var(--mut); font-size:13.5px}

/* tables */
.tblwrap{overflow-x:auto; border-radius:12px; border:1px solid var(--card-b)}
table{width:100%; border-collapse:collapse; font-size:15px; min-width:430px}
th{background:linear-gradient(90deg,#0e3f38,#11485a); color:#eafff7; text-align:left; padding:10px 14px; font-weight:700}
[data-theme="light"] th{background:linear-gradient(90deg,#0f766e,#155e75)}
td{padding:9px 14px; border-top:1px solid var(--card-b); vertical-align:top}
tbody tr:nth-child(odd){background:#ffffff07}
[data-theme="light"] tbody tr:nth-child(odd){background:#0b152607}

/* slide blocks */
.slide{background:var(--card); border:1px solid var(--card-b); border-radius:20px; padding:24px; box-shadow:var(--shadow); animation:up .35s ease}
@keyframes up{from{opacity:0; transform:translateY(14px)}to{opacity:1; transform:none}}
.stag{display:inline-block; margin-bottom:16px; padding:7px 16px; border-radius:999px; background:#38e1b01a; border:1px solid #38e1b055; color:var(--acc); font-weight:800; font-size:14.5px}
.stag.recap{background:#8f7bff1a; border-color:#8f7bff66; color:#b7a8ff}
[data-theme="light"] .stag.recap{color:#6d4fe0}
.membox{margin:14px 0; padding:12px 16px; border-radius:14px; background:#ffb4541a; border-left:4px solid var(--warn); font-weight:600}
.defbox,.infobox,.rulebox{border-radius:14px; padding:14px 18px; margin:12px 0}
.defbox{background:#4f9dff14; border-left:4px solid var(--acc2)}
.infobox{background:#4f9dff10; border-left:4px solid var(--acc2)}
.rulebox{background:#8f7bff14; border-left:4px solid #8f7bff}
.defbox h4{margin:0 0 4px; color:var(--acc2)}
.rulebox h4{margin:0 0 4px; color:#b7a8ff}
[data-theme="light"] .rulebox h4{color:#6d4fe0}
.flow{display:flex; flex-direction:column; gap:2px; margin:14px 0; align-items:flex-start}
.fl{background:#38e1b012; border:1px solid #38e1b044; padding:8px 16px; border-radius:12px; font-weight:600}
.fa{color:var(--acc); padding-left:22px}
.wr{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:12px 0}
.wr-w,.wr-r{padding:10px 14px; border-radius:12px; font-weight:600; font-size:15px}
.wr-w{background:#ff5d7a18; border:1px solid #ff5d7a55}
.wr-r{background:#2fe6a018; border:1px solid #2fe6a055}
.why{color:var(--mut); font-size:15px}
.ex{border-radius:14px; padding:14px 18px; margin:12px 0; border-left:4px solid}
.ex h5{margin:0 0 8px; letter-spacing:.06em}
.ex-e{background:#2fe6a010; border-color:var(--good)} .ex-e h5{color:var(--good)}
.ex-a{background:#4f9dff12; border-color:var(--acc2)} .ex-a h5{color:var(--acc2)}
.ex-t{background:#ff5d7a10; border-color:var(--bad)} .ex-t h5{color:var(--bad)}
.ex-w{background:#8f7bff12; border-color:#8f7bff} .ex-w h5{color:#b7a8ff}
.exl{border-left:2px solid var(--card-b); margin:6px 0; padding:4px 12px; color:var(--ink)}
.trapbox{border:1px solid #ff5d7a55; background:#ff5d7a0d; border-radius:16px; padding:16px 20px; margin:14px 0}
.trapbox h5{margin:0 0 8px; color:var(--bad); letter-spacing:.08em}
.trapbox p{margin:6px 0}
.trick{color:var(--acc3)}
.qas{display:grid; gap:8px; margin-top:10px}
.qa{border:1px solid var(--card-b); border-radius:12px; padding:10px 14px; background:#ffffff06}
.qa summary{cursor:pointer; font-weight:600}
.qa .qn{color:var(--acc2)}
.qa-a{margin-top:8px; padding:10px 14px; border-radius:10px; background:#2fe6a014; border:1px solid #2fe6a044}

/* lessons */
.lgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:14px; margin-top:14px}
.lcard{text-align:left; background:var(--card); border:1px solid var(--card-b); border-radius:16px; padding:18px; transition:.2s; box-shadow:var(--shadow)}
.lcard:hover{transform:translateY(-3px); border-color:#38e1b066}
.lno{display:inline-block; font-size:11.5px; letter-spacing:.22em; color:var(--acc); margin-bottom:8px; font-weight:800}
.lcard b{font-size:16.5px; display:block; line-height:1.5}
.lcard p{color:var(--mut); font-size:13.5px; margin:6px 0 10px}
.lmeta{font-size:12.5px; color:var(--acc2); border:1px dashed #4f9dff66; padding:3px 10px; border-radius:99px}
.ltop{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
.ltitle{flex:1; min-width:200px}
.ltitle b{font-size:19px}
.slideno{color:var(--mut); font-weight:700}
.dots{display:flex; gap:7px; margin:14px 2px; flex-wrap:wrap}
.dot{width:11px; height:11px; border-radius:99px; border:0; background:#ffffff22; transition:.2s}
[data-theme="light"] .dot{background:#0b152622}
.dot.on{width:26px; background:var(--grad)}
.lnav{display:flex; justify-content:space-between; margin-top:16px; gap:10px}

/* traps */
.tgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px; margin-top:12px}
.tcard{background:var(--card); border:1px solid #ff5d7a44; border-radius:16px; padding:16px 18px; box-shadow:var(--shadow)}
.tcard summary{cursor:pointer; list-style:none}
.tcard summary::-webkit-details-marker{display:none}
.tno{display:inline-block; color:var(--bad); font-weight:800; letter-spacing:.1em; font-size:12px; margin-bottom:6px}
.tcard p{margin:8px 0; font-size:15px}
.tcard[open]{border-color:var(--bad)}

/* rules */
.barhead{display:flex; align-items:center; gap:14px; margin:12px 0}
.barhead .bar{flex:1}
.rlist{display:grid; gap:8px}
.rrow{display:flex; gap:12px; align-items:flex-start; background:var(--card); border:1px solid var(--card-b); padding:12px 16px; border-radius:14px; cursor:pointer; transition:.15s}
.rrow:hover{border-color:#38e1b055}
.rrow input{accent-color:var(--acc); width:18px; height:18px; margin-top:4px}
.rrow .rn{flex:0 0 30px; color:var(--acc2); font-weight:800}
.rrow.ok{border-color:#2fe6a066; background:#2fe6a00d}
.rrow.ok span:last-child{color:var(--mut); text-decoration:line-through}

/* revision */
.rap{padding:10px 2px; border-bottom:1px dashed var(--card-b)}
.rap:last-child{border:0}
.rap b{color:var(--acc)}
.mmap{margin-top:14px}
.mroot{width:max-content; margin:0 auto; padding:12px 34px; border-radius:999px; background:var(--grad); color:#04231b; font-weight:900; font-size:22px; font-family:'Noto Serif Bengali',serif}
[data-theme="light"] .mroot{color:#fff}
.mbranches{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:14px; margin-top:22px; position:relative}
.mbr{background:var(--card); border:1px solid var(--card-b); border-radius:16px; padding:14px; box-shadow:var(--shadow)}
.mbr h4{margin:0 0 10px; color:var(--acc2)}
.mi{background:#4f9dff10; border:1px dashed #4f9dff44; margin:6px 0; padding:6px 12px; border-radius:10px; font-size:14.5px}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{font-size:12.5px; padding:4px 12px; border-radius:999px; border:1px solid var(--card-b); background:#ffffff0a; font-weight:700}
.trapchip{border-color:#ff5d7a66; color:var(--bad)}
.dhonichip{border-color:#4f9dff66; color:var(--acc2)}

/* glossary */
.ggrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px; margin-top:12px}
.gcard{background:var(--card); border:1px solid var(--card-b); border-radius:14px; padding:14px 16px}
.gcard b{color:var(--acc)}
.gcard p{margin:4px 0 0; font-size:14.5px; color:var(--mut)}

/* solved / shorts */
.sv .svhead{display:flex; gap:12px; align-items:flex-start}
.svid{flex:0 0 auto; background:var(--grad); color:#04231b; font-weight:900; padding:3px 12px; border-radius:10px; font-size:13px}
[data-theme="light"] .svid{color:#fff}
.sv details{margin-top:6px}
.sv summary{cursor:pointer; color:var(--acc2); font-weight:700}
.steps{color:var(--mut); margin:10px 0}
.ansline{font-weight:900; color:var(--good); font-size:18px}
.opt.good{border-color:var(--good) !important; background:#2fe6a01c !important}
.sgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px; margin-top:12px}
.fcard{perspective:900px; min-height:190px; cursor:pointer}
.ff{border-radius:16px; padding:18px; backface-visibility:hidden; transition:transform .5s; position:absolute; inset:0; box-shadow:var(--shadow)}
.fcard{position:relative}
.front{background:var(--card); border:1px solid var(--card-b); display:flex; flex-direction:column; gap:10px}
.front b{font-size:17px}
.fno{color:var(--acc); font-weight:800; font-size:12.5px; letter-spacing:.12em}
.hint{margin-top:auto; color:var(--mut); font-size:12.5px}
.back{background:linear-gradient(140deg,#0e3f38,#11485a); border:1px solid #38e1b055; transform:rotateY(180deg); overflow:auto}
[data-theme="light"] .back{background:linear-gradient(140deg,#0f766e,#155e75); color:#fff}

.qcount{font-weight:800}
.lv-basic{border-color:#2fe6a066; color:var(--good)}
.lv-intermediate{border-color:#ffb45466; color:var(--warn)}
.lv-admission{border-color:#4f9dff66; color:var(--acc2)}
.lv-trap{border-color:#ff5d7a66; color:var(--bad)}
.cat{border-color:#8f7bff55; color:#b7a8ff}

.extra{border-color:#ffb45466; color:var(--warn)}

.pal-b.done{border-color:var(--acc); color:var(--acc)}
.pal-b.cur{background:var(--grad); color:#04231b; border:0}

.res{text-align:center}
.gauge{width:190px; margin:8px auto}

(function () {

  const bn = n => String(n).replace(/\d/g, d => BN[d]);
  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  /* ---------- state ---------- */
  const LS = 'prottoy_v1';
  let S = { theme: 'dark', learned: {}, marks: {}, wrong: {}, right: {}, exams: [], lpos: {} };
  try { Object.assign(S, JSON.parse(localStorage.getItem(LS) || '{}')); } catch (e) {}
  const save = () => localStorage.setItem(LS, JSON.stringify(S));

  document.documentElement.dataset.theme = S.theme;

  /* ---------- nav ---------- */
  const NAV = [
    ['home', '🏠', 'হোম'],
    ['overview', '🧭', 'ওভারভিউ ও স্টাডি প্ল্যান'],
    ['lessons', '📖', 'লেসন (১০টি)'],
    ['traps', '⚠️', 'ট্র্যাপ ডেটাবেস'],
    ['rules', '📐', 'মাইক্রো-রুলস (৩০)'],
    ['revision', '⚡', 'র‍্যাপিড রিভিশন'],
    ['toolkit', '🧰', 'গ্লোসারি ও ভুল-গ্যালারি'],
    ['solved', '🧮', 'সলভড মডেল (১২)'],
    ['shorts', '✍️', 'সংক্ষিপ্ত উত্তর (১০)'],
    ['quiz', '🎯', 'MCQ ব্যাংক (২০০)'],
    ['key', '🔑', 'আন্সার কি'],
    ['stats', '📊', 'প্রগ্রেস ড্যাশবোর্ড']
  ];
  let cur = 'home';

  function navHTML() {
    return NAV.map(([id, ic, lb]) =>
      `<button class="nvi ${cur === id ? 'on' : ''}" data-v="${id}"><span class="ic">${ic}</span><span>${lb}</span></button>`).join('');
  }

  /* ---------- helpers ---------- */
  const lvlChip = l => `<span class="chip lv-${l.toLowerCase()}">${G.levels[l] || l}</span>`;
  const catChip = c => `<span class="chip cat">${G.cats[c] || c}</span>`;
  const LETTERS = ['ক', 'খ', 'গ', 'ঘ'];

  function blockHTML(b) {
    switch (b.t) {
      case 'p': return `<p class="txt">${esc(b.text)}</p>`;
      case 'mem': return `<div class="membox">📌 মনে রাখুন: ${esc(b.text)}</div>`;
      case 'def': return `<div class="defbox"><h4>${esc(b.term)}</h4><p>${esc(b.text)}</p></div>`;
      case 'box': return `<div class="infobox"><h4>${esc(b.title)}</h4><p>${esc(b.text)}</p></div>`;
      case 'rule': return `<div class="rulebox"><h4>${esc(b.title)}</h4><p>${esc(b.text)}</p></div>`;
      case 'flow': return `<div class="flow">${b.items.map(i => `<div class="fl">${esc(i)}</div>`).join('<div class="fa">↓</div>')}</div>`;
      case 'list': return `<ul class="lst">${b.items.map(i => `<li>${esc(i)}</li>`).join('')}</ul>`;
      case 'table': return `<div class="tblwrap"><table><thead><tr>${b.head.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${b.rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
      case 'wr': return `<div class="wr"><div class="wr-w">✖ ${esc(b.wrong)}</div><div class="wr-r">✔ ${esc(b.right)}</div></div>${b.why ? `<p class="why"><b>কেন ভুলটি ভুল:</b> ${esc(b.why)}</p>` : ''}`;
      case 'ex': {
        const kind = { easy: ['EASY EXAMPLE', 'ex-e'], adm: ['ADMISSION EXAMPLE', 'ex-a'], trap: ['TRAP EXAMPLE', 'ex-t'], work: ['WORKED', 'ex-w'] }[b.kind] || ['EXAMPLE', 'ex-e'];
        return `<div class="ex ${kind[1]}"><h5>${kind[0]} : ${esc(b.title)}</h5>${b.lines.map(l => `<div class="exl">${esc(l)}</div>`).join('')}${b.why ? `<p class="why"><b>Why?</b> ${esc(b.why)}</p>` : ''}</div>`;
      }
      case 'trap': return `<div class="trapbox"><h5>⚠️ ADMISSION TRAP #${esc(b.no)}</h5>
        <p><b>শিক্ষার্থীরা যা ভাবে:</b> ${esc(b.think)}</p>
        <p><b>প্রকৃতপক্ষে:</b> ${esc(b.real)}</p>
        <p><b>পরীক্ষক যেভাবে ফাঁদ পাতে:</b> ${esc(b.exam)}</p>
        <p class="trick"><b>Memory trick:</b> ${esc(b.trick)}</p></div>`;
      case 'qa': return `<div class="qas">${b.items.map((it, i) => `<details class="qa"><summary><span class="qn">প্রশ্ন:</span> ${esc(it.q)}</summary><div class="qa-a"><b>উত্তর:</b> ${esc(it.a)}</div></details>`).join('')}</div>`;
    }
    return '';
  }

  /* ================= VIEWS ================= */
  function vHome() {
    const total = G.mcqs.length;
    const attempted = Object.keys(S.right).length + Object.keys(S.wrong).length;
    return `
    <section class="hero">
      <div class="hero-badge">বাংলা ২য় পত্র • ${G.meta.brand}</div>
      <h1><span class="grad">${G.meta.title}</span></h1>

      <div class="statrow">${G.meta.stats.map(s => `<div class="stat"><b>${s.n}</b><span>${s.l}</span></div>`).join('')}</div>
      <div class="cta">
        <button class="btn primary" data-v="lessons">📖 লেসন শুরু করো</button>
        <button class="btn primary" data-v="quiz">🎯 MCQ প্র্যাকটিস</button>

      </div>
    </section>

    const ids = Object.keys(S.wrong).map(Number);
    const pool = shuffle(G.mcqs.filter(m => ids.includes(m.id)));
    startQuiz({ mode: 'practice', qs: pool });
  }

  function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  function startQuiz(cfg) {
    if (!cfg.qs.length) { $('#qz-area').innerHTML = '<div class="card"><p class="sub">এই ফিল্টারে কোনো প্রশ্ন পাওয়া যায়নি।</p></div>'; return; }
    if (tmrInt) { clearInterval(tmrInt); tmrInt = null; }
    QZ = { mode: cfg.mode, qs: cfg.qs, i: 0, picks: {}, order: cfg.qs.map(m => shuffle([0, 1, 2, 3])), score: 0, done: false, time: cfg.time || 0, t0: Date.now() };
    if (QZ.mode === 'exam') { QZ.deadline = Date.now() + cfg.time * 1000; tmrInt = setInterval(tick, 500); }
    $('#qz-setup').innerHTML = '';
    drawQ();
  }

  function drawQ() {
    const q = QZ.qs[QZ.i];
    const ord = QZ.order[QZ.i];
    const marked = S.marks[q.id];
    $('#qz-area').innerHTML = `
    <div class="qtop">
      <span class="qcount">প্রশ্ন ${bn(QZ.i + 1)}/${bn(QZ.qs.length)}</span>
      ${lvlChip(q.lvl)} ${catChip(q.cat)} ${q.src ? '<span class="chip extra">বাড়তি</span>' : '<span class="chip guide">গাইড</span>'}
      <button class="mkbtn ${marked ? 'on' : ''}" id="mk" title="বুকমার্ক">🔖</button>
      ${QZ.mode === 'exam' ? '<span class="timer" id="tmr"></span>' : ''}
    </div>
    <div class="bar" style="margin:10px 0"><i style="width:${Math.round(QZ.i / QZ.qs.length * 100)}%"></i></div>
    <div class="qcard"><p class="qtxt">${esc(q.q)}</p>
      <div class="opts">${ord.map((oi, vi) => {
        const picked = QZ.picks[q.id];
        let cls = 'opt';
        if (picked !== undefined) {
          if (QZ.mode === 'practice') { if (oi === q.a) cls += ' good'; else if (oi === picked) cls += ' bad'; }
          else if (oi === picked) cls += ' sel';
        }
        return `<button class="${cls}" data-o="${oi}"><span class="ol">${LETTERS[vi]}</span>${esc(q.o[oi])}</button>`;
      }).join('')}</div>
      ${QZ.mode === 'practice' && QZ.picks[q.id] !== undefined ? `
        <div class="expl ${QZ.picks[q.id] === q.a ? 'good' : 'bad'}"><b>${QZ.picks[q.id] === q.a ? '✅ সঠিক!' : '❌ ভুল। সঠিক উত্তর: ' + LETTERS[ord.indexOf(q.a)]}</b><p>${esc(q.e)}</p></div>
        <div class="qnav"><button class="btn primary" id="qnxt">${QZ.i === QZ.qs.length - 1 ? 'ফলাফল দেখো 🏁' : 'পরের প্রশ্ন →'}</button></div>` :
        QZ.mode === 'exam' ? `<div class="qnav"><button class="btn ghost" id="qprev" ${QZ.i ? '' : 'disabled'}>←</button>
        <button class="btn primary" id="qnxt">${QZ.i === QZ.qs.length - 1 ? 'জমা দাও 🏁' : 'পরের →'}</button></div>` : ''}
    </div>
    ${QZ.mode === 'exam' ? `<div class="pal">${QZ.qs.map((m, i) => `<button class="pal-b ${QZ.picks[m.id] !== undefined ? 'done' : ''} ${i === QZ.i ? 'cur' : ''}" data-p="${i}">${bn(i + 1)}</button>`).join('')}<button class="btn primary" id="submit-e" style="margin-left:auto">জমা দাও</button></div>` : ''}`;

    $$('.opt').forEach(b => b.onclick = () => {
      const oi = +b.dataset.o;
      if (QZ.mode === 'practice') {
        if (QZ.picks[q.id] !== undefined) return;
        QZ.picks[q.id] = oi;
        record(q, oi === q.a);
        drawQ();
      } else { QZ.picks[q.id] = oi; drawQ(); }
    });
    $('#mk').onclick = () => { if (S.marks[q.id]) delete S.marks[q.id]; else S.marks[q.id] = 1; save(); drawQ(); };
    const nx = $('#qnxt'); if (nx) nx.onclick = () => { if (QZ.i === QZ.qs.length - 1) finish(); else { QZ.i++; drawQ(); } };
    const pv = $('#qprev'); if (pv) pv.onclick = () => { QZ.i--; drawQ(); };
    $$('.pal-b').forEach(b => b.onclick = () => { QZ.i = +b.dataset.p; drawQ(); });
    const sb = $('#submit-e'); if (sb) sb.onclick = () => finish();
  }

  function record(q, ok) {
    if (ok) { S.right[q.id] = (S.right[q.id] || 0) + 1; }
    else { S.wrong[q.id] = (S.wrong[q.id] || 0) + 1; }
    S.byCat = S.byCat || {};
    const c = S.byCat[q.cat] = S.byCat[q.cat] || { r: 0, w: 0 };
    ok ? c.r++ : c.w++;
    save();
  }

  let tmrInt = null;
  function tick() {
    if (!QZ || QZ.mode !== 'exam' || QZ.done) return;
    const left = Math.max(0, Math.round((QZ.deadline - Date.now()) / 1000));
    const el = $('#tmr');
    if (el) { el.textContent = '⏱ ' + bn(Math.floor(left / 60)) + ':' + bn(String(left % 60).padStart(2, '0')); el.classList.toggle('low', left < 60); }
    if (left <= 0) finish();
  }

  function finish() {
    if (tmrInt) { clearInterval(tmrInt); tmrInt = null; }
    QZ.done = true;
    let sc = 0;
    if (QZ.mode === 'exam') {
      QZ.qs.forEach(m => { const p = QZ.picks[m.id]; if (p !== undefined) record(m, p === m.a); if (p === m.a) sc++; });
      S.exams = S.exams || [];
      S.exams.unshift({ d: Date.now(), s: sc, t: QZ.qs.length });
      S.exams = S.exams.slice(0, 12);
    } else {
      sc = QZ.qs.filter(m => QZ.picks[m.id] === m.a).length;
    }
    save();
    drawResult(sc);
  }

  function drawResult(sc) {
    const tot = QZ.qs.length, pct = Math.round(sc / tot * 100);
    $('#qz-area').innerHTML = `
    <div class="card res">
      <h3>${QZ.mode === 'exam' ? '🏁 মক টেস্টের ফলাফল' : '🏁 প্র্যাকটিস শেষ'}</h3>
      <div class="gauge"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" class="gbg"/><circle cx="60" cy="60" r="52" class="gfg" style="stroke-dasharray:${2 * Math.PI * 52 * pct / 100} ${2 * Math.PI * 52}"/><text x="60" y="57">${bn(pct)}%</text><text x="60" y="78" class="gsub">${bn(sc)}/${bn(tot)}</text></svg></div>
      <p class="resmsg">${pct >= 80 ? 'দুর্দান্ত! অ্যাডমিশন-রেডি। 🎉' : pct >= 60 ? 'ভালো! ট্র্যাপগুলো আরেকবার ঝালিয়ে নাও।' : 'লেসনগুলো ঘুরে দেখো, তারপর আবার চেষ্টা করো।'}</p>
      <div class="cta"><button class="btn primary" id="rev-btn">📝 রিভিউ করো</button><button class="btn ghost" id="again-btn">🔁 আবার দাও</button><button class="btn soft" data-v="quiz">← MCQ হাব</button></div>
    </div>
    <div id="review"></div>`;
    $('#rev-btn').onclick = () => {
      $('#review').innerHTML = `<h2 class="vt">রিভিউ</h2>` + QZ.qs.map((m, i) => {
        const p = QZ.picks[m.id];
        const ok = p === m.a;
        const ord = QZ.order[i];
        return `<div class="card rv ${ok ? 'ok' : 'no'}"><div class="rvh"><span>${bn(i + 1)}. ${esc(m.q)}</span><span class="${ok ? 'tick' : 'cross'}">${ok ? '✔' : p === undefined ? '-' : '✘'}</span></div>
        ${p !== undefined && !ok ? `<p class="mini bad-t">তোমার উত্তর: ${LETTERS[ord.indexOf(p)]}. ${esc(m.o[p])}</p>` : ''}
        <p class="mini good-t">সঠিক: ${LETTERS[ord.indexOf(m.a)]}. ${esc(m.o[m.a])}</p>
        <p class="mini">${esc(m.e)}</p></div>`;
      }).join('');
      $('#review').scrollIntoView({ behavior: 'smooth' });
    };
    $('#again-btn').onclick = () => startQuiz({ mode: QZ.mode, qs: shuffle(QZ.qs), time: QZ.time });
  }

  function bindQuiz() {
    const p = $('#m-practice'), e = $('#m-exam'), w = $('#m-wrong');
    if (p) p.onclick = setupPractice;
    if (e) e.onclick = setupExam;
    if (w) w.onclick = startWrong;
    if (QZ && !QZ.done && QZ.mode === 'exam' && !tmrInt) tmrInt = setInterval(tick, 500);
  }

  /* ----- answer key ----- */
  function vKey() {
    return `<h2 class="vt">🔑 Answer Key (${bn(G.mcqs.length)})</h2>
    <p class="sub">প্রশ্নের নম্বরের বিপরীতে সঠিক অপশন-অক্ষর।</p>
    <div class="keygrid">${G.mcqs.map(m => `<div class="key-i" title="${esc(m.q)}"><span>${bn(m.id)}</span><b>${LETTERS[m.a]}</b></div>`).join('')}</div>`;
  }

  /* ----- stats ----- */
  function vStats() {
    S.byCat = S.byCat || {};
    const att = Object.keys(S.right).length + Object.keys(S.wrong).length;
    const acc = att ? Math.round(Object.values(S.right).reduce((a, b) => a + b, 0) / Math.max(1, Object.values(S.right).reduce((a, b) => a + b, 0) + Object.values(S.wrong).reduce((a, b) => a + b, 0)) * 100) : 0;
    return `<h2 class="vt">📊 প্রগ্রেস ড্যাশবোর্ড</h2>
    <div class="grid3">
      <div class="card"><h3>মোট চর্চিত</h3><div class="bigstat"><b>${bn(att)}</b><span>/ ${bn(G.mcqs.length)} প্রশ্ন</span></div><div class="bar"><i style="width:${Math.round(att / G.mcqs.length * 100)}%"></i></div></div>
      <div class="card"><h3>সামগ্রিক নির্ভুলতা</h3><div class="bigstat"><b>${bn(acc)}%</b><span>সঠিকের হার</span></div></div>
      <div class="card"><h3>মাইক্রো-রুল</h3><div class="bigstat"><b>${bn(Object.keys(S.learned).length)}</b><span>/ ৩০ শেখা</span></div></div>
    </div>
    <div class="grid2">
      <div class="card"><h3>টপিকভিত্তিক পারফরম্যান্স</h3>${Object.keys(G.cats).map(c => {
        const d = S.byCat[c] || { r: 0, w: 0 }; const t = d.r + d.w;
        return `<div class="catrow"><span>${G.cats[c]}</span><div class="bar"><i style="width:${t ? Math.round(d.r / t * 100) : 0}%"></i></div><em>${t ? bn(Math.round(d.r / t * 100)) + '%' : '-'}</em></div>`;
      }).join('')}</div>
      <div class="card"><h3>সাম্প্রতিক মক টেস্ট</h3>${(S.exams || []).length ? S.exams.map(x => { const d = new Date(x.d); return `<div class="examrow"><span>${bn(d.getDate())}/${bn(d.getMonth() + 1)}/${bn(d.getFullYear())}</span><b>${bn(x.s)}/${bn(x.t)}</b><em>${bn(Math.round(x.s / x.t * 100))}%</em></div>`; }).join('') : '<p class="sub">এখনো কোনো মক টেস্ট দাওনি।</p>'}
      ${Object.keys(S.marks).length ? `<h3 style="margin-top:16px">🔖 বুকমার্ক (${bn(Object.keys(S.marks).length)})</h3><div class="chips">${Object.keys(S.marks).map(id => `<button class="chip guide" data-bm="${id}">Q${bn(id)}</button>`).join('')}</div>` : ''}
      </div>
    </div>`;
  }
  function bindStats() {
    $$('[data-bm]').forEach(b => b.onclick = () => {
      const id = +b.dataset.bm; const m = G.mcqs.find(x => x.id === id);
      startQuiz({ mode: 'practice', qs: [m] }); cur = 'quiz'; render();
    });
  }

  /* ---------- render ---------- */
  function render() {
    const v = $('#view');
    const map = { home: vHome, overview: vOverview, traps: vTraps, rules: vRules, revision: vRevision, toolkit: vToolkit, solved: vSolved, shorts: vShorts, quiz: vQuiz, key: vKey, stats: vStats };
    if (cur === 'lessons') v.innerHTML = lessonOpen ? vLessonView() : vLessons();
    else v.innerHTML = map[cur]();
    $('#nav').innerHTML = navHTML();
    $$('#nav .nvi').forEach(b => b.onclick = () => { cur = b.dataset.v; if (cur !== 'quiz') QZ = null; if (cur === 'lessons') lessonOpen = false; render(); window.scrollTo(0, 0); });
    $$('[data-v]', v).forEach(b => b.onclick = () => { cur = b.dataset.v; if (cur === 'lessons') lessonOpen = false; render(); window.scrollTo(0, 0); });
    $$('.lcard').forEach(b => b.onclick = () => { curLesson = +b.dataset.l; lessonOpen = true; S.lpos[curLesson] = S.lpos[curLesson] || 0; save(); render(); });
    if (cur === 'lessons' && lessonOpen) bindLesson();
    if (cur === 'rules') bindRules();
    if (cur === 'shorts') bindShorts();
    if (cur === 'quiz') bindQuiz();
    if (cur === 'stats') bindStats();
  }

  let lessonOpen = false;

  const setThemeUI = () => $$('#theme-btn, #theme-btn-tb').forEach(b => b.textContent = S.theme === 'dark' ? '☀️' : '🌙');
  $$('#theme-btn, #theme-btn-tb').forEach(b => b.onclick = () => {
    S.theme = S.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = S.theme; save(); setThemeUI();
  });
  setThemeUI();
  $('#burger').onclick = () => $('#side').classList.toggle('open');

  render();
})();

</script>
</body>
</html>
