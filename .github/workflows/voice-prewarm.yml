name: Voice — pre-warm all content words (manual)

# Generates audio once for every word in the live content, so each word is already
# in the worker's permanent KV + edge cache BEFORE a student taps it. Deploy-only:
# touches no secret, no worker, no code — it just POSTs to the live voice worker.
# Re-runnable: already-cached words return instantly, so a second run costs nothing.
# No secrets are passed to the script; it only calls the public worker endpoints.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type PREWARM to generate and cache audio for every content word
        required: true
        type: string

permissions:
  contents: read

jobs:
  prewarm:
    if: ${{ inputs.confirmation == 'PREWARM' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Pre-warm the voice cache
        run: |
          cat > prewarm.mjs <<'JS'
          const VOICE = 'https://admission-voice.admissionhub.workers.dev/api/voice';
          const CONTENT = 'https://admission-gk.admissionhub.workers.dev/api/content';
          const H = { 'Content-Type': 'application/json', 'X-AH-App': 'admission-hub', 'User-Agent': 'admission-hub-prewarm/1.0' };

          const res = await fetch(CONTENT, { headers: H });
          if (!res.ok) { console.error('content fetch failed', res.status); process.exit(1); }
          const doc = await res.json();
          const rows = [...(doc.vocabulary || []), ...(doc.vocabularyMaster || [])];
          const words = new Set(rows.map(r => String(r.word || r.term || '').trim()).filter(w => w && w.length <= 60 && /^[\p{L}\p{M}][\p{L}\p{M}'’.\- ]*$/u.test(w)));
          // Also warm the app's built-in starter cards and every synonym/antonym
          // they show, so a student tapping one of those is never the first to pay.
          try {
            const src = await (await import('node:fs')).promises.readFile('./vocabulary-a-seed.js', 'utf8');
            const re = /word:\s*'([^']+)'/g;
            let m;
            while ((m = re.exec(src))) {
              const w = m[1].trim();
              if (w && w.length <= 60 && /^[\p{L}\p{M}][\p{L}\p{M}'’.\- ]*$/u.test(w)) words.add(w);
            }
          } catch (_) { /* seed file optional */ }
          const list = [...words];
          console.log('words to warm:', list.length);

          let ok = 0, edge = 0, miss = 0, fail = 0;
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          for (const [i, word] of list.entries()) {
            let done = false;
            for (let attempt = 0; attempt < 4 && !done; attempt += 1) {
              try {
                const r = await fetch(VOICE, { method: 'POST', headers: H, body: JSON.stringify({ word }) });
                if (r.status === 429) { await sleep((Number(r.headers.get('retry-after')) || 20) * 1000); continue; }
                if (!r.ok) { fail++; console.log('FAIL', word, r.status); done = true; continue; }
                const state = r.headers.get('x-voice-cache') || '';
                await r.arrayBuffer();
                ok++;
                if (state === 'hit' || state === 'edge') edge++; else miss++;
                done = true;
              } catch (e) { fail++; console.log('ERR', word, String(e && e.message)); done = true; }
            }
            if (!done) { fail++; console.log('RATE-LIMITED', word); }
            await sleep(1100); /* worker allows 60/min/IP; ~1.1s stays safely under it */
            if ((i + 1) % 20 === 0) console.log('progress', i + 1, '/', list.length);
          }
          console.log(`DONE ok=${ok} already_cached=${edge} newly_generated=${miss} failed=${fail}`);
          JS
          node prewarm.mjs
