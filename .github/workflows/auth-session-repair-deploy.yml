name: Repair auth configuration and deploy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY_AUTH_FIX to apply tested configuration compaction and deploy
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: admission-hub-pages-deploy
  cancel-in-progress: false

jobs:
  repair-and-deploy:
    if: ${{ inputs.confirmation == 'DEPLOY_AUTH_FIX' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Compact duplicate public settings; preserve all secrets and provider quotas
        run: python3 scripts/compact-auth-config.py
      - name: Authentication regression tests
        run: |
          node --check account-access.js
          node --check auth-native/verification/providers.mjs
          node --test --test-concurrency=1 firebase-google-auth.test.mjs verification-providers.test.mjs free-tier-failover.test.mjs compact-auth-config.test.mjs otp-b-lock.test.mjs facebook-login-guard.test.mjs logout-data-safety.test.mjs
      - name: Rebuild and verify generated artifacts
        run: |
          npm run build:worker
          npm run sw:manifest
          npm run check:worker-bundle
      - name: Commit tested source and generated bundle
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wrangler.toml auth-native/verification/providers.mjs firebase-google-auth.test.mjs worker-bundle.mjs sw.js
          if ! git diff --cached --quiet; then
            git commit -m 'fix(auth): compact four public bindings and ship tested nonblocking Google session response'
            git push origin HEAD:main
          fi
          git diff --exit-code
      - name: Deploy repaired Worker without changing secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.35.0 deploy --config wrangler.toml
      - name: Build sanitized Pages bundle
        run: |
          set -eu
          mkdir -p dist
          rsync -a --exclude='dist' --exclude='.git' --exclude='node_modules' --exclude='docs' --exclude='AGENT_RESUME' --exclude='ai-proxy' --exclude='auth' --exclude='auth-native' --exclude='email-gateway' --exclude='apps-script' --exclude='uploads' --exclude='.github' --exclude='scripts' --exclude='gk-agent-worker.js' --exclude='public-worker.js' --exclude='ai-agent.js' --exclude='worker-bundle.mjs' --exclude='auth-worker-bundle.mjs' --exclude='voice-worker.js' --exclude='voice-agent.mjs' --exclude='voice-agent-core.mjs' --exclude='voice-agent-providers.mjs' --exclude='voice-agent-gate.mjs' --exclude='notification-worker.js' --exclude='fcm-notification.mjs' --exclude='p14-abuse-guard.mjs' --exclude='action-engine.js' --exclude='userdata-api.mjs' --exclude='wrangler*.toml' --exclude='package.json' --exclude='package-lock.json' --exclude='*.test.mjs' --exclude='*.md' ./ dist/
          test -s dist/index.html
          test -s dist/sw.js
          test -s dist/account-access.js
          ! test -e dist/auth-native
          ! test -e dist/worker-bundle.mjs
      - name: Deploy admissionsky Pages UI
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.35.0 pages deploy dist --project-name admissionsky --branch main
      - name: Verify live authentication configuration
        run: |
          node --input-type=module - <<'JS'
          const r = await fetch('https://admissionsky.pages.dev/api/auth/v1/config', { headers: { 'Cache-Control': 'no-cache' } });
          const body = await r.json();
          if (!r.ok || body.auth?.available !== true || body.auth?.methods?.google?.available !== true) throw new Error('Live auth readiness failed');
          console.log('Live auth and Google provider: READY. Real-user OAuth still requires a user-side sign-in check.');
          JS
