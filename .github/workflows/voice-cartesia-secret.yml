name: Voice Worker — set Cartesia secret (manual)

# Manual, secret-only workflow: puts CARTESIA_API_KEY on the existing
# admission-voice Worker without touching its code, KV binding, or ELEVENLABS
# fallback. The value comes from the repository secret CARTESIA_API_KEY and is
# never written into this file or the repo.
#
# Required repository secrets: CARTESIA_API_KEY, CLOUDFLARE_API_TOKEN,
# CLOUDFLARE_ACCOUNT_ID.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type SET to write CARTESIA_API_KEY onto the admission-voice worker
        required: true
        type: string

permissions:
  contents: read

jobs:
  put-secret:
    if: ${{ inputs.confirmation == 'SET' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require the Cartesia key to be present
        env:
          CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
        run: |
          if [ -z "$CARTESIA_API_KEY" ]; then
            echo "::error::repository secret CARTESIA_API_KEY is missing or empty"
            exit 1
          fi
          echo "key present (length ${#CARTESIA_API_KEY})"
      - name: Put CARTESIA_API_KEY on the admission-voice worker
        env:
          CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          npm i -g wrangler@4.35.0 >/dev/null 2>&1
          printf '%s' "$CARTESIA_API_KEY" | wrangler secret put CARTESIA_API_KEY --name admission-voice
      - name: Verify the worker now uses Cartesia
        run: |
          set -eu
          sleep 8
          for i in 1 2 3 4 5; do
            body="$(curl -s --max-time 20 "https://admission-voice.admissionhub.workers.dev/health?cb=$RANDOM" || true)"
            echo "health: $body"
            echo "$body" | grep -q '"provider":"cartesia"' && break
            sleep 6
          done
          echo "$body" | grep -q '"provider":"cartesia"' && echo "CARTESIA ACTIVE" || { echo "::error::worker still not on cartesia"; exit 1; }
          en="$(curl -s --max-time 25 -o /tmp/en.mp3 -w '%{http_code}' -X POST "https://admission-voice.admissionhub.workers.dev/api/voice" -H 'Content-Type: application/json' -H 'X-AH-App: admission-hub' --data '{"word":"apple"}' || true)"
          echo "english POST: $en bytes=$(wc -c </tmp/en.mp3 2>/dev/null)"
          bn="$(curl -s --max-time 25 -o /tmp/bn.mp3 -w '%{http_code}' -X POST "https://admission-voice.admissionhub.workers.dev/api/voice" -H 'Content-Type: application/json' -H 'X-AH-App: admission-hub' --data '{"word":"বই"}' || true)"
          echo "bengali POST: $bn bytes=$(wc -c </tmp/bn.mp3 2>/dev/null)"
