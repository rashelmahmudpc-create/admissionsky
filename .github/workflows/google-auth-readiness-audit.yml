name: Google Auth Readiness No-Mutation Audit

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type AUDIT_GOOGLE_AUTH to validate Firebase Google readiness without enabling or signing in
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: admission-hub-google-readiness-audit
  cancel-in-progress: false

jobs:
  readiness:
    if: ${{ inputs.confirmation == 'AUDIT_GOOGLE_AUTH' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: email-gateway-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Validate Firebase Google provider without mutation or credential output
        env:
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
        run: node auth-native/operations/verify-google-readiness.mjs
