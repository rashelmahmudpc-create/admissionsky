name: Audit Firebase Verification Email

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type AUDIT_FIREBASE_VERIFICATION_EMAIL to run controlled header/template and inbox-placement checks with automatic account cleanup
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: admission-hub-email-gateway-production
  cancel-in-progress: false

jobs:
  audit:
    if: ${{ inputs.confirmation == 'AUDIT_FIREBASE_VERIFICATION_EMAIL' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: email-gateway-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Verify token-safe audit parser
        run: node --test native-auth-operations.test.mjs

      - name: Audit one real verification message and clean up automatically
        env:
          AUTH_LIVE_BASE: https://admissionhub.pages.dev
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
        run: node auth-native/operations/live-mailbox-e2e.mjs

      - name: Audit real inbox-placement and authentication signals and clean up automatically
        env:
          AUTH_LIVE_BASE: https://admissionhub.pages.dev
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
        run: node auth-native/operations/live-placement-audit.mjs
