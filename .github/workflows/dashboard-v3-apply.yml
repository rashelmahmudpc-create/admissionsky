name: Apply Dashboard v3 (manual)

# One-shot, owner-approved (2026-10-15): replaces the dashboard UI file with the
# verified Scholar Dashboard v3 build, regenerates the SW asset digests and
# commits both to main. Frontend only - no backend / worker / secret changes.

on:
  workflow_dispatch:
    inputs:
      url:
        description: Build URL
        required: true
        type: string
      sha256:
        description: Expected sha256 of dashboard-v2.js
        required: true
        type: string

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Download and verify build
        env:
          URL: ${{ inputs.url }}
          SHA: ${{ inputs.sha256 }}
        run: |
          set -eu
          curl -fsSL "$URL" -o /tmp/dashboard-v2.js
          echo "$SHA  /tmp/dashboard-v2.js" | sha256sum -c -
          node --check /tmp/dashboard-v2.js
          # A download that matches its hash and parses is NOT a working build.
          # The 2026-10-15 breakage passed both checks with an empty design block
          # (<style></style>, 0 bytes) and shipped unstyled markup whose tool
          # labels collided. Assert the design block is actually present before
          # this file is allowed anywhere near main.
          node -e '
            const s = require("fs").readFileSync("/tmp/dashboard-v2.js", "utf8");
            const blocks = [...s.matchAll(/<style[^>]*>([\s\S]*?)<\/style>/g)].map(m => m[1]);
            const css = blocks.join("\n");
            const die = (m) => { console.error("REFUSING BUILD: " + m); process.exit(1); };
            if (!blocks.length) die("no <style> block at all");
            if (blocks.some(b => b.trim() === "")) die("empty <style> block");
            if (css.length < 8000) die("design block only " + css.length + " bytes");
            if (!/\.tools\s*\{/.test(css) || !/\.tl\s*\{/.test(css)) die("tool-grid styles missing");
            console.log("design block OK: " + css.length + " bytes of CSS");
          '
          cp /tmp/dashboard-v2.js dashboard-v2.js
      - name: Regenerate SW digests
        run: node scripts/sw-manifest.mjs
      - name: Commit
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard-v2.js sw.js
          git diff --cached --stat
          git diff --cached --quiet || git commit -m "feat(dashboard): Scholar Dashboard v3 - new UI wired to real CACHE data, no demo values"
          git push origin HEAD:main
