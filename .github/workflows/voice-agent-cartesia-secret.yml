name: Voice Agent — put provider keys in KV (manual)

# Manual workflow: stores provider API keys in the GK_KV namespace under
# `secret:<NAME>`, which the voice agent reads at startup.
#
# Why KV and not `wrangler secret put`: the Workers Free plan caps a Worker at
# 64 variables (secrets + text) and admission-gk is already at that cap, so
# binding one more fails with code 10055. A KV entry is not a variable and does
# not count against the cap, so it is the way to add a key without a paid plan.
#
# CARTESIA_API_KEY gives the agent a real voice. GROQ_API_KEY gives it hearing
# (whisper) and a second brain (gpt-oss-120b), so a spent Gemini free tier does
# not leave it mute — the Gemini free tier is only 20 requests/day.
# VOICE_PAGE_PASSWORD is the owner's password for the voice page itself; the
# Worker signs a cookie with it and never sends the password to the browser.
#
# Values come from repository secrets and are never written into this file or
# the repo. A key whose repository secret is absent is skipped, not an error.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type SET to store the provider keys in GK_KV
        required: true
        type: string

permissions:
  contents: read

jobs:
  put-secrets:
    if: ${{ inputs.confirmation == 'SET' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Store the provider keys in GK_KV
        env:
          CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          VOICE_PAGE_PASSWORD: ${{ secrets.VOICE_PAGE_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          npm i -g wrangler@4.35.0 >/dev/null 2>&1
          # b9353515b098427687afcfb8654ed359 is the namespace wrangler.toml binds
          # as GK_KV. Each value goes through a temp file, not argv, so the key
          # never reaches the process list or the run log.
          put() {
            name="$1"; value="$2"
            if [ -z "$value" ]; then echo "skip $name (no repository secret)"; return 0; fi
            tmp="$(mktemp)"
            printf '%s' "$value" > "$tmp"
            wrangler kv key put --namespace-id b9353515b098427687afcfb8654ed359 \
              --remote "secret:$name" --path "$tmp"
            rm -f "$tmp"
            echo "stored $name (length ${#value})"
          }
          put CARTESIA_API_KEY "$CARTESIA_API_KEY"
          put GROQ_API_KEY "$GROQ_API_KEY"
          put VOICE_PAGE_PASSWORD "$VOICE_PAGE_PASSWORD"
      - name: Verify the voice agent pools grew
        run: |
          set -eu
          # Health reports provider COUNTS, never keys. Cartesia leads tts (so
          # tts is at least 2 with the Gemini fallback) and Groq adds stt + llm.
          sleep 8
          body=""
          for i in 1 2 3 4 5; do
            body="$(curl -s --max-time 20 "https://admission-gk.admissionhub.workers.dev/api/voice/agent/health?cb=$RANDOM" || true)"
            echo "health: $body"
            echo "$body" | grep -qE '"stt":[2-9]' && echo "$body" | grep -qE '"llm":[2-9]' && break
            sleep 6
          done
          echo "$body" | grep -qE '"stt":[2-9]' || { echo "::error::stt pool did not grow — Groq key missing?"; exit 1; }
          echo "$body" | grep -qE '"llm":[2-9]' || { echo "::error::llm pool did not grow — Groq key missing?"; exit 1; }
          echo "GROQ IN KV — stt and llm pools grew past the Gemini-only fallback"
