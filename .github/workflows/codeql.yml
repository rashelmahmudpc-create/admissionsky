name: CodeQL

# Static security analysis for the JavaScript code. Results appear under
# Security -> Code scanning. Free for public repositories.
on:
  push:
    branches: [main]
  schedule:
    - cron: '30 18 * * 4'   # Friday 00:30 Asia/Dhaka
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
          config: |
            paths-ignore:
              - node_modules
              - sdk
              - worker-bundle.mjs
              - '**/*.test.mjs'

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript
