name: Deploy Voice Worker Secret
permissions:
  contents: read
# admission-voice worker-এ ELEVENLABS_API_KEY আপডেট (কোড/KV-বাইন্ডিং অটুট থাকে)।
# key মান GitHub-Secret-এ থাকে — এই ফাইলে/রিপোতে কখনো লেখা হয় না।
on:
  workflow_dispatch:
jobs:
  put-secret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Update ELEVENLABS_API_KEY secret on admission-voice worker
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm i -g wrangler@3 >/dev/null 2>&1
          echo "$ELEVENLABS_API_KEY" | wrangler secret put ELEVENLABS_API_KEY --name admission-voice
