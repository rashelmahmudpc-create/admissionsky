name: Email Gateway Infisical Secret Staging

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type STAGE_INFISICAL_SECRETS to stage the protected Worker bindings with activation disabled
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: admission-hub-email-gateway-production
  cancel-in-progress: false

jobs:
  stage-worker-secrets:
    if: ${{ inputs.confirmation == 'STAGE_INFISICAL_SECRETS' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: email-gateway-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Verify non-secret Infisical connection metadata
        env:
          INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID }}
          INFISICAL_PROJECT_SLUG: ${{ vars.INFISICAL_PROJECT_SLUG }}
          INFISICAL_ENV_SLUG: ${{ vars.INFISICAL_ENV_SLUG }}
          INFISICAL_SECRET_PATH: ${{ vars.INFISICAL_SECRET_PATH }}
        run: |
          set -eu
          test -n "$INFISICAL_IDENTITY_ID" || { echo "::error title=Infisical connection incomplete::Missing INFISICAL_IDENTITY_ID environment variable."; exit 1; }
          test -n "$INFISICAL_PROJECT_SLUG" || { echo "::error title=Infisical connection incomplete::Missing INFISICAL_PROJECT_SLUG environment variable."; exit 1; }
          test "$INFISICAL_ENV_SLUG" = "prod" || { echo "::error title=Infisical connection incomplete::INFISICAL_ENV_SLUG must be prod (the Infisical Production environment slug)."; exit 1; }
          test "$INFISICAL_SECRET_PATH" = "/email-gateway" || { echo "::error title=Infisical connection incomplete::INFISICAL_SECRET_PATH must be /email-gateway."; exit 1; }

      - name: Fetch production Email Gateway secrets from Infisical using OIDC
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ vars.INFISICAL_ENV_SLUG }}
          secret-path: ${{ vars.INFISICAL_SECRET_PATH }}
          recursive: false
          include-imports: false
          export-type: env
          domain: ${{ vars.INFISICAL_DOMAIN || 'https://app.infisical.com' }}

      - name: Validate names and prepare ephemeral activation-disabled payload
        env:
          EMAIL_GATEWAY_SECRET_BULK_PATH: ${{ runner.temp }}/admission-hub-email-gateway-secrets.json
        run: node email-gateway/operations/prepare-infisical-worker-secrets.mjs

      - name: Stage isolated secrets in the Admission Hub Worker
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: secret bulk ${{ runner.temp }}/admission-hub-email-gateway-secrets.json --name admission-gk

      - name: Remove ephemeral secret payload
        if: ${{ always() }}
        run: rm -f -- "${RUNNER_TEMP}/admission-hub-email-gateway-secrets.json"

      - name: Require complete names-only Worker inventory
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKER_NAME: admission-gk
          EMAIL_GATEWAY_REQUIRE_COMPLETE_BINDINGS: 'true'
        run: node email-gateway/operations/inventory-cloudflare-bindings.mjs

      - name: Verify public health and unsigned internal protection
        run: |
          set -eu
          public_status="$(curl --silent --show-error --connect-timeout 10 --max-time 20 --output /dev/null --write-out '%{http_code}' "https://admission-gk.admissionhub.workers.dev/pub/health?infisical_stage=${GITHUB_RUN_ID}")"
          internal_status="$(curl --silent --show-error --connect-timeout 10 --max-time 20 --output /dev/null --write-out '%{http_code}' "https://admission-gk.admissionhub.workers.dev/internal/email/health?infisical_stage=${GITHUB_RUN_ID}")"
          test "$public_status" = "200"
          test "$internal_status" = "403" -o "$internal_status" = "404"
          echo "Infisical bindings are staged with activation disabled; public health is ready and the unsigned internal route is protected."
