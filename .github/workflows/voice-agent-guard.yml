name: Voice Agent Guard
permissions:
  contents: read
on:
  push:
    branches: [main]
    paths:
      - 'voice-agent*.mjs'
      - 'voice-agent*.html'
      - 'voice-agent-core.mjs'
      - 'voice-agent-providers.mjs'
      - 'memory-engine.js'
      - 'wrangler.toml'
      - 'gk-agent-worker.js'
      - 'package.json'
      - '.github/workflows/voice-agent-guard.yml'
  pull_request:
    paths:
      - 'voice-agent*.mjs'
      - 'voice-agent*.html'
      - 'voice-agent-core.mjs'
      - 'voice-agent-providers.mjs'
      - 'memory-engine.js'
      - 'wrangler.toml'
      - 'gk-agent-worker.js'
      - 'package.json'
      - '.github/workflows/voice-agent-guard.yml'
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Verify provider failover, session state, memory persistence and secret hygiene
        run: npm run test:p23
      - name: Verify the committed worker bundle matches source
        run: npm run check:worker-bundle
