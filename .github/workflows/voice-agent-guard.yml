name: Voice Agent Guard
permissions:
  contents: read
on:
  push:
    branches: [main]
    paths:
      - 'voice-agent*.mjs'
      - 'voice-agent*.html'
      - 'voice-agent-core.mjs'
      - 'voice-agent-providers.mjs'
      - 'memory-engine.js'
      - 'wrangler.toml'
      - 'gk-agent-worker.js'
      - 'package.json'
      - '.github/workflows/voice-agent-guard.yml'
  pull_request:
    paths:
      - 'voice-agent*.mjs'
      - 'voice-agent*.html'
      - 'voice-agent-core.mjs'
      - 'voice-agent-providers.mjs'
      - 'memory-engine.js'
      - 'wrangler.toml'
      - 'gk-agent-worker.js'
      - 'package.json'
      - '.github/workflows/voice-agent-guard.yml'
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: Verify provider failover, session state, memory persistence and secret hygiene
        run: npm run test:p23
      - name: Verify the committed worker bundle matches source
        run: npm run check:worker-bundle
