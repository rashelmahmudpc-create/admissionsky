name: Cloudflare Native Auth Guard
on:
  push:
    branches: [main]
    paths:
      - 'auth-native/**'
      - 'apps-script/**'
      - 'otp-b-lock.test.mjs'
      - 'native-auth*.test.mjs'
      - 'firebase-auth-ui.test.mjs'
      - 'multimethod-auth-ui.test.mjs'
      - 'telegram-otp-ui.test.mjs'
      - 'premium-onboarding-ui.test.mjs'
      - 'account-retirement.test.mjs'
      - 'identity-lifecycle.test.mjs'
      - 'account-state-runtime.test.mjs'
      - 'account-state-api.test.mjs'
      - 'session-recovery-api.test.mjs'
      - 'session-recovery-chaos.test.mjs'
      - 'security-*.test.mjs'
      - 'docs/SECURITY-CORE-PROTECTION.md'
      - 'account-access.js'
      - 'account-access.css'
      - 'institutions-bd.js'
      - 'ai-agent.js'
      - 'ai-agent-f1.test.mjs'
      - 'ai-provider-adapters.test.mjs'
      - 'phase9-m4-context-engine.test.mjs'
      - 'context-engine.js'
      - 'gk-agent-worker.js'
      - 'worker-bundle.mjs'
      - 'wrangler.toml'
      - '_worker.js'
      - 'index.html'
      - 'admin-passkey.mjs'
      - 'admin-passkey.test.mjs'
      - 'notification-command-center.html'
      - 'notification-command-center-*.test.mjs'
      - 'notification-admin-keyboard.test.mjs'
      - 'sw.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/native-auth-*'
      - '.github/workflows/firebase-auth-*'
      - '.github/CODEOWNERS'
  pull_request:
    paths:
      - 'auth-native/**'
      - 'apps-script/**'
      - 'otp-b-lock.test.mjs'
      - 'native-auth*.test.mjs'
      - 'firebase-auth-ui.test.mjs'
      - 'multimethod-auth-ui.test.mjs'
      - 'telegram-otp-ui.test.mjs'
      - 'premium-onboarding-ui.test.mjs'
      - 'account-retirement.test.mjs'
      - 'identity-lifecycle.test.mjs'
      - 'account-state-runtime.test.mjs'
      - 'account-state-api.test.mjs'
      - 'session-recovery-api.test.mjs'
      - 'session-recovery-chaos.test.mjs'
      - 'security-*.test.mjs'
      - 'docs/SECURITY-CORE-PROTECTION.md'
      - 'account-access.js'
      - 'account-access.css'
      - 'institutions-bd.js'
      - 'ai-agent.js'
      - 'ai-agent-f1.test.mjs'
      - 'ai-provider-adapters.test.mjs'
      - 'phase9-m4-context-engine.test.mjs'
      - 'context-engine.js'
      - 'gk-agent-worker.js'
      - 'worker-bundle.mjs'
      - 'wrangler.toml'
      - '_worker.js'
      - 'index.html'
      - 'admin-passkey.mjs'
      - 'admin-passkey.test.mjs'
      - 'notification-command-center.html'
      - 'notification-command-center-*.test.mjs'
      - 'notification-admin-keyboard.test.mjs'
      - 'sw.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/native-auth-*'
      - '.github/workflows/firebase-auth-*'
      - '.github/CODEOWNERS'
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify exact Worker bundle
        run: npm run check:worker-bundle
      - name: Verify Firebase Auth security and behavior
        run: npm run test:native-auth
      - name: Verify Identity Regression Suite (Protected Identity Core)
        run: npm run test:identity
      - name: Verify legacy account implementation remains retired
        run: node account-retirement.test.mjs
      - name: Check the Gmail otp-b backup mailer is still wired (advisory)
        continue-on-error: true
        run: node --test otp-b-lock.test.mjs
