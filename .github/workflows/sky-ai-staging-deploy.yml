# F0.3 — deploy the staging twin of the sky-ai Worker (`sky-ai-staging`).
#
# Manual and DEPLOY-gated, exactly like deploy-staging.yml: staging is a test
# surface, so nothing here runs on a push. The isolation guard runs first and
# refuses a config that names a production resource or the live sky-ai Worker,
# which is the whole point of the twin — a staging AI test must not read live
# prefs or spend live chat quota.
#
# Order matters: sky-ai-staging must exist before admission-gk-staging is
# deployed, because the app config binds it as SKY_AI and wrangler refuses a
# binding that points at a script that is not there yet.
name: Deploy Staging Sky AI Worker (manual)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY to publish sky-ai/worker.mjs to sky-ai-staging
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: sky-ai-staging-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ inputs.confirmation == 'DEPLOY' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Unit tests
        run: node --test sky-ai/*.test.mjs sky-ai-route-identity.test.mjs
      - name: Refuse to deploy an unisolated staging config
        run: node scripts/check-staging-isolation.mjs sky-ai/wrangler.staging.toml
      - name: Deploy sky-ai-staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          npm i -g wrangler@4.35.0 >/dev/null 2>&1
          cd sky-ai
          wrangler deploy --config wrangler.staging.toml
      - name: Verify the staging twin answers, and is a twin and not the live Worker
        run: |
          set -eu
          sleep 5
          # Staging keeps a workers.dev URL, so the health check can be direct —
          # unlike production, whose only door is the admission-gk binding.
          for i in 1 2 3 4 5; do
            body="$(curl -s --max-time 20 "https://sky-ai-staging.admissionhub.workers.dev/health?cb=$RANDOM" || true)"
            echo "health: $body"
            echo "$body" | grep -q '"service":"sky-ai"' && exit 0
            sleep 6
          done
          echo "::error::sky-ai-staging health check failed"
          exit 1
