name: visual-guard
# Screenshot safety net. Runs on every PR. Never pushes to main.
on:
  pull_request:
    paths:
      - '*.html'
      - '*.css'
      - '*.js'
      - '*.mjs'
      - 'slug/**'
      - 'tests/visual/**'
      - '.github/workflows/visual-guard.yml'
  push:
    branches: ['safety/**']
  workflow_dispatch:
    inputs:
      update:
        description: 'Make new baseline images (true/false)'
        default: 'false'
# CI-001 (2026-10-30): the test job below runs PR-controlled content, so it must
# not hold a write token. It is read-only; the one step that needs to commit a
# baseline lives in the separate `save-baseline` job, which is gated on a trusted
# event (push to safety/** or an explicit workflow_dispatch) and never on
# pull_request. GitHub grants permissions per job, not per step, so the split is
# what actually removes the write scope from the PR path.
permissions:
  contents: read
concurrency:
  group: visual-guard-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: Install playwright-core only
        run: npm i --no-save --no-audit --no-fund --ignore-scripts playwright-core@1.55.0
      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium
      - name: Install Bengali fonts (same family the site uses)
        run: sudo apt-get install -y -qq fonts-noto-core
      - name: Make baseline if missing (or asked)
        id: base
        run: |
          if [ "${{ github.event.inputs.update }}" = "true" ] || [ -z "$(ls tests/visual/baseline/*.png 2>/dev/null)" ]; then
            node tests/visual/visual-guard.mjs --update
            echo "made=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Compare run 1
        run: node tests/visual/visual-guard.mjs
      - name: Compare run 2 (must also pass)
        run: node tests/visual/visual-guard.mjs
      - name: Self-check - broken CSS must FAIL
        run: |
          git fetch -q origin tag exam-center-backup || true
          if git show exam-center-backup:exam-center-sky.css > tests/visual/broken-check.css 2>/dev/null; then
            if VG_INJECT_CSS=tests/visual/broken-check.css VG_OUT=tests/visual/output/broken-check node tests/visual/visual-guard.mjs; then
              echo "::error::Guard did NOT catch the known broken CSS"; exit 1
            fi
            echo "OK: guard caught the broken CSS"
          else
            echo "::warning::exam-center-backup tag not found, self-check skipped"
          fi
          rm -f tests/visual/broken-check.css
      - name: Upload new baseline images
        if: steps.base.outputs.made == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-baseline
          path: tests/visual/baseline/*.png
      - name: Upload failed screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-diff
          path: tests/visual/output/

  # Trusted-ref only: commits a freshly made baseline. No PR ever reaches here,
  # so PR-controlled content never runs with a write token.
  save-baseline:
    needs: visual
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Download the baseline the test job produced
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: visual-baseline
          path: tests/visual/baseline
      - name: Commit the baseline to this branch (never main)
        run: |
          test -n "$(ls tests/visual/baseline/*.png 2>/dev/null)" || { echo "no baseline artifact; nothing to save"; exit 0; }
          git config user.name "visual-guard-bot"
          git config user.email "visual-guard-bot@users.noreply.github.com"
          git add tests/visual/baseline/*.png
          git commit -m "visual-guard: baseline images made on CI Linux" || exit 0
          test "${GITHUB_REF_NAME}" != "main" || { echo "refusing to commit a baseline to main"; exit 1; }
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
