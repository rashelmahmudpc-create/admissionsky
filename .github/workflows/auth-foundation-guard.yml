name: Auth Foundation Guard
permissions:
  contents: read
on:
  push:
    branches: [main]
    paths:
      - 'auth/**'
      - 'auth-foundation.test.mjs'
      - 'auth-foundation-chaos.test.mjs'
      - 'auth-protection.test.mjs'
      - '.github/workflows/auth-foundation-guard.yml'
      - '.github/CODEOWNERS'
      - 'docs/AUTH-*'
      - 'docs/EMAIL-GATEWAY-*'
      - 'package.json'
  pull_request:
    paths:
      - 'auth/**'
      - 'auth-foundation.test.mjs'
      - 'auth-foundation-chaos.test.mjs'
      - 'auth-protection.test.mjs'
      - '.github/workflows/auth-foundation-guard.yml'
      - '.github/CODEOWNERS'
      - 'docs/AUTH-*'
      - 'docs/EMAIL-GATEWAY-*'
      - 'package.json'
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: Verify Auth architecture, recovery, chaos and protection contracts
        run: npm run test:auth
