name: Auth Foundation Guard
permissions:
  contents: read
on:
  push:
    branches: [main]
    paths:
      - 'auth/**'
      - 'auth-foundation.test.mjs'
      - 'auth-foundation-chaos.test.mjs'
      - 'auth-protection.test.mjs'
      - '.github/workflows/auth-foundation-guard.yml'
      - '.github/CODEOWNERS'
      - 'docs/AUTH-*'
      - 'docs/EMAIL-GATEWAY-*'
      - 'package.json'
  pull_request:
    paths:
      - 'auth/**'
      - 'auth-foundation.test.mjs'
      - 'auth-foundation-chaos.test.mjs'
      - 'auth-protection.test.mjs'
      - '.github/workflows/auth-foundation-guard.yml'
      - '.github/CODEOWNERS'
      - 'docs/AUTH-*'
      - 'docs/EMAIL-GATEWAY-*'
      - 'package.json'
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Verify Auth architecture, recovery, chaos and protection contracts
        run: npm run test:auth
