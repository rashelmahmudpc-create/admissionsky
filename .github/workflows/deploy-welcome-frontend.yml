name: Deploy Welcome UI (frontend only)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY_FRONTEND to publish Pages UI only; backend Worker is untouched
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: admission-hub-pages-deploy
  cancel-in-progress: false
jobs:
  pages:
    if: ${{ inputs.confirmation == 'DEPLOY_FRONTEND' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate isolated welcome UI
        run: |
          node --check sky-onboarding.js
          node --check app-seed.js
          node --test p19-perf-budget.test.mjs seo-routing.test.mjs
          npm run check:sw-manifest
      - name: Build sanitized frontend bundle
        run: |
          set -eu
          rm -rf dist
          mkdir -p dist
          rsync -a --exclude='.git' --exclude='node_modules' --exclude='dist' --exclude='docs' --exclude='AGENT_RESUME' --exclude='ai-proxy' --exclude='auth' --exclude='auth-native' --exclude='email-gateway' --exclude='apps-script' --exclude='uploads' --exclude='.github' --exclude='gk-agent-worker.js' --exclude='public-worker.js' --exclude='ai-agent.js' --exclude='worker-bundle.mjs' --exclude='auth-worker-bundle.mjs' --exclude='voice-worker.js' --exclude='notification-worker.js' --exclude='fcm-notification.mjs' --exclude='wrangler.toml' --exclude='package.json' --exclude='package-lock.json' --exclude='*.test.mjs' --exclude='*.md' ./ dist/
          node scripts/build-welcome-pages.mjs dist
          test -s dist/index.html
          test -s dist/sw.js
          test -s dist/sky-onboarding.js
      - name: Deploy Pages frontend only
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.35.0'
          command: pages deploy dist --project-name admissionhub --branch main --commit-hash ${{ github.sha }}

      # The owner's shorter admission sky address must serve the same bytes, so a
      # frontend-only fix reaches both hosts without touching the backend Worker.
      - name: Ensure the admissionsky Pages project exists
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.35.0'
          command: pages project create admissionsky --production-branch main
      - name: Deploy Pages frontend only to the short address
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.35.0'
          command: pages deploy dist --project-name admissionsky --branch main --commit-hash ${{ github.sha }}
