name: Sky rich answers + live progress + speed (apply-verify-commit-deploy)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY to apply the verified patch, commit and deploy
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: admission-hub-pages-deploy
  cancel-in-progress: false

jobs:
  fix:
    if: ${{ inputs.confirmation == 'DEPLOY' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Confirm the committed Worker bundle is in sync before patching
        run: npm run check:worker-bundle
      - name: Fetch and apply verified patch
        run: |
          set -eu
          curl -fsSL "https://backend.composio.dev/api/v3/sl/HPGEa9Y_Cp" -o /tmp/sky.patch
          echo "7e45cd21bba0911f9705adb252588cb198e09d101b7b6da2014091fde7da0972  /tmp/sky.patch" | sha256sum -c -
          git apply --3way /tmp/sky.patch
          node --check ai-agent-chat.js
          node --check sw.js
      - name: Rebuild Worker bundle and SW manifest
        run: |
          set -eu
          npm run build:worker
          npm run check:worker-bundle
          node scripts/sw-manifest.mjs
          grep -Fq "const BUILD_ID = 'v340-sky-rich-live'" sw.js
          grep -Fq "v340-sky-rich-live" index.html
          grep -Fq "ai-agent-chat.js?v=agent-f1-ui-skyv3" index.html
      - name: Tests
        run: node --test ai-live-stages.test.mjs ai-chat-history.test.mjs p21-ai-agent-ui.test.mjs ai-agent-f1.test.mjs phase9-m5-prompt-registry.test.mjs phase9-m6-tool-registry.test.mjs phase9-m7-memory-engine.test.mjs phase9-m10-observability.test.mjs fcm-global-contract.test.mjs idb-hardening.test.mjs account-retirement.test.mjs
      - name: Commit fix to main
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':!.github'
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "feat(sky): rich Markdown answers, real live-progress stages, faster first token, status-bar colour sync"; git push origin HEAD:main; fi
      - name: Deploy Worker (admission-gk)
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.35.0'
          command: deploy --config wrangler.toml
      - name: Build sanitized Pages bundle
        run: |
          set -eu
          rm -rf dist
          mkdir -p dist
          rsync -a --exclude='.git' --exclude='node_modules' --exclude='dist' --exclude='docs' --exclude='AGENT_RESUME' --exclude='ai-proxy' --exclude='auth' --exclude='auth-native' --exclude='email-gateway' --exclude='apps-script' --exclude='uploads' --exclude='.github' --exclude='gk-agent-worker.js' --exclude='public-worker.js' --exclude='ai-agent.js' --exclude='worker-bundle.mjs' --exclude='voice-worker.js' --exclude='voice-agent.mjs' --exclude='voice-agent-core.mjs' --exclude='voice-agent-providers.mjs' --exclude='voice-agent-gate.mjs' --exclude='notification-worker.js' --exclude='fcm-notification.mjs' --exclude='wrangler.toml' --exclude='wrangler.staging.toml' --exclude='package.json' --exclude='package-lock.json' --exclude='*.test.mjs' --exclude='*.md' ./ dist/
          test -s dist/index.html; test -s dist/ai-agent-chat.js; test -s dist/sw.js
          grep -Fq "v340-sky-rich-live" dist/sw.js
      - name: Deploy to Cloudflare Pages (admissionsky)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          npx --yes wrangler@4.35.0 pages deploy dist --project-name admissionsky --branch main --commit-hash "$(git rev-parse HEAD)"
