name: Study Lock Timer

# Server-side study lock. Work on this repo is allowed ONLY 23:00-23:59
# Asia/Dhaka, every day, until 2027-02-01. Outside the window it:
#   1. activates the "Study Lock" ruleset (no push/merge/branch on ANY branch,
#      empty bypass list -> applies to owner, agents and every token), and
#   2. blocks all `uses:` actions, so deploy / workflow_dispatch jobs fail.
# This job itself uses no actions, so it keeps running and reopens at 23:00.
# Needs secret STUDY_LOCK_TOKEN (fine-grained PAT, this repo only,
# Administration: read & write). AGENTS: never edit, disable or bypass this.

on:
  schedule:
    - cron: '3,20,40 17 * * *'  # 23:03/23:20/23:40 Dhaka -> open
    - cron: '3,20 18 * * *'     # 00:03/00:20 Dhaka -> lock
    - cron: '10 */2 * * *'      # self-heal every 2 hours
  workflow_dispatch:

permissions: {}

concurrency: study-lock

jobs:
  toggle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open or lock by Dhaka time
        env:
          GH_TOKEN: ${{ secrets.STUDY_LOCK_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          if [ -z "${GH_TOKEN:-}" ]; then echo '::error::STUDY_LOCK_TOKEN secret is missing'; exit 1; fi
          H=$(TZ=Asia/Dhaka date +%H); D=$(TZ=Asia/Dhaka date +%Y%m%d)
          if [ "$D" -ge 20270201 ] || [ "$D" = "20261024" ] || [ "$H" = "23" ]; then ENF=disabled; ACT=all; else ENF=active; ACT=local_only; fi
          BODY=$(printf '{"name":"Study Lock","target":"branch","enforcement":"%s","bypass_actors":[],"conditions":{"ref_name":{"include":["~ALL"],"exclude":[]}},"rules":[{"type":"creation"},{"type":"update"},{"type":"deletion"},{"type":"non_fast_forward"}]}' "$ENF")
          ID=$(gh api "repos/$REPO/rulesets" --jq '.[] | select(.name=="Study Lock") | .id' | head -n1)
          if [ -z "$ID" ]; then
            echo "$BODY" | gh api -X POST "repos/$REPO/rulesets" --input - >/dev/null
          else
            echo "$BODY" | gh api -X PUT "repos/$REPO/rulesets/$ID" --input - >/dev/null
          fi
          echo "{\"enabled\":true,\"allowed_actions\":\"$ACT\"}" | gh api -X PUT "repos/$REPO/actions/permissions" --input - >/dev/null
          # local_only = no external `uses:` actions (GitHub rejects "selected" with all three flags off -> 409).
          echo "Dhaka hour=$H  ruleset=$ENF  actions=$ACT"
