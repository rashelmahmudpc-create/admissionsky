name: Secret Scan (Gitleaks)

# Scans the FULL git history for leaked keys/tokens on every push to main and
# every PR. Findings are redacted in the log. Free for personal repositories.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks version

      - name: Scan full history (redacted)
        run: ./gitleaks git --redact --no-banner --exit-code 1 --config .gitleaks.toml --report-format sarif --report-path gitleaks.sarif .

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          if-no-files-found: ignore
          retention-days: 7
