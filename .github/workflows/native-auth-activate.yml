name: Activate Firebase Canonical Auth + Google

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type ACTIVATE_FIREBASE_AUTH to deploy Firebase canonical Email/Password + Google + Passkey + the generic backup flow
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: admission-hub-email-gateway-production
  cancel-in-progress: false

jobs:
  activate:
    if: ${{ inputs.confirmation == 'ACTIVATE_FIREBASE_AUTH' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: email-gateway-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify exact Worker bundle and production Auth contracts
        run: |
          set -eu
          npm run check:worker-bundle
          npm run test:production-auth
          node account-retirement.test.mjs

      - name: Install browser only for the protected release audit
        run: npx playwright-core install --with-deps chromium

      - name: Audit premium onboarding on iPhone, desktop, keyboard, reduced-motion, and offline modes
        run: npm run audit:premium-browser

      - name: Validate Firebase project and authorized Pages domain without mutation
        env:
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
        run: node auth-native/operations/verify-firebase-config.mjs

      - name: Capture current Worker version for bounded rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          npx --yes wrangler@4.35.0 deployments status --name admission-gk --json > "${RUNNER_TEMP}/worker-deployment.json"
          PREVIOUS_WORKER_VERSION="$(node -e "const x=require(process.argv[1]); const rows=Array.isArray(x)?x:[x]; const versions=rows.flatMap(row=>Array.isArray(row?.versions)?row.versions:[]); const v=versions.find(v=>Number(v.percentage)===100); if(!v?.version_id) process.exit(1); process.stdout.write(v.version_id)" "${RUNNER_TEMP}/worker-deployment.json")"
          rm -f "${RUNNER_TEMP}/worker-deployment.json"
          echo "PREVIOUS_WORKER_VERSION=${PREVIOUS_WORKER_VERSION}" >> "$GITHUB_ENV"

      - name: Deploy Worker and SQLite Auth schema fail closed
        id: worker-deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.35.0'
          command: deploy --config wrangler.toml

      - name: Install Firebase Web API key on the deployed Worker version
        id: firebase-secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
        run: |
          set -eu
          test -n "$FIREBASE_WEB_API_KEY"
          printf '%s' "$FIREBASE_WEB_API_KEY" | npx --yes wrangler@4.35.0 secret put FIREBASE_WEB_API_KEY --name admission-gk

      - name: Verify Firebase binding exists without reading its value
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIREBASE_WORKER_BINDING_EXPECT: present
        run: node auth-native/operations/verify-worker-binding.mjs

      - name: Run real Firebase signup, external-inbox verification, verified-only gate, session, and logout
        env:
          AUTH_LIVE_BASE: https://admission-gk.admissionhub.workers.dev
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
        run: node auth-native/operations/live-mailbox-e2e.mjs

      - name: Build sanitized Pages bundle
        run: |
          set -eu
          rm -rf dist
          mkdir -p dist
          rsync -a --exclude='.git' --exclude='node_modules' --exclude='docs' --exclude='AGENT_RESUME' --exclude='ai-proxy' --exclude='auth' --exclude='auth-native' --exclude='email-gateway' --exclude='uploads' --exclude='.github' --exclude='gk-agent-worker.js' --exclude='public-worker.js' --exclude='ai-agent.js' --exclude='worker-bundle.mjs' --exclude='auth-worker-bundle.mjs' --exclude='voice-worker.js' --exclude='notification-worker.js' --exclude='wrangler.toml' --exclude='package.json' --exclude='package-lock.json' --exclude='*.test.mjs' --exclude='*.md' ./ dist/

      - name: Deploy same-origin Pages UI
        id: pages-deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name admissionhub --branch main

      - name: Verify live Pages Auth contract
        run: |
          set -eu
          body="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 30 'https://admissionhub.pages.dev/api/auth/v1/config')"
          node -e "const x=JSON.parse(process.argv[1]); const a=x?.auth; const g=a?.methods?.google; if(a?.version!=='firebase-canonical-auth-v3'||a?.uiContract!=='auth-premium-v6'||a?.onboarding?.version!=='premium-onboarding-v1'||a?.onboarding?.profileVersion!==1||a?.mode!=='firebase-canonical-multi-method'||a?.available!==true||a?.emailVerifiedRequired!==true||a?.methods?.emailPassword?.available!==true||a?.methods?.passwordReset?.available!==true||a?.methods?.profile?.available!==true||g?.available!==true||g?.availabilityCode!=='READY'||typeof g?.clientId!=='string'||!/^[A-Za-z0-9._-]+\\.apps\\.googleusercontent\\.com$/.test(g.clientId)||a?.methods?.passkey?.available!==true||a?.methods?.backup?.available!==true||a?.verificationEmail?.dailyCapacity!==1000||a?.verificationEmail?.statusCheckAvailable!==true||a?.registeredAccountLimit!=='unlimited') process.exit(1)" "$body"
          echo 'Firebase canonical Email + Password + Google + Passkey are live; generic backup remains unpublished.'

      - name: Verify Google browser origin without account access
        run: node auth-native/operations/verify-google-browser-origin.mjs

      - name: Roll back Worker when activation does not complete
        if: ${{ failure() && steps.worker-deploy.outcome == 'success' && env.PREVIOUS_WORKER_VERSION != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.35.0 rollback "$PREVIOUS_WORKER_VERSION" --name admission-gk --message "Automatic rollback after failed Firebase Auth activation" --yes
