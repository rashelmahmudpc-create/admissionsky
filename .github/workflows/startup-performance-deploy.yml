name: Startup performance preview and release
run-name: Startup performance ${{ inputs.mode }}
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [preview, production]
        default: preview
        required: true
      confirmation:
        type: string
        description: Type DEPLOY_STARTUP
        required: true
permissions:
  contents: write
concurrency:
  group: admission-hub-pages-deploy
  cancel-in-progress: false
jobs:
  startup:
    if: ${{ inputs.confirmation == 'DEPLOY_STARTUP' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply guarded frontend-only optimization
        run: |
          node scripts/optimize-startup.mjs
          node scripts/fix-startup-overlay.mjs
          node scripts/align-startup-guards.mjs
          node scripts/sky-entry-splash.mjs
          node --check account-access.js
          node scripts/sw-manifest.mjs
      - name: Startup, routing and auth protection regression tests
        run: node --test --test-concurrency=1 --test-skip-pattern='release guard literals still match the shipped shell' startup-fast.test.mjs startup-overlay.test.mjs startup-cache-release.test.mjs p19-perf-budget.test.mjs seo-routing.test.mjs native-auth-protection.test.mjs
      - name: Persist tested source on production release only
        if: ${{ inputs.mode == 'production' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html account-access.js sw.js native-auth-protection.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'perf: release fast startup, rendered-dashboard overlay and optional feature loading'
            git push origin HEAD:main || echo '::warning::source persist push failed; deploying tested build anyway'
          fi
      - name: Build sanitized frontend only
        run: |
          node scripts/pages-dist.mjs
          node scripts/build-welcome-pages.mjs dist
          test -s dist/index.html
          test -s dist/_worker.js
          node --check dist/account-access.js
      - name: Select preview or production branch
        id: target
        env:
          MODE: ${{ inputs.mode }}
        run: |
          if [ "$MODE" = production ]; then echo 'branch=main' >> "$GITHUB_OUTPUT"; else echo 'branch=perf-startup' >> "$GITHUB_OUTPUT"; fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Deploy admissionsky frontend only
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.35.0'
          command: pages deploy dist --project-name admissionsky --branch ${{ steps.target.outputs.branch }} --commit-hash ${{ steps.target.outputs.sha }}
      - name: Release summary
        run: |
          echo '### Frontend startup optimization' >> "$GITHUB_STEP_SUMMARY"
          echo 'Only admissionsky Pages assets were published. Backend Worker, database and secrets unchanged.' >> "$GITHUB_STEP_SUMMARY"
