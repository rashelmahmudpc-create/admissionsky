name: Email Gateway Cloudflare Names-Only Inventory

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type AUDIT_PROVIDER_LOCATIONS to inspect provider binding names and locations without values or changes
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: admission-hub-email-gateway-production
  cancel-in-progress: false

jobs:
  names-only-inventory:
    if: ${{ inputs.confirmation == 'AUDIT_PROVIDER_LOCATIONS' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: email-gateway-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Inventory provider binding names across Cloudflare Workers and Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node email-gateway/operations/audit-cloudflare-provider-locations.mjs
