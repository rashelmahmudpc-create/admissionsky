name: Publish Telegram OTP Verification

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type PUBLISH_TELEGRAM_OTP to deploy the START-to-OTP flow, bind the official bot webhook, and publish the verified Email-or-Telegram selector
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: admission-hub-email-gateway-production
  cancel-in-progress: false

jobs:
  prepare-canary:
    if: ${{ inputs.confirmation == 'PUBLISH_TELEGRAM_OTP' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: email-gateway-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify exact bundle, Auth contracts, and retired-account boundary
        run: |
          set -eu
          npm run check:worker-bundle
          npm run test:production-auth
          node account-retirement.test.mjs

      - name: Install browser only for the protected release audit
        run: npx playwright-core install --with-deps chromium

      - name: Audit zero-raster code-native Welcome, interactive Personal, and protected Auth flows
        run: npm run audit:premium-browser

      - name: Verify required Worker bindings by name only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKER_NAME: admission-gk
        run: node auth-native/operations/verify-telegram-bindings.mjs

      - name: Capture current Worker version for bounded rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          npx --yes wrangler@4.35.0 deployments status --name admission-gk --json > "${RUNNER_TEMP}/worker-deployment.json"
          PREVIOUS_WORKER_VERSION="$(node -e "const x=require(process.argv[1]); const rows=Array.isArray(x)?x:[x]; const versions=rows.flatMap(row=>Array.isArray(row?.versions)?row.versions:[]); const v=versions.find(v=>Number(v.percentage)===100); if(!v?.version_id) process.exit(1); process.stdout.write(v.version_id)" "${RUNNER_TEMP}/worker-deployment.json")"
          rm -f "${RUNNER_TEMP}/worker-deployment.json"
          echo "PREVIOUS_WORKER_VERSION=${PREVIOUS_WORKER_VERSION}" >> "$GITHUB_ENV"

      - name: Deploy public Telegram OTP verification
        id: worker-deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.35.0'
          command: deploy --config wrangler.toml

      - name: Verify Firebase binding remains installed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIREBASE_WORKER_BINDING_EXPECT: present
        run: node auth-native/operations/verify-worker-binding.mjs

      - name: Install a transient canary-activation proof
        id: ephemeral-secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          umask 077
          node -e "process.stdout.write(require('node:crypto').randomBytes(48).toString('base64url'))" > "${RUNNER_TEMP}/telegram-activation-proof"
          proof="$(cat "${RUNNER_TEMP}/telegram-activation-proof")"
          echo "::add-mask::$proof"
          printf '%s' "$proof" | npx --yes wrangler@4.35.0 secret put TELEGRAM_CANARY_ACTIVATION_SECRET --name admission-gk

      - name: Validate bot identity and configure the secret webhook
        id: telegram-activate
        run: |
          set -eu
          proof="$(cat "${RUNNER_TEMP}/telegram-activation-proof")"
          echo "::add-mask::$proof"
          ready=false
          for attempt in 1 2 3 4; do
            status="$(curl --silent --show-error --connect-timeout 10 --max-time 60 --output "${RUNNER_TEMP}/telegram-activation-response.json" --write-out '%{http_code}' \
              -X POST -H 'Content-Type: application/json' -H "X-AH-Telegram-Activation: $proof" --data '{}' \
              'https://admission-gk.admissionhub.workers.dev/api/auth/v1/telegram/canary/activate' || true)"
            if [ "$status" = '200' ] && node -e "const x=require(process.argv[1]); if(x?.ok!==true||x?.ready!==true||x?.identityReady!==true||x?.webhookReady!==true||x?.endpointAccepted!==true||typeof x?.webhookChanged!=='boolean'||Object.keys(x).some(k=>!['ok','ready','identityReady','webhookReady','endpointAccepted','webhookChanged'].includes(k))) process.exit(1)" "${RUNNER_TEMP}/telegram-activation-response.json" 2>/dev/null; then
              ready=true
              break
            fi
            [ "$attempt" = '4' ] || sleep 5
          done
          test "$ready" = 'true'
          changed="$(node -e "const x=require(process.argv[1]); process.stdout.write(String(x.webhookChanged))" "${RUNNER_TEMP}/telegram-activation-response.json")"
          echo "webhook_changed=$changed" >> "$GITHUB_OUTPUT"
          echo 'Telegram OTP canary bot identity and secret webhook are ready; no token, username, user ID, chat ID, OTP, or URL was printed.'

      - name: Recheck Firebase Email and Password session lifecycle
        env:
          AUTH_LIVE_BASE: https://admission-gk.admissionhub.workers.dev
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
        run: node auth-native/operations/live-mailbox-e2e.mjs

      - name: Build sanitized Pages bundle
        run: |
          set -eu
          rm -rf dist
          mkdir -p dist
          rsync -a --exclude='.git' --exclude='node_modules' --exclude='docs' --exclude='AGENT_RESUME' --exclude='ai-proxy' --exclude='auth' --exclude='auth-native' --exclude='email-gateway' --exclude='uploads' --exclude='.github' --exclude='gk-agent-worker.js' --exclude='public-worker.js' --exclude='ai-agent.js' --exclude='worker-bundle.mjs' --exclude='voice-worker.js' --exclude='notification-worker.js' --exclude='wrangler.toml' --exclude='package.json' --exclude='package-lock.json' --exclude='*.test.mjs' --exclude='*.md' ./ dist/
          test ! -e dist/onboarding-welcome-hero.webp
          test ! -e dist/onboarding-personal-hero.webp
          ! grep -Eiq '<(img|picture|source|canvas|video|object|embed)([[:space:]>])' dist/account-access.js
          ! grep -Eiq 'background(-image)?[[:space:]]*:[^;]*url\(' dist/account-access.css

      - name: Deploy same-origin public verification UI
        id: pages-deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name admissionhub --branch main

      - name: Verify public selector and protected generic-backup isolation
        run: |
          set -eu
          verify_dir="${RUNNER_TEMP}/public-release-verification"
          rm -rf "$verify_dir"
          mkdir -p "$verify_dir"
          fetch_public() {
            curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
              -H 'Cache-Control: no-cache' --output "$1" "$2"
          }

          public_ready=false
          for attempt in 1 2 3 4 5 6 7 8; do

            fetch_public "$verify_dir/index.html" "https://admissionhub.pages.dev/?release=v335-lock-20261016"
            if grep -Fq 'account-access.js?v=20261021-turnstile-v1' "$verify_dir/index.html" \
              && grep -Fq 'ai-agent-chat.js?v=agent-f1-ui-skyv13' "$verify_dir/index.html"; then
              public_ready=true
              break
            fi
            [ "$attempt" = '8' ] || sleep 5
          done
          test "$public_ready" = 'true'
          echo 'verify: public shell settled on the new release'

          config_ready=false
          for attempt in 1 2 3; do
            fetch_public "$verify_dir/public-config.json" 'https://admissionhub.pages.dev/api/auth/v1/config'
            fetch_public "$verify_dir/canary-config.json" 'https://admissionhub.pages.dev/api/auth/v1/config?telegramCanary=1'
            if node -e "const x=require(process.argv[1]); const a=x?.auth; const m=a?.methods; const t=m?.telegramVerification; if(a?.available!==true||a?.uiContract!=='auth-premium-v6'||a?.onboarding?.version!=='premium-onboarding-v1'||a?.emailVerifiedRequired!==false||m?.emailPassword?.available!==true||m?.passwordReset?.available!==true||m?.profile?.available!==true||m?.google?.available!==true||m?.google?.availabilityCode!=='READY'||m?.passkey?.available!==true||m?.passkey?.enrollmentAvailable!==true||m?.backup?.available!==true||m?.backup?.availabilityCode!=='READY'||m?.backup?.providerNamesExposed!==false||t?.available!==true||t?.availabilityCode!=='READY'||t?.optional!==true||t?.codeLength!==6||t?.expiresInSeconds!==300||t?.maxAttempts!==5||t?.verifiesEmailOwnership!==false||t?.canonicalIdentity!=='firebase-uid') process.exit(1)" "$verify_dir/public-config.json" \
              && node -e "const x=require(process.argv[1]); const a=x?.auth; const b=a?.methods?.backup; const t=a?.methods?.telegramVerification; if(a?.accountVerificationRequired!==true||a?.emailVerifiedRequired!==false||b?.available!==true||b?.availabilityCode!=='READY'||b?.genericFlow!==true||b?.providerNamesExposed!==false||b?.contactInput!=='none'||/telegram|bot|token|username|chat/i.test(JSON.stringify(b))||t?.available!==true||t?.availabilityCode!=='READY'||t?.optional!==true||t?.codeLength!==6||t?.expiresInSeconds!==300||t?.maxAttempts!==5||t?.verifiesEmailOwnership!==false||t?.canonicalIdentity!=='firebase-uid') process.exit(1)" "$verify_dir/canary-config.json"; then
              config_ready=true
              break
            fi
            [ "$attempt" = '3' ] || sleep 5
          done
          test "$config_ready" = 'true'
          echo 'verify: auth config contracts READY'

          grep -Fq 'institutions-bd.js?v=bd-institutions-v2' "$verify_dir/index.html"
          grep -Fq 'account-access.css?v=20261018-allowlist-v1' "$verify_dir/index.html"
          grep -Fq 'dashboard-v2.css?v=dash2f13-theme' "$verify_dir/index.html"
          grep -Fq 'dashboard-v2.js?v=dash2f18-chrome' "$verify_dir/index.html"
          grep -Fq 'ai-agent-chat.js?v=agent-f1-ui-skyv13' "$verify_dir/index.html"
          grep -Fq 'phase12-ui.js?v=nav-resume-router-v11-main-ai' "$verify_dir/index.html"

          grep -Fq "const expectedSwVersion = 'v335-lock-20261016'" "$verify_dir/index.html"
          verify_retired_media_absent() {
            asset="$1"
            status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
              -H 'Cache-Control: no-cache' --dump-header "$verify_dir/${asset}.headers" \
              --output "$verify_dir/${asset}.body" --write-out '%{http_code}' \

              "https://admissionhub.pages.dev/${asset}?retired=v335-lock-20261016")
            case "$status" in
              404|410) ;;
              200)
                ! grep -Eiq '^content-type:[[:space:]]*image/' "$verify_dir/${asset}.headers"
                node -e "const b=require('node:fs').readFileSync(process.argv[1]); if(b.subarray(0,4).toString()==='RIFF'&&b.subarray(8,12).toString()==='WEBP') process.exit(1)" "$verify_dir/${asset}.body"
                grep -Fq 'account-access.js?v=20261021-turnstile-v1' "$verify_dir/${asset}.body"
                ;;
              *) exit 1 ;;
            esac
          }
          verify_retired_media_absent 'onboarding-welcome-hero.webp'
          verify_retired_media_absent 'onboarding-personal-hero.webp'

          fetch_public "$verify_dir/account-access.js" 'https://admissionhub.pages.dev/account-access.js?v=20261021-turnstile-v1'
          fetch_public "$verify_dir/account-access.css" 'https://admissionhub.pages.dev/account-access.css?v=20261018-allowlist-v1'
          fetch_public "$verify_dir/dashboard-v2.js" 'https://admissionhub.pages.dev/dashboard-v2.js?v=dash2f18-chrome'
          fetch_public "$verify_dir/ai-agent-chat.js" 'https://admissionhub.pages.dev/ai-agent-chat.js?v=agent-f1-ui-skyv13'
          fetch_public "$verify_dir/phase12-ui.js" 'https://admissionhub.pages.dev/phase12-ui.js?v=nav-resume-router-v11-main-ai'

          fetch_public "$verify_dir/sw.js" 'https://admissionhub.pages.dev/sw.js?v=v364-sky-goal'

          grep -Fq "'X-AH-Auth-UI': 'auth-premium-v6'" "$verify_dir/account-access.js"
          grep -Fq 'data-visual-contract="code-native-page-system-v1"' "$verify_dir/account-access.js"
          grep -Fq 'data-page-contract="code-native-welcome-v1"' "$verify_dir/account-access.js"
          grep -Fq 'data-personal-visual-contract="interactive-native-personal-v1"' "$verify_dir/account-access.js"
          grep -Fq 'data-dob-contract="premium-dropdown-dob-v2"' "$verify_dir/account-access.js"
          grep -Fq 'data-media-contract="zero-raster-entry-v1"' "$verify_dir/account-access.js"
          grep -Fq 'data-native-welcome-visual="journey-console-v1"' "$verify_dir/account-access.js"
          grep -Fq 'class="ah-dob-select"' "$verify_dir/account-access.js"
          grep -Fq 'setupDobDropdowns' "$verify_dir/account-access.js"
          ! grep -Fq 'onboarding-welcome-hero.webp' "$verify_dir/account-access.js"
          ! grep -Fq 'onboarding-personal-hero.webp' "$verify_dir/account-access.js"
          ! grep -Eiq '<(img|picture|source|canvas|video|object|embed)([[:space:]>])' "$verify_dir/account-access.js"
          grep -Fq 'আপনার লক্ষ্যের পথে' "$verify_dir/account-access.js"
          ! grep -Fq 'ah-3d-student' "$verify_dir/account-access.js"
          grep -Fq 'id="ah-dob-day"' "$verify_dir/account-access.js"
          ! grep -Fq 'LIVE PROFILE' "$verify_dir/account-access.js"
          ! grep -Fq 'input-bound-profile-v1' "$verify_dir/account-access.js"
          ! grep -Fq 'data-signup-panel="dob"' "$verify_dir/account-access.js"
          grep -Fq 'data-view="email-intro"' "$verify_dir/account-access.js"
          grep -Fq 'data-view="telegram-intro"' "$verify_dir/account-access.js"
          grep -Fq 'data-otp-digit="5"' "$verify_dir/account-access.js"
          grep -Fq 'Email OTP নয়' "$verify_dir/account-access.js"
          grep -Fq 'Code-native Onboarding v1' "$verify_dir/account-access.css"
          grep -Fq 'Welcome — modular journey console' "$verify_dir/account-access.css"
          grep -Fq 'Personal — real input-bound profile preview' "$verify_dir/account-access.css"
          grep -Fq '.ah-journey-console{' "$verify_dir/account-access.css"
          grep -Fq 'ah-education-panel' "$verify_dir/account-access.js"
          grep -Fq 'ah-institution-option' "$verify_dir/account-access.js"
          grep -Fq 'data-role="education-help"' "$verify_dir/account-access.js"
          grep -Fq 'Education step (school / college) — owner reference design' "$verify_dir/account-access.css"
          grep -Fq '.ah-institution-option{' "$verify_dir/account-access.css"
          grep -Fq 'ah-created-card' "$verify_dir/account-access.js"
          grep -Fq 'data-role="created-school"' "$verify_dir/account-access.js"
          grep -Fq 'renderCreatedSummary' "$verify_dir/account-access.js"
          grep -Fq 'Account Created screen — premium success screen' "$verify_dir/account-access.css"
          grep -Fq '.ah-created-rows{' "$verify_dir/account-access.css"
          grep -Fq 'data-login-contract="reference-login-v1"' "$verify_dir/account-access.js"
          grep -Fq 'data-verify-contract="reference-verify-v1"' "$verify_dir/account-access.js"
          grep -Fq 'data-help-toggle="ah-verify-help-card"' "$verify_dir/account-access.js"
          grep -Fq 'Auth reference screens (v254)' "$verify_dir/account-access.css"
          grep -Fq '.ah-method-check{' "$verify_dir/account-access.css"
          grep -Fq '.ah-tg-orb{' "$verify_dir/account-access.css"
          ! grep -Fq 'ah-search-option' "$verify_dir/account-access.css"
          grep -Fq 'min-height:100svh' "$verify_dir/account-access.css"
          grep -Fq 'guaranteed scroll room on phones' "$verify_dir/account-access.css"
          grep -Fq '.ah-dob-select{' "$verify_dir/account-access.css"
          ! grep -Fq '.ah-3d-student' "$verify_dir/account-access.css"
          ! grep -Fq '.ah-live-profile{' "$verify_dir/account-access.css"
          ! grep -Eiq 'background(-image)?[[:space:]]*:[^;]*url\(' "$verify_dir/account-access.css"
          ! grep -Fq 'data-role="guide' "$verify_dir/account-access.js"
          ! grep -Fq '/api/ai/chat' "$verify_dir/account-access.js"
          ! grep -Fq '.ah-guide' "$verify_dir/account-access.css"
          ! grep -Fq 'ah-account-overlay' "$verify_dir/account-access.js"
          ! grep -Fq 'ah-account-modal' "$verify_dir/account-access.js"
          ! grep -Fq 'role="dialog"' "$verify_dir/account-access.js"
          ! grep -Fq 'data-dashboard-contract="reference-guest-v2"' "$verify_dir/dashboard-v2.js"
          ! grep -Fq 'data-guest-nav="reference-guest-v2"' "$verify_dir/phase12-ui.js"
          grep -Fq "{key:'ai', icon:'🤖', label:'AI'}" "$verify_dir/index.html"
          grep -Fq "if(p==='ai'){ if(window.renderAiAgentPage)" "$verify_dir/index.html"
          grep -Fq '<span>AI</span>' "$verify_dir/dashboard-v2.js"
          grep -Fq 'window.renderAiAgentPage = render' "$verify_dir/ai-agent-chat.js"

          grep -Fq "const BUILD_ID = 'v364-sky-goal'" "$verify_dir/sw.js"
          ! grep -Fq 'onboarding-welcome-hero.webp' "$verify_dir/sw.js"
          ! grep -Fq 'onboarding-personal-hero.webp' "$verify_dir/sw.js"
          grep -Fq './ai-agent-chat.js?v=agent-f1-ui-skyv13' "$verify_dir/sw.js"
          rm -rf "$verify_dir"
          echo 'Zero-raster code-native Welcome and input-bound Personal preview, truthful Email/Telegram verification, ordinary Guest route, signup-only Assistant isolation, restored main-app AI, and cache-safe assets are READY; generic backup and pre-verification Passkey remain protected.'

      - name: Verify Google browser origin remains accepted
        run: node auth-native/operations/verify-google-browser-origin.mjs

      - name: Remove configured webhook after an unsuccessful canary setup
        if: ${{ failure() && steps.telegram-activate.outputs.webhook_changed == 'true' && steps.ephemeral-secret.outcome == 'success' }}
        continue-on-error: true
        run: |
          proof="$(cat "${RUNNER_TEMP}/telegram-activation-proof" 2>/dev/null || true)"
          test -n "$proof" || exit 0
          echo "::add-mask::$proof"
          curl --silent --show-error --connect-timeout 10 --max-time 45 --output /dev/null \
            -X POST -H 'Content-Type: application/json' -H "X-AH-Telegram-Activation: $proof" --data '{}' \
            'https://admission-gk.admissionhub.workers.dev/api/auth/v1/telegram/canary/deactivate' || true

      - name: Remove transient canary-activation proof
        if: ${{ always() && steps.ephemeral-secret.outcome == 'success' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.35.0 secret delete TELEGRAM_CANARY_ACTIVATION_SECRET --name admission-gk

      - name: Remove ephemeral activation files
        if: ${{ always() }}
        run: rm -f -- "${RUNNER_TEMP}/telegram-activation-proof" "${RUNNER_TEMP}/telegram-activation-response.json"

      - name: Verify transient activation route is closed
        if: ${{ success() }}
        run: |
          status="$(curl --silent --show-error --connect-timeout 10 --max-time 30 --output /dev/null --write-out '%{http_code}' \
            -X POST -H 'Content-Type: application/json' --data '{}' \
            'https://admission-gk.admissionhub.workers.dev/api/auth/v1/telegram/canary/activate')"
          test "$status" = '403'
          echo 'Transient Telegram activation route is closed.'

      - name: Roll back Worker when canary preparation does not complete
        if: ${{ failure() && steps.worker-deploy.outcome == 'success' && env.PREVIOUS_WORKER_VERSION != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.35.0 rollback "$PREVIOUS_WORKER_VERSION" --name admission-gk --message "Automatic rollback after failed Telegram canary preparation" --yes
