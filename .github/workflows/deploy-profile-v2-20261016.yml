name: Deploy Profile V2 2026-10-16

# Publishes the profile-v2 mount and its generated page. Pages only: the Worker,
# database and secrets are untouched.
#
# profile-v2.html is a GENERATED file (scripts/build-profile-v2.mjs). The build
# step below re-runs the generator against the source design and fails if the
# committed page differs, so a stale page can never be published silently.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-profile-v2-20261016.yml'
      - 'profile-v2.html'
      - 'profile-v2-mount.js'
      - 'scripts/build-profile-v2.mjs'
      - 'design/profile-v2-source.html'
      - 'index.html'
      - 'sw.js'
      - '_worker.js'
      - '_headers'
      - '_redirects'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admission-hub-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Confirm the mount and its page are present and wired
        run: |
          set -eu
          node --check profile-v2-mount.js
          grep -q 'profile-v2-mount.js?v=profile-v2-' index.html
          grep -q 'profile-v2.html?v=profile-v2-' sw.js
          grep -q 'iframe class="pv2-frame"' profile-v2-mount.js
          npm run check:sw-manifest
      - name: Regenerate the page and prove the committed one is current
        run: |
          set -eu
          cp profile-v2.html /tmp/committed.html
          node scripts/build-profile-v2.mjs
          cmp /tmp/committed.html profile-v2.html || {
            echo 'profile-v2.html is stale; run: node scripts/build-profile-v2.mjs'; exit 1; }
      - name: Prove every profile field still saves
        run: |
          set -eu
          # The edit-all form sends the whole profile in one patch, and the
          # backend rejects the ENTIRE patch on one bad field. An empty mobile
          # is the field that used to do exactly that, so this gate is what
          # keeps a save regression from reaching students.
          node --test profile-v2-backend.test.mjs profile-v2-core.test.mjs \
            profile-v2-mount.test.mjs profile-sheets.test.mjs profile-crop-flow.test.mjs \
            profile-v2-audit.test.mjs
      - name: Build sanitized frontend bundle
        run: |
          set -eu
          rm -rf dist && mkdir -p dist
          rsync -a --exclude='.git' --exclude='node_modules' --exclude='dist' --exclude='docs' --exclude='AGENT_RESUME' --exclude='ai-proxy' --exclude='auth' --exclude='auth-native' --exclude='email-gateway' --exclude='apps-script' --exclude='uploads' --exclude='.github' --exclude='gk-agent-worker.js' --exclude='public-worker.js' --exclude='ai-agent.js' --exclude='worker-bundle.mjs' --exclude='voice-worker.js' --exclude='notification-worker.js' --exclude='fcm-notification.mjs' --exclude='wrangler.toml' --exclude='package.json' --exclude='package-lock.json' --exclude='*.test.mjs' --exclude='*.md' ./ dist/
          GITHUB_SHA="$(git rev-parse HEAD)" node scripts/build-welcome-pages.mjs dist
          test -s dist/index.html
          test -s dist/profile-v2.html
          test -s dist/profile-v2-mount.js
          grep -q 'profile-v2-mount.js' dist/index.html
          grep -q 'id="shell"' dist/profile-v2.html
          # The design must still be the owner's: no demo identity may ship.
          ! grep -q 'Zayan Rashel' dist/profile-v2.html
      - name: Deploy admissionsky
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.35.0 pages deploy dist --project-name admissionsky --branch main --commit-hash "$(git rev-parse HEAD)" --commit-dirty=true
      - name: Deploy admissionhub (same bytes)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.35.0 pages deploy dist --project-name admissionhub --branch main --commit-hash "$(git rev-parse HEAD)" --commit-dirty=true
      - name: Verify live
        run: |
          set -eu
          sleep 25
          # Pages answers .html with a 308 to the clean URL, so follow redirects
          # and assert the document itself, not the redirect.
          curl -fsSL -H 'Cache-Control: no-cache' 'https://admissionsky.pages.dev/' | grep -Fq 'profile-v2-mount.js'
          curl -fsSL -H 'Cache-Control: no-cache' 'https://admissionsky.pages.dev/profile-v2-mount.js' | grep -Fq 'pv2-frame'
          curl -fsSL -H 'Cache-Control: no-cache' 'https://admissionsky.pages.dev/profile-v2.html' | grep -Fq 'id="shell"'
          # The SEO allowlist in _worker.js must let the frame document through.
          curl -fsSL -H 'Cache-Control: no-cache' 'https://admissionsky.pages.dev/profile-v2' | grep -Fq 'id="shell"'
