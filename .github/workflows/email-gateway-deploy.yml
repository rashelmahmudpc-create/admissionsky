name: Email Gateway Worker Deploy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY to run the protected Worker deployment
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: admission-hub-email-gateway-production
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    if: ${{ inputs.confirmation == 'DEPLOY' }}
    runs-on: ubuntu-latest
    environment: email-gateway-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify Email Gateway and Firebase Auth
        run: |
          npm run test:email
          npm run test:native-auth
      # The project key is the public Firebase Web API key of admissionsky-997d2
      # (project 916950643726), not a secret in the confidential sense. It is
      # inlined as a fallback for the same reason the app deploy inlines it: the
      # repository secret is not present, and a missing secret used to fail this
      # gate with API_KEY_MISSING before anything was deployed. A repository
      # secret, if one is ever added, still wins.
      - name: Validate Firebase project and authorized Pages domain
        env:
          FIREBASE_SECRET_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
        run: |
          set -eu
          KEY="${FIREBASE_SECRET_KEY:-AIzaSyCMYPy-qANPN1pPPI1B957wwKezmotK_NI}"
          test "${#KEY}" -eq 39
          FIREBASE_WEB_API_KEY="$KEY" node auth-native/operations/verify-firebase-config.mjs
      - name: Verify exact Worker bundle
        run: npm run check:worker-bundle
      - name: Inspect existing Worker secret binding names
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKER_NAME: admission-gk
        run: |
          node email-gateway/operations/inventory-cloudflare-bindings.mjs
          node auth-native/operations/verify-worker-binding.mjs
      - name: Deploy protected Email Gateway Worker
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.toml
      - name: Apply the AgentMail sender display name
        env:
          AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
          AGENTMAIL_INBOX_ID: ${{ secrets.AGENTMAIL_INBOX_ID }}
          AGENTMAIL_INBOX_DISPLAY_NAME: AdmissionSky
        run: |
          set -eu
          if [ -z "${AGENTMAIL_API_KEY:-}" ] || [ -z "${AGENTMAIL_INBOX_ID:-}" ]; then
            echo "::notice title=AgentMail display name skipped::AgentMail is not configured; the otp-e sender keeps its inbox default."
            exit 0
          fi
          node auth-native/operations/set-agentmail-display-name.mjs
      - name: Verify public health and hidden internal route
        run: |
          set -u
          for attempt in 1 2 3 4 5 6; do
            nonce="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"
            public_status="$(curl --silent --show-error --connect-timeout 10 --max-time 20 --output /dev/null --write-out '%{http_code}' "https://admission-gk.admissionhub.workers.dev/pub/health?deployment_check=${nonce}" || true)"
            internal_status="$(curl --silent --show-error --connect-timeout 10 --max-time 20 --output /dev/null --write-out '%{http_code}' "https://admission-gk.admissionhub.workers.dev/internal/email/health?deployment_check=${nonce}" || true)"
            if [ "$public_status" = "200" ] && { [ "$internal_status" = "403" ] || [ "$internal_status" = "404" ]; }; then
              echo "Public health is ready and the unsigned internal route is not publicly accessible."
              exit 0
            fi
            [ "$attempt" = "6" ] || sleep 5
          done
          echo "::error title=Worker post-deploy health verification failed::Expected public 200 and unsigned internal 403 or 404 after bounded retries."
          exit 1
      - name: Telegram completion notification
        if: ${{ success() && vars.TELEGRAM_NOTIFICATIONS_ENABLED == 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADMISSION_HUB_NOTIFICATION_STATUS: DEPLOYED
          ADMISSION_HUB_NOTIFICATION_SUMMARY: Admission Hub Email Gateway Worker deployment completed and verified.
          ADMISSION_HUB_NOTIFICATION_DETAILS: Email suite passed|Worker bundle exact-match passed|Protected deployment completed
        run: npm run notify:telegram
