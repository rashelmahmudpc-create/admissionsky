name: Account Retirement Guard
permissions:
  contents: read
on:
  push:
    branches: [main]
    paths:
      - '_worker.js'
      - 'account-access.js'
      - 'ai-agent-chat.js'
      - 'cloud-content-sync.js'
      - 'experience-studio-*.js'
      - 'gk-agent-worker.js'
      - 'index.html'
      - 'institutions-bd.js'
      - 'public-worker.js'
      - 'worker-bundle.mjs'
      - 'auth-native/**'
      - 'account-retirement.test.mjs'
      - '.github/workflows/account-retirement-guard.yml'
  pull_request:
    paths:
      - '_worker.js'
      - 'account-access.js'
      - 'ai-agent-chat.js'
      - 'cloud-content-sync.js'
      - 'experience-studio-*.js'
      - 'gk-agent-worker.js'
      - 'index.html'
      - 'institutions-bd.js'
      - 'public-worker.js'
      - 'worker-bundle.mjs'
      - 'auth-native/**'
      - 'account-retirement.test.mjs'
      - '.github/workflows/account-retirement-guard.yml'
  workflow_dispatch:
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Verify retired account system stays absent and core app stays intact
        run: node account-retirement.test.mjs
