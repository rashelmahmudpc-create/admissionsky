name: Account Retirement Guard
permissions:
  contents: read
on:
  push:
    branches: [main]
    paths:
      - '_worker.js'
      - 'account-access.js'
      - 'ai-agent-chat.js'
      - 'cloud-content-sync.js'
      - 'experience-studio-*.js'
      - 'gk-agent-worker.js'
      - 'index.html'
      - 'institutions-bd.js'
      - 'public-worker.js'
      - 'worker-bundle.mjs'
      - 'auth-native/**'
      - 'account-retirement.test.mjs'
      - '.github/workflows/account-retirement-guard.yml'
  pull_request:
    paths:
      - '_worker.js'
      - 'account-access.js'
      - 'ai-agent-chat.js'
      - 'cloud-content-sync.js'
      - 'experience-studio-*.js'
      - 'gk-agent-worker.js'
      - 'index.html'
      - 'institutions-bd.js'
      - 'public-worker.js'
      - 'worker-bundle.mjs'
      - 'auth-native/**'
      - 'account-retirement.test.mjs'
      - '.github/workflows/account-retirement-guard.yml'
  workflow_dispatch:
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: Verify retired account system stays absent and core app stays intact
        run: node account-retirement.test.mjs
