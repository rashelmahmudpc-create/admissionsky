name: App Shell Guard
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'honesty-guard.test.mjs'
      - 'i18n-guard.test.mjs'
      - 'intro.test.mjs'
      - 'crash-pill.test.mjs'
      - 'idb-hardening.test.mjs'
      - 'startup-ai-regression.test.mjs'
      - 'academic-catalog.test.mjs'
      - 'files-storage.test.mjs'
      - 'phase23-core.test.mjs'
      - 'profile-crop-flow.test.mjs'
      - 'profile-sheets.test.mjs'
      - 'profile-v2-core.test.mjs'
      - 'p08-*.test.mjs'
      - 'p10-*.test.mjs'
      - 'p11-*.test.mjs'
      - 'p13-*.test.mjs'
      - 'p16-*.test.mjs'
      - 'p18-*.test.mjs'
      - 'p20-*.test.mjs'
      - 'p21-*.test.mjs'
      - 'ai-agent.js'
      - 'ai-key-sync.mjs'
      - 'ai-key-sync.test.mjs'
      - 'sky-ai/**'
      - 'index.html'
      - 'sw.js'
      - '.github/workflows/shell-guard.yml'
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify app shell, dashboard and profile guards
        run: npm run test:shell-guards
