name: App Shell Guard
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'honesty-guard.test.mjs'
      - 'i18n-guard.test.mjs'
      - 'intro.test.mjs'
      - 'crash-pill.test.mjs'
      - 'idb-hardening.test.mjs'
      - 'startup-ai-regression.test.mjs'
      - 'academic-catalog.test.mjs'
      - 'files-storage.test.mjs'
      - 'phase23-core.test.mjs'
      - 'profile-crop-flow.test.mjs'
      - 'profile-sheets.test.mjs'
      - 'profile-v2-core.test.mjs'
      - 'repo-cleanliness.test.mjs'
      - 'docs/sky-blueprint/F0.8-repo-cleanliness.md'
      - 'p08-*.test.mjs'
      - 'p10-*.test.mjs'
      - 'p11-*.test.mjs'
      - 'p13-*.test.mjs'
      - 'p16-*.test.mjs'
      - 'p18-*.test.mjs'
      - 'p20-*.test.mjs'
      - 'p21-*.test.mjs'
      - 'ai-agent.js'
      - 'ai-key-sync.mjs'
      - 'ai-key-sync.test.mjs'
      - 'sky-ai/**'
      - 'index.html'
      - 'sw.js'
      - '.github/workflows/shell-guard.yml'
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'honesty-guard.test.mjs'
      - 'i18n-guard.test.mjs'
      - 'intro.test.mjs'
      - 'crash-pill.test.mjs'
      - 'idb-hardening.test.mjs'
      - 'startup-ai-regression.test.mjs'
      - 'academic-catalog.test.mjs'
      - 'files-storage.test.mjs'
      - 'phase23-core.test.mjs'
      - 'profile-crop-flow.test.mjs'
      - 'profile-sheets.test.mjs'
      - 'profile-v2-core.test.mjs'
      - 'repo-cleanliness.test.mjs'
      - 'docs/sky-blueprint/F0.8-repo-cleanliness.md'
      - 'p08-*.test.mjs'
      - 'p10-*.test.mjs'
      - 'p11-*.test.mjs'
      - 'p13-*.test.mjs'
      - 'p16-*.test.mjs'
      - 'p18-*.test.mjs'
      - 'p20-*.test.mjs'
      - 'p21-*.test.mjs'
      - 'ai-agent.js'
      - 'ai-key-sync.mjs'
      - 'ai-key-sync.test.mjs'
      - 'sky-ai/**'
      - 'index.html'
      - 'sw.js'
      - '.github/workflows/shell-guard.yml'
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify app shell, dashboard and profile guards
        run: npm run test:shell-guards
