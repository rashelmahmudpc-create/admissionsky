name: Email Gateway Guard
permissions:
  contents: read
on:
  push:
    branches: [main]
    paths:
      # The notifier suite lives outside the email-gateway prefix, so the
      # partial glob below could not start the workflow that runs it.
      - 'telegram-notifier.test.mjs'
      - 'email-gateway/**'
      - 'email-gateway*.test.mjs'
      - 'auth/**'
      - 'gk-agent-worker.js'
      - 'worker-bundle.mjs'
      - '_worker.js'
      - 'wrangler.toml'
      - 'package.json'
      - '.github/workflows/email-gateway-*.yml'
      - '.github/CODEOWNERS'
      - 'docs/email-gateway/**'
      - 'docs/EMAIL-GATEWAY-*'
  pull_request:
    paths:
      # The notifier suite lives outside the email-gateway prefix, so the
      # partial glob below could not start the workflow that runs it.
      - 'telegram-notifier.test.mjs'
      - 'email-gateway/**'
      - 'email-gateway*.test.mjs'
      - 'auth/**'
      - 'gk-agent-worker.js'
      - 'worker-bundle.mjs'
      - '_worker.js'
      - 'wrangler.toml'
      - 'package.json'
      - '.github/workflows/email-gateway-*.yml'
      - '.github/CODEOWNERS'
      - 'docs/email-gateway/**'
      - 'docs/EMAIL-GATEWAY-*'
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: Verify provider contracts, security, failover, chaos and no-send load
        run: npm run test:email
      - name: Verify Auth Foundation remains isolated
        run: npm run test:auth
      - name: Verify retired account system remains absent
        run: node account-retirement.test.mjs
      - name: Verify checked Worker bundle exactly matches protected sources
        run: npm run check:worker-bundle
