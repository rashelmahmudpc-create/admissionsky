name: Email Gateway Guard
permissions:
  contents: read
on:
  push:
    branches: [main]
    paths:
      - 'email-gateway/**'
      - 'email-gateway*.test.mjs'
      - 'auth/**'
      - 'gk-agent-worker.js'
      - 'worker-bundle.mjs'
      - '_worker.js'
      - 'wrangler.toml'
      - 'package.json'
      - '.github/workflows/email-gateway-*.yml'
      - '.github/CODEOWNERS'
      - 'docs/email-gateway/**'
      - 'docs/EMAIL-GATEWAY-*'
  pull_request:
    paths:
      - 'email-gateway/**'
      - 'email-gateway*.test.mjs'
      - 'auth/**'
      - 'gk-agent-worker.js'
      - 'worker-bundle.mjs'
      - '_worker.js'
      - 'wrangler.toml'
      - 'package.json'
      - '.github/workflows/email-gateway-*.yml'
      - '.github/CODEOWNERS'
      - 'docs/email-gateway/**'
      - 'docs/EMAIL-GATEWAY-*'
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Verify provider contracts, security, failover, chaos and no-send load
        run: npm run test:email
      - name: Verify Auth Foundation remains isolated
        run: npm run test:auth
      - name: Verify retired account system remains absent
        run: node account-retirement.test.mjs
      - name: Verify checked Worker bundle exactly matches protected sources
        run: npm run check:worker-bundle
