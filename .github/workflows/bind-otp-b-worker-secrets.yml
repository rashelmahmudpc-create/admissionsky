name: Bind Gmail otp-b Worker secrets (manual, owner-authorised)

# Owner-authorised 2026-10-14: lock the Gmail/Apps Script backup mailer into the
# `admission-gk` Worker so otp-b actually delivers (+100 OTP/day, free).
# The values come from ENCRYPTED repo secrets (OTP_B_PROVIDER_APPS_SCRIPT_URL,
# OTP_B_PROVIDER_SHARED_SECRET) and are never printed. No code change, no
# redeploy — only the two Worker secret bindings are written.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type BIND-OTP-B to write the Gmail otp-b Worker secrets
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: admission-hub-email-gateway-production
  cancel-in-progress: false

jobs:
  bind:
    if: ${{ inputs.confirmation == 'BIND-OTP-B' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Write the two otp-b Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OTP_B_PROVIDER_APPS_SCRIPT_URL: ${{ secrets.OTP_B_PROVIDER_APPS_SCRIPT_URL }}
          OTP_B_PROVIDER_SHARED_SECRET: ${{ secrets.OTP_B_PROVIDER_SHARED_SECRET }}
        run: |
          set -eu
          test -n "$OTP_B_PROVIDER_APPS_SCRIPT_URL"
          test -n "$OTP_B_PROVIDER_SHARED_SECRET"
          printf '%s' "$OTP_B_PROVIDER_APPS_SCRIPT_URL" | npx --yes wrangler@4.35.0 secret put OTP_B_PROVIDER_APPS_SCRIPT_URL --name admission-gk
          printf '%s' "$OTP_B_PROVIDER_SHARED_SECRET" | npx --yes wrangler@4.35.0 secret put OTP_B_PROVIDER_SHARED_SECRET --name admission-gk

      - name: Confirm both bindings exist (names only, no values)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          npx --yes wrangler@4.35.0 secret list --name admission-gk --format json > "${RUNNER_TEMP}/bindings.json"
          node -e '
            const names = JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP + "/bindings.json","utf8")).map(r => r.name);
            for (const n of ["OTP_B_PROVIDER_APPS_SCRIPT_URL","OTP_B_PROVIDER_SHARED_SECRET"]) {
              if (!names.includes(n)) { console.error("MISSING", n); process.exit(1); }
              console.log("present:", n);
            }
          '

      - name: Live-verify otp-b through the real provider code
        env:
          OTP_B_PROVIDER_APPS_SCRIPT_URL: ${{ secrets.OTP_B_PROVIDER_APPS_SCRIPT_URL }}
          OTP_B_PROVIDER_SHARED_SECRET: ${{ secrets.OTP_B_PROVIDER_SHARED_SECRET }}
        run: |
          set -eu
          sleep 5
          node scripts/verify-otp-b.mjs "$OTP_B_PROVIDER_APPS_SCRIPT_URL" "$OTP_B_PROVIDER_SHARED_SECRET"
