name: Appwrite Keep-Alive
# Appwrite Cloud free plan pauses a project after ~7 days with no activity.
# This pings the otp-i project (fra region) twice a week with a guest-scope
# request (GET /v1/locale) so it always counts as active. No secret needed:
# the project id is already public (see APPWRITE_PUBLIC_DEFAULTS in
# auth-native/verification/providers.mjs).
on:
  schedule:
    - cron: '17 3 * * 1,4'   # Monday & Thursday 03:17 UTC
  workflow_dispatch:
permissions: {}
concurrency:
  group: appwrite-keepalive
  cancel-in-progress: true
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APPWRITE_ENDPOINT: https://fra.cloud.appwrite.io/v1
      APPWRITE_PROJECT_ID: 6ad1e9280025bf4464ee
    steps:
      - name: Ping Appwrite project
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' --max-time 20 \
              -H "X-Appwrite-Project: ${APPWRITE_PROJECT_ID}" \
              -H 'X-Appwrite-Response-Format: 1.6.0' \
              "${APPWRITE_ENDPOINT}/locale" || echo 000)
            echo "attempt ${attempt}: HTTP ${code}"
            if [ "$code" = "200" ]; then
              echo "Appwrite project ${APPWRITE_PROJECT_ID} is active."
              exit 0
            fi
            sleep 20
          done
          echo '::error::Appwrite did not answer 200. The project may be paused - open the Appwrite console and restore it.'
          cat /tmp/resp.json 2>/dev/null || true
          exit 1
