# Sky AI Worker — F0.1 / DV-01. Deployed only via
# .github/workflows/sky-ai-deploy.yml (manual, confirmation: DEPLOY, main only).
# No vars or secrets yet: this Worker exists so new AI config does not have to
# fit into admission-gk's full 64-variable budget.
name = "sky-ai"
main = "worker.mjs"
compatibility_date = "2024-11-01"
# Owner 2026-10-21: no public URL. sky-ai is reachable only through
# admission-gk's SKY_AI service binding, so the internal caller headers
# (x-sky-ai-caller / x-sky-uid) cannot be forged from the internet.
workers_dev = false

[observability]
enabled = true
head_sampling_rate = 1

# F0.1 step 4b: same KV namespace as admission-gk's PUB_KV (read-only use:
# aiprefs:<uid> and the internal key secret:sky-internal). A binding, not a var.
[[kv_namespaces]]
binding = "PUB_KV"
id = "fd9a455d1be64c2eade1309186462808"

# F0.1 step 4d — Recall reads per-student memory that lives in the AI_STATE
# Durable Object. `script_name` is what keeps it the SAME object: a DO id is
# scoped to the script that declares the class, so declaring AiStateObject here
# would have created a second, empty store and every student's reminder would
# have silently disappeared.
#
# No [[migrations]] block on purpose: the class is already declared by
# admission-gk, and redeclaring it here would be a second store.
[[durable_objects.bindings]]
name = "AI_STATE"
class_name = "AiStateObject"
script_name = "admission-gk"

# F0.2 / DV-02: canary + kill switch for new AI behaviour. Without this binding
# `wrangler deploy` drops it from the live Worker (a deploy replaces the whole
# binding set), and /api/ai/sky-flags silently falls back to gk-fallback with
# every flag off — the switch would look present but do nothing.
[[kv_namespaces]]
binding = "SKY_FLAGS"
id = "0fe1817e14f2466b84ac727a4405859c"
