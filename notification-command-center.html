<!DOCTYPE html>
<html lang="bn" data-theme="light" data-lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<!-- Internal admin preview: reachable for the owner, but it was indexable and
     carried no robots meta at all, so it could be crawled like a public page. -->
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>AdmissionHub · Notification Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@500;600;700&display=swap">
<style>
/* ============================================================
   1. DESIGN TOKENS
   ============================================================ */
:root{
  --brand:#0f6b4f;
  --brand-deep:#0b4f3b;
  --mint:#e7f4ee;
  --bg:#ffffff;
  --surface-soft:#f4f8f5;
  --ink:#16211c;
  --sub:#5b6b63;
  --line:rgba(15,107,79,.14);
  --coral:#f18f72;
  --blue:#5b8def;
  --amber:#c98a2c;
  --danger:#b3261e;
  --radius:16px;
  --radius-lg:20px;
  --radius-pill:999px;
  --shadow:0 5px 18px rgba(22,67,49,.07);
  --shadow-soft:0 12px 32px rgba(22,67,49,.08);
  --space:8px;

  --brand-ink:#ffffff;
  --surface:#ffffff;
  --surface-2:#fbfdfc;
  --ink-2:#3c4b44;
  --muted:#8496 8d;
  --muted:#8a9a92;
  --line-strong:rgba(15,107,79,.24);
  --ok:#0f6b4f;
  --ok-bg:rgba(15,107,79,.10);
  --warn-bg:rgba(201,138,44,.12);
  --danger-bg:rgba(179,38,30,.10);
  --info-bg:rgba(91,141,239,.12);
  --coral-bg:rgba(241,143,114,.14);
  --scrim:rgba(12,30,22,.42);
  --skeleton:linear-gradient(90deg,rgba(15,107,79,.07) 25%,rgba(15,107,79,.13) 37%,rgba(15,107,79,.07) 63%);
  --focus:#0f6b4f;
  --topbar-h:56px;
  --tabbar-h:62px;
  --keyboard-inset:0px;
  --font-bn:"Noto Sans Bengali",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-serif:"Noto Serif Bengali",Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}

/* ---- DARK: a real surface ramp, not an inversion ---- */
:root[data-theme="dark"]{
  --brand:#4fbf98;
  --brand-deep:#2c8f6d;
  --mint:#10241d;
  --bg:#0c1512;
  --surface:#121d19;
  --surface-2:#16241f;
  --surface-soft:#101a16;
  --ink:#e9f2ed;
  --ink-2:#c2d2c9;
  --sub:#93a79d;
  --muted:#7c8f86;
  --line:rgba(122,196,166,.16);
  --line-strong:rgba(122,196,166,.30);
  --brand-ink:#06231a;
  --shadow:0 5px 18px rgba(0,0,0,.36);
  --shadow-soft:0 12px 34px rgba(0,0,0,.44);
  --ok:#5fd0a6;
  --ok-bg:rgba(95,208,166,.13);
  --warn-bg:rgba(226,168,80,.15);
  --danger-bg:rgba(255,138,128,.14);
  --info-bg:rgba(122,163,255,.15);
  --coral-bg:rgba(241,143,114,.16);
  --amber:#e2a850;
  --coral:#ff9d80;
  --blue:#8aacff;
  --danger:#ff8a80;
  --scrim:rgba(0,0,0,.58);
  --skeleton:linear-gradient(90deg,rgba(122,196,166,.07) 25%,rgba(122,196,166,.16) 37%,rgba(122,196,166,.07) 63%);
  --focus:#6fd8b0;
}

/* ---- PINK: warm paper, deep berry accent ---- */
:root[data-theme="pink"]{
  --brand:#a8305f;
  --brand-deep:#87224a;
  --mint:#fdeef3;
  --bg:#fffafc;
  --surface:#ffffff;
  --surface-2:#fff7fa;
  --surface-soft:#fdf2f6;
  --ink:#2b1620;
  --ink-2:#4f3441;
  --sub:#7a5a68;
  --muted:#a98d99;
  --line:rgba(168,48,95,.15);
  --line-strong:rgba(168,48,95,.28);
  --brand-ink:#ffffff;
  --ok:#a8305f;
  --ok-bg:rgba(168,48,95,.10);
  --warn-bg:rgba(201,138,44,.14);
  --danger-bg:rgba(179,38,30,.10);
  --info-bg:rgba(91,141,239,.12);
  --coral-bg:rgba(241,143,114,.16);
  --shadow:0 5px 18px rgba(120,30,70,.08);
  --shadow-soft:0 12px 32px rgba(120,30,70,.10);
  --skeleton:linear-gradient(90deg,rgba(168,48,95,.07) 25%,rgba(168,48,95,.13) 37%,rgba(168,48,95,.07) 63%);
  --focus:#a8305f;
}

/* ---- GREEN: deeper forest, high-contrast operational ---- */
:root[data-theme="green"]{
  --brand:#1c6b3f;
  --brand-deep:#124f2d;
  --mint:#e6f4ea;
  --bg:#f8fdf9;
  --surface:#ffffff;
  --surface-2:#f4fbf6;
  --surface-soft:#eef8f1;
  --ink:#14251b;
  --ink-2:#395142;
  --sub:#546b5c;
  --muted:#7d937f;
  --line:rgba(28,107,63,.16);
  --line-strong:rgba(28,107,63,.30);
  --brand-ink:#ffffff;
  --ok:#1c6b3f;
  --ok-bg:rgba(28,107,63,.10);
  --shadow:0 5px 18px rgba(20,60,35,.08);
  --shadow-soft:0 12px 32px rgba(20,60,35,.10);
  --skeleton:linear-gradient(90deg,rgba(28,107,63,.07) 25%,rgba(28,107,63,.13) 37%,rgba(28,107,63,.07) 63%);
  --focus:#1c6b3f;
}

/* ============================================================
   2. RESET + BASE
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-bn);
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
[data-lang="en"] body,[data-lang="en"] .ns{font-family:system-ui,-apple-system,"Segoe UI",Roboto,var(--font-bn)}
h1,h2,h3,h4,p,figure{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
svg{display:block}
:focus{outline:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:8px}
::selection{background:var(--brand);color:var(--brand-ink)}
[hidden]{display:none !important}
.ns-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.ns-skip{position:absolute;left:8px;top:-60px;z-index:200;background:var(--brand);color:var(--brand-ink);padding:10px 14px;border-radius:10px;font-weight:600;transition:top .18s}
.ns-skip:focus{top:8px}
[data-lang="bn"] .en{display:none !important}
[data-lang="en"] .bn{display:none !important}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important}
  .ns-view.is-active{animation:none !important}
}

/* ---- stability: kill zoom / shift / overscroll jitter ---- */
html{overscroll-behavior-y:none}
body{overscroll-behavior-y:none;touch-action:manipulation}
.ns-input,.ns-textarea,.ns-select{font-size:16px} /* prevents iOS focus zoom */
.ns-panel,.ns-step,.ns-metric,.ns-tpl,.ns-health-card,.ns-approval{contain:layout paint}
img,svg{max-width:100%}
@media (pointer:coarse){
  .ns-btn,.ns-btn-sm,.ns-iconbtn,.ns-seg-btn,.ns-var-chip,.ns-star,.ns-rule-del,.ns-chat-send{min-height:44px}
  .ns-chat-send{min-width:44px}
  .ns-seg-btn{min-height:44px}
}

/* ============================================================
   3. APP SHELL
   ============================================================ */
.ns-app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--surface-soft)}
.ns-shell{display:flex;flex:1;min-width:0;align-items:stretch;min-height:0}

/* --- Sidebar (desktop) --- */
.ns-sidebar{
  width:252px;flex:0 0 252px;background:var(--surface);border-inline-end:1px solid var(--line);
  display:none;flex-direction:column;padding:16px 12px;height:100vh;height:100dvh;overflow-y:auto;overscroll-behavior:contain;
  position:sticky;top:0;align-self:flex-start;
}
.ns-brand{display:flex;align-items:center;gap:10px;padding:8px 8px 16px}
.ns-brand-mark{width:34px;height:34px;border-radius:10px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;flex:0 0 34px}
.ns-brand-name{font-family:var(--font-serif);font-weight:600;font-size:15.5px;letter-spacing:-.008em;line-height:1.2}
.ns-brand-sub{font-size:11px;color:var(--sub);letter-spacing:.02em}
.ns-navlist{display:flex;flex-direction:column;gap:2px}
.ns-navgroup-label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 10px 6px}
.ns-navbtn{
  display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:8px 10px;border-radius:12px;
  color:var(--ink-2);font-size:14.5px;font-weight:500;text-align:start;transition:background .15s,color .15s;position:relative;
}
.ns-navbtn:hover{background:var(--surface-soft);color:var(--ink)}
.ns-navbtn[aria-current="page"]{background:var(--mint);color:var(--brand-deep);font-weight:600}
:root[data-theme="dark"] .ns-navbtn[aria-current="page"]{color:var(--brand)}
.ns-navbtn[aria-current="page"]::before{content:"";position:absolute;inset-inline-start:0;top:11px;bottom:11px;width:3px;border-radius:3px;background:var(--brand)}
.ns-navbtn .ns-ico{flex:0 0 20px}
.ns-navbadge{margin-inline-start:auto;font-size:11.5px;font-weight:700;background:var(--ok-bg);color:var(--brand);padding:2px 7px;border-radius:var(--radius-pill);font-variant-numeric:tabular-nums}
.ns-navbadge.is-warn{background:var(--warn-bg);color:var(--amber)}
.ns-sidebar-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.ns-healthchip{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--sub);padding:8px 10px;border-radius:12px;background:var(--surface-soft)}

/* --- Topbar --- */
.ns-main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.ns-topbar{
  position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);height:var(--topbar-h);display:flex;align-items:center;gap:8px;padding:0 10px;
}
.ns-topbar-title{font-size:15.5px;font-weight:650;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;min-width:0}
.ns-topbar-title .ns-truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ns-topbar-spacer{flex:1}
.ns-iconbtn{
  width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2);
  transition:background .15s,color .15s;flex:0 0 auto;
}
.ns-iconbtn:hover{background:var(--surface-soft);color:var(--ink)}
.ns-iconbtn.is-active{background:var(--mint);color:var(--brand-deep)}
.ns-iconbtn .ns-dot{position:absolute;margin-top:-14px;margin-inline-start:14px;width:7px;height:7px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 2px var(--surface)}
.ns-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 16px;border-radius:12px;
  font-size:14px;font-weight:550;border:1px solid transparent;transition:background .15s,border-color .15s,color .15s,transform .1s;white-space:nowrap;
}
.ns-btn:active{transform:translateY(.5px) scale(.99)}
.ns-btn-primary{background:var(--brand);color:var(--brand-ink);box-shadow:0 1px 2px rgba(15,107,79,.16),0 6px 16px rgba(15,107,79,.14)}
.ns-btn-primary:hover{background:var(--brand-deep)}
.ns-btn-ghost{background:var(--surface);border-color:var(--line-strong);color:var(--ink);box-shadow:0 1px 2px rgba(22,67,49,.04)}
.ns-btn-ghost:hover{background:var(--surface-soft)}
.ns-btn-quiet{color:var(--ink-2)}
.ns-btn-quiet:hover{background:var(--surface-soft)}
.ns-btn-danger{background:var(--danger-bg);color:var(--danger);border-color:transparent}
.ns-btn-danger:hover{background:var(--danger);color:#fff}
.ns-btn-send{background:var(--brand);color:var(--brand-ink);box-shadow:0 2px 6px rgba(15,107,79,.20),0 10px 26px rgba(15,107,79,.22)}
.ns-btn-send:hover{background:var(--brand-deep)}
.ns-btn[disabled],.ns-btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed;box-shadow:none}
.ns-btn-sm{min-height:40px;padding:0 13px;font-size:13.5px;border-radius:11px}
.ns-btn-block{width:100%}

/* --- Content --- */
.ns-content{padding:14px;padding-bottom:calc(96px + var(--keyboard-inset));flex:1;min-width:0;min-height:0}
.ns-view{display:none;max-width:1400px;margin:0 auto;animation:ns-fade .22s ease both}
.ns-view.is-active{display:block}
@keyframes ns-fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.ns-view.is-active{animation:none}}

/* --- Mobile tabbar --- */
.ns-mobile-nav{
  position:fixed;inset-inline:0;bottom:0;z-index:45;display:flex;background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
}
.ns-tabbtn{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  min-height:var(--tabbar-h);font-size:11px;font-weight:600;color:var(--muted);padding:6px 2px;position:relative;
}
.ns-tabbtn[aria-current="page"]{color:var(--brand)}
.ns-tabbtn[aria-current="page"]::after{content:"";position:absolute;top:0;width:22px;height:3px;border-radius:0 0 3px 3px;background:var(--brand)}
.ns-tabbtn .ns-ico{width:22px;height:22px}
.ns-tabbtn .ns-tabbadge{position:absolute;top:6px;inset-inline-start:calc(50% + 2px);background:var(--coral);color:#fff;font-size:9.5px;font-weight:700;min-width:15px;height:15px;border-radius:8px;display:grid;place-items:center;padding:0 3px}

@media (min-width:1024px){
  .ns-sidebar{display:flex}
  .ns-mobile-nav{display:none}
  .ns-content{padding:20px 24px 40px;padding-bottom:40px}
  .ns-topbar{padding:0 20px}
}
@media (min-width:768px) and (max-width:1023px){
  .ns-content{padding:18px 18px 96px}
}
@media (max-width:1023px){
  /* the pinned Draft/Test/Review bar is out of flow; keep the last panel clear of it */
  .ns-compose-side{padding-bottom:150px}
}

/* ============================================================
   4. PRIMITIVES: panel, section, chip, badge, list, field
   ============================================================ */
.ns-panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden}
.ns-panel-pad{padding:16px}
.ns-panel-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.ns-panel-head h2{font-size:14.5px;font-weight:600;letter-spacing:-.005em}
.ns-panel-head .ns-hint{font-size:12.5px;color:var(--sub);font-weight:400}
.ns-panel-head-actions{margin-inline-start:auto;display:flex;align-items:center;gap:6px}

.ns-eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ns-page-head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.ns-page-head h1{font-family:var(--font-serif);font-size:21px;font-weight:600;letter-spacing:-.012em;line-height:1.3}
.ns-page-head p{font-size:13px;color:var(--sub);margin-top:4px;max-width:64ch}
.ns-page-head-actions{margin-inline-start:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (min-width:640px){.ns-page-head h1{font-size:23px}}

.ns-chip{
  display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:var(--radius-pill);
  background:var(--surface);border:1px solid var(--line-strong);font-size:12.5px;font-weight:600;color:var(--ink-2);
}
.ns-chip .ns-ico{width:14px;height:14px}
.ns-chip-btn{cursor:pointer;transition:background .15s,border-color .15s,color .15s}
.ns-chip-btn:hover{background:var(--mint);border-color:var(--brand);color:var(--brand-deep)}
.ns-chip-btn[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.ns-chip-static{cursor:default}

.ns-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:var(--radius-pill);font-size:11.5px;font-weight:650;background:var(--surface-soft);color:var(--sub);white-space:nowrap}
.ns-badge .ns-ico{width:12px;height:12px}
.ns-badge-ok{background:var(--ok-bg);color:var(--ok)}
.ns-badge-warn{background:var(--warn-bg);color:var(--amber)}
.ns-badge-danger{background:var(--danger-bg);color:var(--danger)}
.ns-badge-info{background:var(--info-bg);color:var(--blue)}
.ns-badge-coral{background:var(--coral-bg);color:var(--coral)}
.ns-badge-brand{background:var(--mint);color:var(--brand-deep)}
:root[data-theme="dark"] .ns-badge-brand{color:var(--brand)}
.ns-badge-dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:0 0 7px}

.ns-dotmark{width:9px;height:9px;border-radius:50%;flex:0 0 9px;background:var(--muted)}
.ns-dotmark.ok{background:var(--ok)}
.ns-dotmark.warn{background:var(--amber)}
.ns-dotmark.bad{background:var(--danger)}
.ns-dotmark.idle{background:var(--muted)}
.ns-dotmark.busy{background:var(--blue);animation:ns-pulse 1.4s ease-in-out infinite}
@keyframes ns-pulse{0%,100%{opacity:1}50%{opacity:.35}}

.ns-sep{height:1px;background:var(--line);border:0;margin:14px 0}
.ns-truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ns-clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ns-muted{color:var(--sub)}
.ns-dim{color:var(--muted)}
.ns-num{font-variant-numeric:tabular-nums}
.ns-mono{font-family:var(--mono);font-size:12px}

/* --- Status pill --- */
.ns-status{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:650;padding:4px 10px;border-radius:var(--radius-pill);border:1px solid transparent}
.ns-status-sent{background:var(--ok-bg);color:var(--ok)}
.ns-status-scheduled{background:var(--info-bg);color:var(--blue)}
.ns-status-queued{background:var(--info-bg);color:var(--blue)}
.ns-status-sending{background:var(--info-bg);color:var(--blue)}
.ns-status-draft{background:var(--surface-soft);color:var(--sub)}
.ns-status-paused{background:var(--warn-bg);color:var(--amber)}
.ns-status-cancelled{background:var(--surface-soft);color:var(--muted);text-decoration:line-through}
.ns-status-failed{background:var(--danger-bg);color:var(--danger)}
.ns-status-active{background:var(--ok-bg);color:var(--ok)}
.ns-status-completed{background:var(--mint);color:var(--brand-deep)}
:root[data-theme="dark"] .ns-status-completed{color:var(--brand)}
.ns-status-ready{background:var(--coral-bg);color:var(--coral)}
.ns-status-approved{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}

/* --- Fields --- */
.ns-field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
.ns-field-label{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink)}
.ns-field-label .ns-req{color:var(--danger);font-weight:700}
.ns-field-help{font-size:12.5px;color:var(--sub);line-height:1.45}
.ns-input,.ns-textarea,.ns-select{
  width:100%;background:var(--surface);border:1px solid var(--line-strong);border-radius:14px;
  padding:12px 14px;font-size:15px;min-height:48px;transition:border-color .15s,box-shadow .15s,background .15s;color:var(--ink);
}
.ns-textarea{min-height:110px;resize:vertical;line-height:1.6}
.ns-input::placeholder,.ns-textarea::placeholder{color:var(--muted)}
.ns-input:hover,.ns-textarea:hover,.ns-select:hover{border-color:var(--brand)}
.ns-input:focus-visible,.ns-textarea:focus-visible,.ns-select:focus-visible{
  border-color:var(--brand);box-shadow:0 0 0 3.5px var(--ok-bg);outline:none;
}
.ns-input[aria-invalid="true"],.ns-textarea[aria-invalid="true"],.ns-select[aria-invalid="true"]{border-color:var(--danger)}
.ns-select{-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--sub) 50%),linear-gradient(135deg,var(--sub) 50%,transparent 50%);background-position:calc(100% - 19px) 22px,calc(100% - 13px) 22px;background-size:6px 6px,6px 6px;background-repeat:no-repeat;padding-inline-end:38px}
[dir="rtl"] .ns-select{background-position:19px 22px,13px 22px}
.ns-field-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ns-counter{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-inline-start:auto}
.ns-counter.is-over{color:var(--danger);font-weight:700}
.ns-counter.is-near{color:var(--amber);font-weight:650}
.ns-error-text{font-size:12.5px;color:var(--danger);display:flex;gap:6px;align-items:flex-start;font-weight:550}
.ns-error-text .ns-ico{width:14px;height:14px;flex:0 0 14px;margin-top:2px}

/* --- Checkbox / radio / switch --- */
.ns-check{display:flex;align-items:flex-start;gap:10px;min-height:44px;padding:9px 0;cursor:pointer;font-size:14px}
.ns-check input[type="checkbox"],.ns-check input[type="radio"]{
  width:20px;height:20px;flex:0 0 20px;margin:1px 0 0;accent-color:var(--brand);cursor:pointer;
}
.ns-check-text{display:flex;flex-direction:column;gap:1px}
.ns-check-sub{font-size:12px;color:var(--sub)}
.ns-switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;min-height:44px}
.ns-switch input{position:absolute;opacity:0;width:1px;height:1px}
.ns-switch-track{width:46px;height:27px;border-radius:var(--radius-pill);background:var(--line-strong);position:relative;transition:background .18s;flex:0 0 46px}
.ns-switch-track::after{content:"";position:absolute;top:2.5px;inset-inline-start:2.5px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.24);transition:transform .18s}
.ns-switch input:checked + .ns-switch-track{background:var(--brand)}
.ns-switch input:checked + .ns-switch-track::after{transform:translateX(19px)}
[dir="rtl"] .ns-switch input:checked + .ns-switch-track::after{transform:translateX(-19px)}
.ns-switch input:focus-visible + .ns-switch-track{outline:2.5px solid var(--focus);outline-offset:2px}

/* --- Segmented control --- */
.ns-seg{display:inline-flex;background:var(--surface-soft);border-radius:13px;padding:3px;gap:2px;border:1px solid var(--line)}
.ns-seg-btn{padding:8px 13px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--sub);min-height:38px;transition:background .15s,color .15s}
.ns-seg-btn[aria-pressed="true"],.ns-seg-btn[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.ns-seg-btn:hover{color:var(--ink)}

/* --- Tabs --- */
.ns-tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin-bottom:14px}
.ns-tabs::-webkit-scrollbar{display:none}
.ns-tab{
  padding:11px 13px;font-size:14px;font-weight:600;color:var(--sub);white-space:nowrap;position:relative;min-height:44px;
  display:inline-flex;align-items:center;gap:7px;transition:color .15s;
}
.ns-tab:hover{color:var(--ink)}
.ns-tab[aria-selected="true"]{color:var(--brand)}
.ns-tab[aria-selected="true"]::after{content:"";position:absolute;inset-inline:8px;bottom:-1px;height:2.5px;background:var(--brand);border-radius:3px 3px 0 0}
.ns-tab .ns-count{font-size:11px;background:var(--surface-soft);border-radius:var(--radius-pill);padding:1px 6px;font-weight:700}

/* --- Empty / error / loading --- */
.ns-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:44px 20px;gap:10px}
.ns-empty-ico{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:var(--mint);color:var(--brand);margin-bottom:2px}
:root[data-theme="dark"] .ns-empty-ico{background:var(--surface-soft)}
.ns-empty h3{font-size:15.5px;font-weight:600}
.ns-empty p{font-size:13.5px;color:var(--sub);max-width:42ch}
.ns-empty.is-error .ns-empty-ico{background:var(--danger-bg);color:var(--danger)}
.ns-skeleton{background:var(--skeleton);background-size:400% 100%;animation:ns-shimmer 1.5s ease-in-out infinite;border-radius:8px;height:14px}
@keyframes ns-shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}
.ns-skel-row{display:flex;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.ns-skel-row:last-child{border-bottom:0}
.ns-skel-stack{display:flex;flex-direction:column;gap:7px;flex:1;min-width:0}
@media (prefers-reduced-motion:reduce){.ns-skeleton{animation:none}}

/* --- Toast --- */
.ns-toasts{position:fixed;inset-inline:0;bottom:calc(var(--tabbar-h) + 12px + env(safe-area-inset-bottom));z-index:120;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 12px;pointer-events:none}
.ns-toast{
  display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);padding:12px 15px;border-radius:14px;
  font-size:13.5px;font-weight:550;box-shadow:var(--shadow-soft);max-width:440px;width:100%;pointer-events:auto;animation:ns-toast-in .24s cubic-bezier(.2,.9,.3,1) both;
}
.ns-toast .ns-ico{flex:0 0 18px}
.ns-toast.is-ok{background:var(--brand-deep);color:#fff}
.ns-toast.is-warn{background:var(--amber);color:#fff}
.ns-toast.is-error{background:var(--danger);color:#fff}
.ns-toast.is-leaving{animation:ns-toast-out .2s ease forwards}
@keyframes ns-toast-in{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes ns-toast-out{to{opacity:0;transform:translateY(8px)}}
@media (min-width:1024px){.ns-toasts{bottom:20px}}

/* --- Offline banner --- */
.ns-offline{
  display:flex;align-items:center;gap:10px;padding:9px 14px;background:var(--warn-bg);color:var(--amber);
  font-size:12.5px;font-weight:600;border-bottom:1px solid var(--line);
}
.ns-offline .ns-ico{flex:0 0 16px}
.ns-offline button{margin-inline-start:auto;font-weight:700;text-decoration:underline;font-size:12.5px;color:inherit;min-height:32px;padding:0 6px}

/* ============================================================
   5. OVERVIEW + METRICS + TIMELINE
   ============================================================ */
.ns-overview-grid{display:grid;gap:12px}
.ns-hero{display:grid;gap:14px;padding:16px;background:linear-gradient(160deg,var(--brand) 0%,var(--brand-deep) 100%);color:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-soft);position:relative;overflow:hidden}
:root[data-theme="dark"] .ns-hero{background:linear-gradient(160deg,#173d30 0%,#0e2a21 100%);border:1px solid var(--line)}
.ns-hero::after{content:"";position:absolute;inset-inline-end:-60px;top:-70px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.07)}
.ns-hero-top{display:flex;align-items:center;gap:9px;position:relative;z-index:1}
.ns-hero h2{font-family:var(--font-serif);font-size:18px;font-weight:600;letter-spacing:-.008em}
.ns-hero-sub{font-size:13px;opacity:.85;margin-top:3px;position:relative;z-index:1;max-width:52ch}
.ns-hero-metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;position:relative;z-index:1}
.ns-hero-metric{background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:11px 13px}
.ns-hero-metric b{display:block;font-size:23px;font-weight:650;letter-spacing:-.018em;font-variant-numeric:tabular-nums;line-height:1.15}
.ns-hero-metric span{font-size:12px;opacity:.86}
.ns-hero-approval{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border:1px dashed rgba(255,255,255,.34);border-radius:12px;padding:9px 12px;font-size:12.5px;font-weight:600;position:relative;z-index:1}
@media (min-width:520px){.ns-hero-metrics{grid-template-columns:repeat(4,1fr)}}

.ns-metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.ns-metric{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;display:flex;flex-direction:column;gap:4px;min-height:94px;transition:border-color .16s ease,box-shadow .16s ease}
.ns-metric:hover{border-color:var(--line-strong);box-shadow:var(--shadow)}
.ns-metric-top{display:flex;align-items:center;gap:8px}
.ns-metric-ico{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--surface-soft);color:var(--sub);flex:0 0 30px;border:1px solid var(--line)}
.ns-metric-ico.ok{background:var(--ok-bg);color:var(--ok)}
.ns-metric-ico.warn{background:var(--warn-bg);color:var(--amber)}
.ns-metric-ico.danger{background:var(--danger-bg);color:var(--danger)}
.ns-metric-ico.info{background:var(--info-bg);color:var(--blue)}
.ns-metric-label{font-size:12.5px;color:var(--sub);font-weight:550}
.ns-metric-val{font-size:24px;font-weight:650;letter-spacing:-.022em;font-variant-numeric:tabular-nums;line-height:1.1}
.ns-metric-foot{font-size:11.5px;color:var(--muted);margin-top:auto;display:flex;align-items:center;gap:5px}
.ns-metric.is-primary{grid-column:span 2;background:var(--surface);border-color:var(--line-strong)}
.ns-metric.is-primary .ns-metric-val{font-size:34px}
@media (min-width:640px){.ns-metrics{grid-template-columns:repeat(4,1fr)}.ns-metric.is-primary{grid-column:span 2}}
@media (min-width:1024px){
  .ns-overview-grid{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);align-items:start}
  .ns-overview-grid .ns-span-all{grid-column:1/-1}
}

.ns-quota{display:flex;flex-direction:column;gap:9px}
.ns-bar{height:8px;border-radius:var(--radius-pill);background:var(--surface-soft);overflow:hidden;position:relative;border:1px solid var(--line)}
.ns-bar i{display:block;height:100%;background:var(--brand);border-radius:var(--radius-pill);transition:width .5s cubic-bezier(.2,.9,.3,1)}
.ns-bar i.warn{background:var(--amber)}
.ns-bar i.danger{background:var(--danger)}

.ns-timeline{display:flex;flex-direction:column}
.ns-tl-item{display:flex;gap:11px;padding:11px 0;position:relative}
.ns-tl-item:not(:last-child)::before{content:"";position:absolute;inset-inline-start:12.5px;top:26px;bottom:-2px;width:1.5px;background:var(--line)}
.ns-tl-ico{width:28px;height:28px;border-radius:10px;display:grid;place-items:center;flex:0 0 28px;background:var(--surface);color:var(--sub);border:1px solid var(--line);position:relative;z-index:1}
.ns-tl-ico.ok{background:var(--ok-bg);color:var(--ok)}
.ns-tl-ico.warn{background:var(--warn-bg);color:var(--amber)}
.ns-tl-ico.danger{background:var(--danger-bg);color:var(--danger)}
.ns-tl-ico.info{background:var(--info-bg);color:var(--blue)}
.ns-tl-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ns-tl-title{font-size:13.5px;font-weight:600;line-height:1.4}
.ns-tl-meta{font-size:11.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* --- AI activity log (operational, not chat) --- */
.ns-ailog{display:flex;flex-direction:column;background:var(--surface-soft);border-radius:14px;padding:4px 10px;border:1px solid var(--line)}
.ns-ailog-row{display:flex;gap:9px;align-items:flex-start;padding:9px 0;font-size:13px;border-bottom:1px solid var(--line)}
.ns-ailog-row:last-child{border-bottom:0}
.ns-ailog-row .ns-ico{flex:0 0 15px;margin-top:2px;color:var(--brand)}
.ns-ailog-time{font-family:var(--mono);font-size:11px;color:var(--muted);flex:0 0 auto;margin-inline-start:auto;padding-top:1px}
.ns-ailog-text{flex:1;min-width:0;line-height:1.45}
.ns-ailog-text b{font-weight:650}

/* ============================================================
   6. AI PANEL + APPROVAL BOUNDARY
   ============================================================ */
.ns-ai-steps{display:flex;flex-direction:column;padding:6px 12px 10px}
.ns-ai-step{display:flex;gap:10px;align-items:flex-start;padding:7px 0;font-size:13px;animation:ns-step-in .3s ease both}
.ns-ai-step .ns-ico{flex:0 0 16px;margin-top:2px}
.ns-ai-step.is-done .ns-ico{color:var(--ok)}
.ns-ai-step.is-run .ns-ico{color:var(--blue);animation:ns-pulse 1.1s ease-in-out infinite}
.ns-ai-step.is-wait .ns-ico{color:var(--coral)}
@keyframes ns-step-in{from{opacity:0;transform:translateX(-4px)}to{opacity:1;transform:none}}

/* --- Approval boundary --- */
.ns-approval{
  border:2px solid var(--line-strong);border-radius:var(--radius-lg);padding:14px;background:var(--surface);
  display:flex;flex-direction:column;gap:12px;transition:border-color .2s,background .2s;
}
.ns-approval.is-ready{border-color:var(--coral);background:var(--coral-bg)}
.ns-approval.is-approved{border-color:var(--ok);background:var(--ok-bg)}
.ns-approval.is-blocked{border-color:var(--danger);background:var(--danger-bg)}
.ns-approval-head{display:flex;align-items:flex-start;gap:10px}
.ns-approval-head h3{font-size:14px;font-weight:650;letter-spacing:-.005em}
.ns-approval-head p{font-size:12.5px;color:var(--sub);margin-top:2px}
.ns-approval-ico{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;flex:0 0 32px;background:var(--surface-soft);color:var(--sub)}
.ns-approval.is-ready .ns-approval-ico{background:var(--coral);color:#fff}
.ns-approval.is-approved .ns-approval-ico{background:var(--ok);color:#fff}
.ns-approval.is-blocked .ns-approval-ico{background:var(--danger);color:#fff}
.ns-approval-gates{display:grid;gap:7px}
.ns-gate{display:flex;align-items:center;gap:9px;font-size:13px;padding:7px 10px;border-radius:11px;background:var(--surface-soft);border:1px solid var(--line)}
.ns-gate .ns-gate-mark{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:0 0 20px;background:var(--surface);border:1.5px solid var(--line-strong);color:var(--muted);font-size:11px;font-weight:700}
.ns-gate.ok .ns-gate-mark{background:var(--ok);border-color:var(--ok);color:#fff}
.ns-gate.wait .ns-gate-mark{background:var(--coral);border-color:var(--coral);color:#fff}
.ns-gate.bad .ns-gate-mark{background:var(--danger);border-color:var(--danger);color:#fff}
.ns-gate .ns-gate-text{flex:1;min-width:0}
.ns-hold-strip{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:12px;background:var(--surface-soft);border:1px dashed var(--line-strong);font-size:12.5px;color:var(--sub);font-weight:550}
.ns-hold-strip .ns-ico{flex:0 0 16px;color:var(--brand)}

/* ============================================================
   7. COMPOSE LAYOUT
   ============================================================ */
.ns-compose-wrap{display:grid;gap:14px;align-items:start}
@media (min-width:1024px){
  .ns-compose-wrap{grid-template-columns:minmax(0,1fr) minmax(320px,390px);gap:18px}
  .ns-compose-side{position:sticky;top:calc(var(--topbar-h) + 16px);display:flex;flex-direction:column;gap:14px;max-height:calc(100dvh - var(--topbar-h) - 32px);overflow-y:auto;padding-bottom:8px}
}
.ns-step{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.ns-step-head{display:flex;align-items:center;gap:11px;padding:13px 14px;width:100%;text-align:start;background:none;transition:background .15s;min-height:56px}
.ns-step-head:hover{background:var(--surface-soft)}
.ns-step-num{width:27px;height:27px;border-radius:9px;background:var(--mint);color:var(--brand-deep);display:grid;place-items:center;font-size:12.5px;font-weight:700;flex:0 0 26px}
:root[data-theme="dark"] .ns-step-num{color:var(--brand)}
.ns-step.is-done .ns-step-num{background:var(--brand);color:var(--brand-ink)}
.ns-step-title{font-size:14px;font-weight:600;letter-spacing:-.005em;flex:1;min-width:0}
.ns-step-sum{font-size:12.5px;color:var(--muted);font-weight:450;display:block;margin-top:1px}
.ns-step-chev{color:var(--muted);transition:transform .2s;flex:0 0 18px}
.ns-step-head[aria-expanded="true"] .ns-step-chev{transform:rotate(180deg)}
.ns-step-body{padding:4px 14px 16px;border-top:1px solid var(--line)}
.ns-step-body[hidden]{display:none}
@media (prefers-reduced-motion:reduce){.ns-step-chev{transition:none}}

/* --- Type picker --- */
.ns-types{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;padding-top:12px}
.ns-type{
  display:flex;align-items:center;gap:9px;padding:10px 11px;border-radius:14px;border:1.5px solid var(--line);
  background:var(--surface);text-align:start;transition:border-color .15s,background .15s;min-height:52px;
}
.ns-type:hover{border-color:var(--brand)}
.ns-type[aria-checked="true"]{border-color:var(--brand);background:var(--mint)}
:root[data-theme="dark"] .ns-type[aria-checked="true"]{background:var(--surface-2)}
.ns-type-ico{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:0 0 30px;background:var(--surface-soft);color:var(--sub)}
.ns-type[aria-checked="true"] .ns-type-ico{background:var(--brand);color:var(--brand-ink)}
.ns-type-text{min-width:0;display:flex;flex-direction:column}
.ns-type-name{font-size:13.5px;font-weight:650;line-height:1.25}
.ns-type-desc{font-size:11.5px;color:var(--muted);line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ns-addtype{margin-top:8px}

/* --- Channel selector --- */
.ns-channels{display:flex;flex-wrap:wrap;gap:8px;padding-top:12px}
.ns-channel{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);min-height:48px;transition:border-color .15s,background .15s}
.ns-channel:hover{border-color:var(--brand)}
.ns-channel[aria-pressed="true"]{border-color:var(--brand);background:var(--mint)}
:root[data-theme="dark"] .ns-channel[aria-pressed="true"]{background:var(--surface-2)}
.ns-channel[disabled]{opacity:.5;cursor:not-allowed}
.ns-channel .ns-ico{color:var(--brand)}
.ns-channel-label{font-size:13.5px;font-weight:600}
.ns-channel.is-planned .ns-chip-mini{font-size:10px;background:var(--warn-bg);color:var(--amber);padding:1px 6px;border-radius:var(--radius-pill);font-weight:700}

/* --- Inline tip / warning --- */
.ns-note{display:flex;gap:9px;align-items:flex-start;padding:10px 12px;border-radius:12px;font-size:12.5px;line-height:1.5;border:1px solid transparent}
.ns-note .ns-ico{flex:0 0 16px;margin-top:1px}
.ns-note-info{background:var(--info-bg);color:var(--blue)}
.ns-note-warn{background:var(--warn-bg);color:var(--amber)}
.ns-note-danger{background:var(--danger-bg);color:var(--danger)}
.ns-note-ok{background:var(--ok-bg);color:var(--ok)}
.ns-note-neutral{background:var(--surface-soft);color:var(--sub)}
.ns-note b{font-weight:700}

/* ============================================================
   8. PREVIEW (device)
   ============================================================ */
.ns-preview{padding:0}
.ns-preview-toolbar{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ns-preview-toolbar .ns-seg{margin-inline-start:auto}
.ns-device-stage{
  display:flex;justify-content:center;padding:18px 14px;background:
    radial-gradient(circle at 30% 10%,var(--mint) 0%,transparent 60%),var(--surface-soft);
}
.ns-device{
  width:100%;max-width:300px;border-radius:30px;padding:11px 10px 14px;background:#0d0f0e;
  box-shadow:0 16px 40px rgba(0,0,0,.30),0 0 0 1px rgba(255,255,255,.06) inset;
}
.ns-device.android{border-radius:18px;padding:9px 8px 12px}
.ns-device.is-light{background:#e9ecea;box-shadow:0 16px 40px rgba(0,0,0,.16),0 0 0 1px rgba(0,0,0,.06) inset}
.ns-device-screen{border-radius:22px;overflow:hidden;background:#101413;color:#f2f5f3;min-height:280px;position:relative}
.ns-device.android .ns-device-screen{border-radius:12px}
.ns-device.is-light .ns-device-screen{background:#f6f8f6;color:#111512}
.ns-statusbar{display:flex;align-items:center;gap:6px;padding:7px 15px 3px;font-size:11.5px;font-weight:650;opacity:.92}
.ns-statusbar .ns-sb-right{margin-inline-start:auto;display:flex;gap:5px;align-items:center}
.ns-device-wall{padding:12px 11px 20px;display:flex;flex-direction:column;gap:9px;min-height:210px}
.ns-wall-time{text-align:center;padding:10px 0 4px}
.ns-wall-time b{display:block;font-size:44px;font-weight:600;letter-spacing:-.04em;line-height:1}
.ns-wall-time span{font-size:12px;opacity:.7}
.ns-notif-card{
  border-radius:17px;padding:11px 12px;display:flex;gap:10px;align-items:flex-start;
  background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.14);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);animation:ns-notif-in .32s cubic-bezier(.2,.9,.3,1) both;
}
.ns-device.is-light .ns-notif-card{background:rgba(255,255,255,.94);border-color:rgba(0,0,0,.07);box-shadow:0 3px 12px rgba(0,0,0,.08)}
@keyframes ns-notif-in{from{opacity:0;transform:translateY(-8px) scale(.98)}to{opacity:1;transform:none}}
.ns-app-icon{width:34px;height:34px;border-radius:9px;background:var(--brand);color:#fff;display:grid;place-items:center;flex:0 0 34px}
.ns-notif-main{flex:1;min-width:0}
.ns-notif-topline{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;opacity:.72;margin-bottom:3px}
.ns-notif-topline .ns-notif-time{margin-inline-start:auto;font-weight:500;text-transform:none;letter-spacing:0}
.ns-notif-title{font-size:14px;font-weight:650;line-height:1.3;letter-spacing:-.01em}
.ns-notif-body{font-size:13px;line-height:1.45;opacity:.86;margin-top:2px}
.ns-notif-body.is-clamped{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ns-notif-img{margin-top:8px;border-radius:11px;height:104px;background-size:cover;background-position:center;border:1px solid rgba(255,255,255,.12)}
.ns-device.is-light .ns-notif-img{border-color:rgba(0,0,0,.08)}
.ns-notif-cta{margin-top:8px;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:650;color:var(--brand)}
.ns-device.is-light .ns-notif-cta{color:var(--brand-deep)}
.ns-notif-foot{margin-top:7px;font-size:10.5px;opacity:.6;font-family:var(--mono)}
.ns-device-meta{display:flex;align-items:center;gap:8px;padding:10px 14px;font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);flex-wrap:wrap}
.ns-device-meta .ns-num{color:var(--ink-2);font-weight:650}
@media (prefers-reduced-motion:reduce){.ns-notif-card{animation:none}}

/* --- Reach / audience intel --- */
.ns-reach{display:flex;flex-direction:column;gap:12px}
.ns-reach-hero{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap}
.ns-reach-num{font-size:36px;font-weight:650;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.ns-reach-label{font-size:12.5px;color:var(--sub);padding-bottom:4px}
.ns-reach-num.is-zero{color:var(--muted)}
.ns-breakdown{display:flex;flex-direction:column;gap:9px}
.ns-bd-row{display:flex;align-items:center;gap:9px;font-size:12.5px}
.ns-bd-name{flex:0 0 auto;min-width:88px;color:var(--ink-2);font-weight:550}
.ns-bd-bar{flex:1;height:7px;border-radius:var(--radius-pill);background:var(--surface-soft);overflow:hidden;border:1px solid var(--line)}
.ns-bd-bar i{display:block;height:100%;background:var(--brand);opacity:.85;transition:width .45s ease}
.ns-bd-val{flex:0 0 auto;font-variant-numeric:tabular-nums;color:var(--sub);min-width:52px;text-align:end;font-weight:600}
.ns-donut{display:flex;align-items:center;gap:16px}
.ns-donut svg{flex:0 0 92px}
.ns-legend{display:flex;flex-direction:column;gap:7px;font-size:12.5px;min-width:0}
.ns-legend-row{display:flex;align-items:center;gap:8px}
.ns-legend-sw{width:10px;height:10px;border-radius:3px;flex:0 0 10px}
.ns-legend-row .ns-num{margin-inline-start:auto;font-weight:650;color:var(--ink-2)}

.ns-samples{display:flex;flex-direction:column;gap:6px}
.ns-sample{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:11px;background:var(--surface-soft);font-size:12.5px}
.ns-avatar{width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;flex:0 0 26px}

/* --- Validation list --- */
.ns-val{display:flex;flex-direction:column;gap:1px}
.ns-val-row{display:flex;align-items:flex-start;gap:9px;padding:8px 0;font-size:12.5px;border-bottom:1px solid var(--line)}
.ns-val-row:last-child{border-bottom:0}
.ns-val-row .ns-ico{flex:0 0 15px;margin-top:1.5px}
.ns-val-row .ns-val-text{flex:1;min-width:0;line-height:1.45}
.ns-val-row.ok .ns-ico{color:var(--ok)}
.ns-val-row.warn .ns-ico{color:var(--amber)}
.ns-val-row.bad .ns-ico{color:var(--danger)}
.ns-val-row.pending .ns-ico{color:var(--muted)}
.ns-val-fix{color:var(--brand);font-weight:650;text-decoration:underline;text-underline-offset:2px;font-size:12px}

/* ============================================================
   9. AUDIENCE BUILDER
   ============================================================ */
.ns-aud-grid{display:grid;gap:14px;align-items:start}
@media (min-width:1024px){.ns-aud-grid{grid-template-columns:minmax(0,1.5fr) minmax(300px,360px)}}
.ns-segs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ns-seg-card{
  text-align:start;padding:11px 12px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);
  display:flex;flex-direction:column;gap:4px;min-height:76px;transition:border-color .15s,background .15s;
}
.ns-seg-card:hover{border-color:var(--brand)}
.ns-seg-card[aria-checked="true"]{border-color:var(--brand);background:var(--mint)}
:root[data-theme="dark"] .ns-seg-card[aria-checked="true"]{background:var(--surface-2)}
.ns-seg-card-top{display:flex;align-items:center;gap:7px}
.ns-seg-card-name{font-size:13.5px;font-weight:650}
.ns-seg-card-count{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.1}
.ns-seg-card-desc{font-size:11.5px;color:var(--muted);line-height:1.35}

.ns-rule{border:1px solid var(--line);border-radius:15px;background:var(--surface);overflow:hidden;margin-bottom:8px}
.ns-rule-head{display:flex;align-items:center;gap:7px;padding:9px 11px;background:var(--surface-soft);border-bottom:1px solid var(--line);font-size:12px;font-weight:650}
.ns-rule-head .ns-rule-join{margin-inline-start:auto;font-size:11px;padding:2px 8px;border-radius:var(--radius-pill);background:var(--mint);color:var(--brand-deep);font-weight:700}
:root[data-theme="dark"] .ns-rule-head .ns-rule-join{color:var(--brand)}
.ns-rule-body{padding:10px 11px;display:flex;flex-direction:column;gap:9px}
.ns-rule-cond{display:grid;grid-template-columns:1fr;gap:8px;align-items:center}
@media (min-width:560px){.ns-rule-cond{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1.1fr) 36px}}
.ns-rule-cond .ns-select,.ns-rule-cond .ns-input{min-height:42px;padding:9px 12px;font-size:13.5px;border-radius:11px}
.ns-rule-del{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted);border:1px solid var(--line);justify-self:end}
.ns-rule-del:hover{color:var(--danger);border-color:var(--danger);background:var(--danger-bg)}
.ns-rule-foot{display:flex;gap:7px;flex-wrap:wrap;padding:9px 11px;border-top:1px solid var(--line);background:var(--surface-soft)}
.ns-group{border:1px dashed var(--line-strong);border-radius:15px;padding:10px;margin:8px 0}
.ns-group-head{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:650;color:var(--sub);margin-bottom:8px}

/* ============================================================
   10. CAMPAIGN TIMELINE
   ============================================================ */
.ns-camp-grid{display:grid;gap:14px;align-items:start}
@media (min-width:1024px){.ns-camp-grid{grid-template-columns:minmax(0,1fr) minmax(320px,400px)}}
.ns-nodes{display:flex;flex-direction:column;position:relative}
.ns-node{display:flex;gap:12px;padding:0 0 14px;position:relative}
.ns-node:not(:last-child)::before{content:"";position:absolute;inset-inline-start:15px;top:34px;bottom:0;width:2px;background:linear-gradient(var(--brand),var(--line))}
.ns-node-day{width:30px;height:30px;border-radius:10px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-size:11px;font-weight:750;flex:0 0 32px;position:relative;z-index:1;line-height:1}
.ns-node.is-draft .ns-node-day{background:var(--surface-soft);color:var(--sub);border:1.5px dashed var(--line-strong)}
.ns-node-card{flex:1;min-width:0;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:11px 12px;transition:border-color .15s}
.ns-node-card:hover{border-color:var(--line-strong)}
.ns-node-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ns-node-title{font-size:13.5px;font-weight:650;letter-spacing:-.01em;flex:1;min-width:0}
.ns-node-body{font-size:12.5px;color:var(--sub);margin-top:5px;line-height:1.5}
.ns-node-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.ns-node-actions{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}

/* ============================================================
   11. TABLES / LISTS (queue, sent, templates, audience)
   ============================================================ */
.ns-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.ns-search{position:relative;flex:1;min-width:180px}
.ns-search .ns-ico{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.ns-search input{padding-inline-start:38px}
.ns-table{display:flex;flex-direction:column}
.ns-row{
  display:grid;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:center;
  grid-template-columns:1fr auto;transition:background .13s;
}
.ns-row:last-child{border-bottom:0}
.ns-row:hover{background:var(--surface-soft)}
.ns-row-main{min-width:0;display:flex;flex-direction:column;gap:4px}
.ns-row-title{font-size:13.5px;font-weight:550;letter-spacing:-.003em;line-height:1.4}
.ns-row-sub{font-size:12px;color:var(--sub);display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.ns-row-side{display:flex;flex-direction:column;align-items:flex-end;gap:5px;text-align:end}
.ns-row-reason{
  grid-column:1/-1;display:flex;gap:8px;align-items:flex-start;font-size:12.5px;background:var(--danger-bg);color:var(--danger);
  padding:9px 11px;border-radius:11px;line-height:1.45;
}
.ns-row-reason .ns-ico{flex:0 0 15px;margin-top:1.5px}
.ns-row-actions{grid-column:1/-1;display:flex;gap:7px;flex-wrap:wrap}
.ns-row-actions:empty{display:none}
@media (min-width:768px){
  .ns-row{grid-template-columns:minmax(0,1fr) 170px 150px}
  .ns-row-actions{grid-column:1/-1;justify-content:flex-end}
  .ns-row-side{align-items:flex-end}
  .ns-row-reason{grid-column:1/-1}
}
.ns-row-expand{grid-column:1/-1}
.ns-kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12.5px;padding:10px 12px;background:var(--surface-soft);border-radius:12px}
.ns-kv dt{color:var(--muted);font-weight:550}
.ns-kv dd{margin:0;color:var(--ink-2);word-break:break-word}

/* --- Template cards --- */
.ns-tpl-grid{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:640px){.ns-tpl-grid{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1200px){.ns-tpl-grid{grid-template-columns:repeat(3,1fr)}}
.ns-tpl{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:8px;transition:border-color .16s ease,box-shadow .16s ease}
.ns-tpl:hover{border-color:var(--line-strong);box-shadow:var(--shadow-soft)}
.ns-tpl-head{display:flex;align-items:flex-start;gap:8px}
.ns-tpl-name{font-size:13.5px;font-weight:650;flex:1;min-width:0;line-height:1.3}
.ns-tpl-title{font-size:13px;font-weight:600;color:var(--ink-2);line-height:1.4}
.ns-tpl-body{font-size:12.5px;color:var(--sub);line-height:1.5}
.ns-tpl-foot{display:flex;gap:7px;flex-wrap:wrap;margin-top:auto;padding-top:8px;border-top:1px solid var(--line);align-items:center}
.ns-star{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted);border:1px solid var(--line)}
.ns-star:hover{color:var(--amber);border-color:var(--amber)}
.ns-star[aria-pressed="true"]{background:var(--warn-bg);color:var(--amber);border-color:var(--amber)}

/* ============================================================
   12. ANALYTICS
   ============================================================ */
.ns-chart{width:100%;height:180px;display:block}
.ns-chart-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-top:8px}
.ns-chart-legend span{display:flex;align-items:center;gap:6px}
.ns-chart-legend i{width:10px;height:10px;border-radius:3px;display:block}
.ns-funnel{display:flex;flex-direction:column;gap:9px}
.ns-funnel-step{display:flex;align-items:center;gap:10px;font-size:12.5px}
.ns-funnel-bar{flex:1;height:26px;border-radius:9px;background:var(--surface-soft);position:relative;overflow:hidden;border:1px solid var(--line)}
.ns-funnel-bar i{position:absolute;inset-block:0;inset-inline-start:0;background:linear-gradient(90deg,var(--brand),var(--brand-deep));border-radius:9px;transition:width .5s ease}
.ns-funnel-name{flex:0 0 84px;color:var(--ink-2);font-weight:550}
.ns-funnel-val{flex:0 0 76px;text-align:end;font-weight:650;font-variant-numeric:tabular-nums}

.ns-ab{display:grid;gap:10px}
@media (min-width:640px){.ns-ab{grid-template-columns:1fr 1fr}}
.ns-ab-card{border:1px solid var(--line);border-radius:15px;padding:12px;background:var(--surface)}
.ns-ab-card.is-lead{border-color:var(--brand);background:var(--mint)}
:root[data-theme="dark"] .ns-ab-card.is-lead{background:var(--surface-2)}
.ns-ab-head{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.ns-ab-label{font-size:13px;font-weight:700;letter-spacing:.03em}
.ns-ab-metric{display:flex;justify-content:space-between;font-size:12.5px;padding:5px 0;border-bottom:1px solid var(--line)}
.ns-ab-metric:last-child{border-bottom:0}
.ns-ab-metric b{font-variant-numeric:tabular-nums}

/* ============================================================
   13. AUTOMATIONS
   ============================================================ */
.ns-flow{display:flex;flex-direction:column;gap:0;padding:12px 0}
.ns-flow-step{display:grid;grid-template-columns:auto 1fr;gap:11px;align-items:flex-start;position:relative;padding-bottom:14px}
.ns-flow-step:not(:last-child)::before{content:"";position:absolute;inset-inline-start:15px;top:32px;bottom:0;width:2px;background:var(--line-strong)}
.ns-flow-ico{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;flex:0 0 32px;position:relative;z-index:1;background:var(--surface-soft);color:var(--sub);border:1px solid var(--line)}
.ns-flow-step[data-kind="trigger"] .ns-flow-ico{background:var(--brand);color:var(--brand-ink);border-color:transparent}
.ns-flow-step[data-kind="action"] .ns-flow-ico{background:var(--mint);color:var(--brand-deep);border-color:transparent}
:root[data-theme="dark"] .ns-flow-step[data-kind="action"] .ns-flow-ico{color:var(--brand)}
.ns-flow-step[data-kind="wait"] .ns-flow-ico{background:var(--warn-bg);color:var(--amber);border-color:transparent}
.ns-flow-card{border:1px solid var(--line);border-radius:13px;background:var(--surface);padding:10px 12px;min-width:0}
.ns-flow-kind{font-size:10.5px;font-weight:750;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.ns-flow-title{font-size:13.5px;font-weight:650;margin-top:2px;line-height:1.35}
.ns-flow-sub{font-size:12px;color:var(--sub);margin-top:3px;line-height:1.45}
.ns-autos{display:flex;flex-direction:column;gap:10px}

/* ============================================================
   14. SYSTEM HEALTH
   ============================================================ */
.ns-health-grid{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:640px){.ns-health-grid{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1100px){.ns-health-grid{grid-template-columns:repeat(3,1fr)}}
.ns-health-card{border:1px solid var(--line);border-radius:15px;padding:12px 13px;background:var(--surface);display:flex;flex-direction:column;gap:9px}
.ns-health-card[data-status="degraded"]{border-color:rgba(201,138,44,.4)}
.ns-health-card[data-status="unavailable"]{border-color:rgba(179,38,30,.4)}
.ns-health-card[data-status="unknown"]{border-color:var(--line-strong)}
.ns-health-top{display:flex;align-items:center;gap:9px}
.ns-health-name{font-size:13.5px;font-weight:650;flex:1;min-width:0}
.ns-health-meta{font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;gap:3px;font-variant-numeric:tabular-nums}
.ns-health-meta strong{color:var(--ink-2);font-weight:650}
.ns-health-action{font-size:12.5px;background:var(--surface-soft);border-radius:10px;padding:8px 10px;color:var(--ink-2);line-height:1.45}
.ns-sparkline{width:100%;height:30px}

/* ============================================================
   15. AUDIT LOG
   ============================================================ */
.ns-audit{display:flex;flex-direction:column;font-size:12.5px}
.ns-audit-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:baseline}
.ns-audit-row:last-child{border-bottom:0}
.ns-audit-actor{font-weight:650;color:var(--ink-2);white-space:nowrap}
.ns-audit-act{color:var(--sub)}
.ns-audit-act b{color:var(--ink);font-weight:650}
.ns-audit-time{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
@media (max-width:520px){.ns-audit-row{grid-template-columns:1fr auto}.ns-audit-actor{display:none}}

/* ============================================================
   15b. FULL-SCREEN AI CHAT (separate ChatGPT-style surface)
   ============================================================ */
.ns-chat{
  position:fixed;inset:0;z-index:400;display:flex;flex-direction:column;background:var(--bg);
  transform:translateY(6px);opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;
}
.ns-chat.is-open{transform:none;opacity:1;pointer-events:auto}
@media (prefers-reduced-motion:reduce){.ns-chat{transition:none}}
.ns-chat-bar{
  display:flex;align-items:center;gap:10px;height:56px;padding:0 12px;flex:0 0 auto;
  background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:saturate(180%) blur(14px);
  -webkit-backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--line);position:relative;z-index:2;
}
.ns-chat-bar .ns-brand-mark{width:30px;height:30px;border-radius:9px;flex:0 0 30px}
.ns-chat-bar-title{font-size:14.5px;font-weight:650;letter-spacing:-.01em;display:flex;flex-direction:column;line-height:1.15;min-width:0;flex:1 1 auto;overflow:hidden}
.ns-chat-bar-title .ns-chat-title-main,.ns-chat-bar-title>span:not(.ns-topbar-spacer){white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ns-chat-bar-title span{font-size:11.5px;font-weight:450;color:var(--sub)}
.ns-chat-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.ns-chat-inner{width:100%;max-width:760px;margin:0 auto;padding:22px 16px 26px}
.ns-chat-empty{padding:6vh 0 4vh;text-align:center}
.ns-chat-empty .ns-brand-mark{width:52px;height:52px;border-radius:16px;margin:0 auto 16px;flex:0 0 52px}
.ns-chat-empty h2{font-family:var(--font-serif);font-size:24px;font-weight:600;letter-spacing:-.02em}
.ns-chat-empty p{font-size:13.5px;color:var(--sub);margin-top:7px}
.ns-chat-starters{display:grid;gap:8px;margin-top:22px;text-align:start}
@media (min-width:560px){.ns-chat-starters{grid-template-columns:1fr 1fr}}
.ns-starter{
  display:flex;align-items:flex-start;gap:10px;padding:12px 13px;border:1px solid var(--line);border-radius:14px;
  background:var(--surface);text-align:start;min-height:52px;transition:border-color .15s,box-shadow .15s,background .15s;
}
.ns-starter:hover{border-color:var(--brand);box-shadow:var(--shadow);background:var(--surface-2)}
.ns-starter .ns-ico{color:var(--brand);flex:0 0 18px;margin-top:1px}
.ns-starter b{display:block;font-size:13.5px;font-weight:600;letter-spacing:-.005em}
.ns-starter span{font-size:12px;color:var(--sub);line-height:1.45}

/* --- messages --- */
.ns-msg{display:flex;gap:12px;padding:14px 0;animation:ns-msg-in .22s ease both}
@keyframes ns-msg-in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.ns-msg{animation:none}}
.ns-msg-who{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:0 0 30px;font-size:11px;font-weight:700}
.ns-msg-user .ns-msg-who{background:var(--surface-soft);border:1px solid var(--line);color:var(--sub)}
.ns-msg-ai .ns-msg-who{background:var(--brand);color:var(--brand-ink)}
.ns-msg-body{flex:1;min-width:0;padding-top:3px}
.ns-msg-user .ns-msg-body{color:var(--ink)}
.ns-msg-text{font-size:15px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.ns-msg-meta{font-size:11.5px;color:var(--muted);margin-top:7px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ns-msg-typing{display:inline-flex;gap:4px;align-items:center;height:22px}
.ns-msg-typing i{width:6px;height:6px;border-radius:50%;background:var(--brand);opacity:.4;animation:ns-type 1.2s ease-in-out infinite}
.ns-msg-typing i:nth-child(2){animation-delay:.15s}
.ns-msg-typing i:nth-child(3){animation-delay:.3s}
@keyframes ns-type{0%,60%,100%{opacity:.28;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.ns-msg-typing i{animation:none;opacity:.6}}

/* --- plan card inside a message --- */
.ns-chat-plan{border:1px solid var(--line);border-radius:15px;overflow:hidden;background:var(--surface);margin-top:11px}
.ns-chat-plan-head{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--surface-soft);border-bottom:1px solid var(--line);font-size:12px;font-weight:650}
.ns-chat-plan-head .ns-badge{margin-inline-start:auto}
.ns-chat-plan .ns-ai-steps{padding:7px 12px 10px}

/* --- result / summary card --- */
.ns-chat-card{border:1px solid var(--line);border-radius:15px;background:var(--surface);overflow:hidden;margin-top:11px}
.ns-chat-card-rows{display:flex;flex-direction:column;padding:4px 12px}
.ns-chat-row{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.ns-chat-row:last-child{border-bottom:0}
.ns-chat-row .ns-chat-k{flex:0 0 96px;color:var(--muted);font-size:12px}
.ns-chat-row .ns-chat-v{flex:1;min-width:0;font-weight:550;word-break:break-word}
.ns-chat-actions{display:flex;gap:8px;flex-wrap:wrap;padding:11px 12px;border-top:1px solid var(--line);background:var(--surface-soft)}

/* --- composer --- */
.ns-chat-dock{flex:0 0 auto;padding:10px 16px calc(12px + env(safe-area-inset-bottom));background:var(--bg)}
.ns-chat-dock-inner{max-width:760px;margin:0 auto}
.ns-chat-input{
  display:flex;align-items:flex-end;gap:8px;border:1px solid var(--line-strong);border-radius:22px;
  background:var(--surface);padding:7px 7px 7px 16px;box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s;
}
.ns-chat-input:focus-within{border-color:var(--brand);box-shadow:0 0 0 3.5px var(--ok-bg)}
.ns-chat-input textarea{
  flex:1;min-width:0;border:0;background:none;resize:none;font-size:16px;line-height:1.5;
  max-height:170px;height:40px;min-height:40px;padding:8px 0;outline:none;font-family:inherit;color:var(--ink);
  white-space:nowrap;overflow-x:auto;overflow-y:hidden;
}
.ns-chat-input textarea::placeholder{color:var(--muted);text-overflow:ellipsis;overflow:hidden;white-space:nowrap}
.ns-chat-send{width:40px;height:40px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;flex:0 0 40px;transition:background .15s,transform .1s}
.ns-chat-send:hover{background:var(--brand-deep)}
.ns-chat-send:active{transform:scale(.94)}
.ns-chat-send[disabled]{opacity:.4;cursor:not-allowed}
.ns-chat-dock-note{font-size:11px;color:var(--muted);text-align:center;margin-top:8px;display:flex;gap:6px;align-items:center;justify-content:center}
.ns-chat-dock-note .ns-ico{flex:0 0 13px}
@media (min-width:768px){.ns-chat-inner{padding:28px 24px 30px}.ns-chat-dock{padding-bottom:16px}}
@media (max-width:520px){
  .ns-chat-bar{gap:8px;padding:0 8px}
  .ns-chat-bar .ns-badge{display:none}
  .ns-chat-bar-title>span:not(.ns-chat-title-main){display:none}
}

/* ============================================================
   16. SHEETS / MODALS
   ============================================================ */
.ns-scrim{position:fixed;inset:0;background:var(--scrim);z-index:150;animation:ns-scrim-in .2s ease both;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
@keyframes ns-scrim-in{from{opacity:0}to{opacity:1}}
.ns-sheet{
  position:fixed;inset-inline:0;bottom:0;z-index:151;background:var(--surface);
  border-radius:22px 22px 0 0;box-shadow:var(--shadow-soft);display:flex;flex-direction:column;
  max-height:min(88dvh,760px);padding-bottom:calc(env(safe-area-inset-bottom) + 8px);
  animation:ns-sheet-in .3s cubic-bezier(.2,.9,.3,1) both;
}
@keyframes ns-sheet-in{from{transform:translateY(102%)}to{transform:none}}
.ns-sheet-grab{width:38px;height:4.5px;border-radius:3px;background:var(--line-strong);margin:9px auto 2px;flex:0 0 auto;cursor:grab;touch-action:none}
.ns-sheet-head{display:flex;align-items:center;gap:10px;padding:10px 16px 12px;border-bottom:1px solid var(--line);flex:0 0 auto}
.ns-sheet-head h2{font-size:15.5px;font-weight:700;letter-spacing:-.01em;flex:1;min-width:0}
.ns-sheet-body{padding:16px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;min-height:0}
.ns-sheet-foot{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;flex-direction:column;flex:0 0 auto;background:var(--surface)}
.ns-sheet-foot .ns-btn{width:100%}
@media (min-width:640px){
  .ns-sheet{
    inset:50% auto auto 50%;transform:translate(-50%,-50%);width:min(560px,92vw);border-radius:22px;
    max-height:min(84dvh,780px);animation:ns-modal-in .24s cubic-bezier(.2,.9,.3,1) both;
  }
  .ns-sheet-wide{width:min(760px,94vw)}
  .ns-sheet-grab{display:none}
  .ns-sheet-foot{flex-direction:row-reverse}
  .ns-sheet-foot .ns-btn{width:auto;flex:1}
  @keyframes ns-modal-in{from{opacity:0;transform:translate(-50%,-46%) scale(.97)}to{opacity:1;transform:translate(-50%,-50%)}}
}
@media (prefers-reduced-motion:reduce){.ns-sheet{animation:none}}
.ns-sheet-body > :last-child{margin-bottom:2px}

/* --- Review summary blocks inside approval sheet --- */
.ns-review{display:flex;flex-direction:column;gap:12px}
.ns-review-block{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface-2)}
.ns-review-block h3{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
.ns-review-title{font-size:14.5px;font-weight:650;line-height:1.4}
.ns-review-body{font-size:13.5px;color:var(--sub);line-height:1.6;margin-top:5px;white-space:pre-wrap}
.ns-review-img{height:96px;border-radius:11px;background-size:cover;background-position:center;margin-top:9px;border:1px solid var(--line)}
.ns-chipset{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

/* --- Auth gate --- */
.ns-gate-page{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;background:var(--surface-soft)}
.ns-gate-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow-soft);padding:26px 22px}
.ns-gate-brand{display:flex;align-items:center;gap:11px;margin-bottom:20px}
.ns-gate-card h1{font-family:var(--font-serif);font-size:21px;font-weight:700;letter-spacing:-.015em}
.ns-gate-card .ns-lead{font-size:13.5px;color:var(--sub);margin-top:5px;line-height:1.5}
.ns-gate-token{font-family:var(--mono);letter-spacing:.06em}
.ns-gate-foot{font-size:11.5px;color:var(--muted);margin-top:14px;line-height:1.5;display:flex;gap:7px;align-items:flex-start}
.ns-token-row{display:flex;gap:8px;align-items:stretch}
.ns-token-row .ns-input{flex:1}
.ns-token-row .ns-btn{flex:0 0 auto}

/* ============================================================
   17. MISC UTILITIES
   ============================================================ */
.ns-grid-2{display:grid;gap:12px}
@media (min-width:640px){.ns-grid-2{grid-template-columns:1fr 1fr}}
.ns-grid-3{display:grid;gap:12px}
@media (min-width:640px){.ns-grid-3{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1024px){.ns-grid-3{grid-template-columns:repeat(3,1fr)}}
.ns-stack{display:flex;flex-direction:column;gap:12px}
.ns-stack-sm{display:flex;flex-direction:column;gap:8px}
.ns-inline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ns-inline-between{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.ns-mt-auto{margin-top:auto}
.ns-hide-sm{display:none}
@media (min-width:768px){.ns-hide-sm{display:inline-flex}}
.ns-only-sm{display:inline-flex}
@media (min-width:768px){.ns-only-sm{display:none}}
/* The compose action bar sits in the normal document flow at the end of the
 * compose column: it is reached by scrolling to the bottom of the form and is
 * never overlaid on top of content. (It used to be position:fixed, which kept
 * Draft/Test/Review floating over the page while the user read the form.) */
.ns-sticky-actions{
  position:static;display:flex;gap:8px;padding:12px 0 4px;margin-top:16px;
  border-top:1px solid var(--line);flex-wrap:wrap;
}
.ns-sticky-actions .ns-btn{flex:1;min-width:130px}
@media (min-width:1024px){.ns-sticky-actions .ns-btn{flex:0 1 auto}}
.ns-var-chip{font-family:var(--mono);font-size:12px;padding:10px 9px;border-radius:9px;display:inline-flex;align-items:center;min-height:40px;background:var(--surface-soft);border:1px solid var(--line);color:var(--ink-2);cursor:pointer;transition:background .14s,border-color .14s}
.ns-var-chip:hover{background:var(--mint);border-color:var(--brand);color:var(--brand-deep)}
.ns-var-chip.is-bad{border-color:var(--danger);color:var(--danger);background:var(--danger-bg)}
.ns-countdown{font-variant-numeric:tabular-nums;font-weight:650;font-family:var(--mono);font-size:12px}
.ns-sim{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:750;letter-spacing:.07em;text-transform:uppercase;color:var(--amber);background:var(--warn-bg);padding:3px 8px;border-radius:var(--radius-pill)}
.ns-fab{
  position:fixed;inset-inline-end:14px;bottom:calc(var(--tabbar-h) + 78px + env(safe-area-inset-bottom));z-index:44;
  width:54px;height:54px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;
  box-shadow:0 10px 26px rgba(15,107,79,.34);
}
.ns-fab:hover{background:var(--brand-deep)}
@media (min-width:1024px){.ns-fab{display:none}}

function fmtDateTime(d){
  const d0=asDate(d);
  if(!d0) return t('none');
  const dt=d0;
  const p=n=>String(n).padStart(2,'0');
  const yy=dt.getFullYear(),mm=p(dt.getMonth()+1),dd=p(dt.getDate()),hh=p(dt.getHours()),mi=p(dt.getMinutes());
  return LANG==='bn' ? (dd+'/'+mm+'/'+yy+' · '+hh+':'+mi) : (yy+'-'+mm+'-'+dd+' '+hh+':'+mi);
}
function fmtDateShort(d){
  const dt=asDate(d);
  if(!dt) return t('none');
  const p=n=>String(n).padStart(2,'0');
  return p(dt.getDate())+'/'+p(dt.getMonth()+1)+'/'+String(dt.getFullYear()).slice(2);
}
function fmtDayName(d){
  const dd=asDate(d)||new Date();
  const bn=['রবি','সোম','মঙ্গল','বুধ','বৃহঃ','শুক্র','শনি'];
  const en=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  return (LANG==='bn'?bn:en)[dd.getDay()];
}
function fmtNum(n){
  if(n==null||n==='') return t('none');
  return new Intl.NumberFormat(LANG==='bn'?'bn-BD':'en-US').format(n);
}
function asDate(d){ if(d instanceof Date) return d; if(typeof d==='number') return new Date(d); if(typeof d==='string'){ const p=new Date(d); if(!isNaN(p.getTime())) return p; } return null; }
function relTime(d){
  const dd=asDate(d); if(!dd) return t('none');
  const diff=(dd.getTime()-Date.now())/60000;
  const a=Math.abs(diff);
  if(a<60){ const m=Math.max(1,Math.round(a)); return diff<0? m+' '+t('ago_min') : t('in_min')+' '+m; }
  if(a<1440){ const h=Math.round(a/60); return diff<0? h+' '+t('ago_hour') : t('in_hour')+' '+h; }
  const dys=Math.round(a/1440); return diff<0? dys+' '+t('ago_day') : t('in_day')+' '+dys;
}
function clockTime(d){
  const dd=asDate(d)||new Date();
  const p=n=>String(n).padStart(2,'0');
  return p(dd.getHours())+':'+p(dd.getMinutes());
}

/* ============================================================

   ============================================================ */
function applyLang(lang){
  LANG = lang==='en'?'en':'bn';
  state.lang=LANG;
  document.documentElement.setAttribute('lang',LANG);
  document.documentElement.setAttribute('data-lang',LANG);
  try{ localStorage.setItem('ns_lang',LANG); }catch(e){}
  refreshTexts();
  render();
  const root=document.getElementById('nsRoot');
  if(root) root.setAttribute('lang',LANG);
}
function applyTheme(theme){
  const allowed=['light','dark','pink','green'];
  THEME = allowed.includes(theme)?theme:'light';
  state.theme=THEME;
  document.documentElement.setAttribute('data-theme',THEME);
  try{ localStorage.setItem('ns_theme',THEME); }catch(e){}
  renderTopbarInto();
}
function refreshTexts(){
  document.querySelectorAll('[data-bn],[data-en]').forEach(el=>{
    const v = LANG==='en'?el.getAttribute('data-en'):el.getAttribute('data-bn');
    if(v!=null && !el.hasAttribute('data-keep')) el.textContent=v;
  });
  document.querySelectorAll('[data-ph-bn],[data-ph-en]').forEach(el=>{
    const v = LANG==='en'?el.getAttribute('data-ph-en'):el.getAttribute('data-ph-bn');
    if(v!=null) el.setAttribute('placeholder',v);
  });
  document.querySelectorAll('[data-aria-bn],[data-aria-en]').forEach(el=>{
    const v = LANG==='en'?el.getAttribute('data-aria-en'):el.getAttribute('data-aria-bn');
    if(v!=null) el.setAttribute('aria-label',v);
  });
  const title=document.querySelector('title');
  if(title) title.textContent=t('appName')+' · '+t('appSub');
}

function navBadge(tab){
  if(tab==='queue') return '<span class="ns-navbadge'+(state.queue.length?'':' is-warn')+'">'+fmtNum(state.queue.length)+'</span>';
  if(tab==='sent'){ const f=state.sent.filter(x=>x.status==='failed').length; return f?'<span class="ns-navbadge is-warn">'+fmtNum(f)+'</span>':''; }

  if(tab==='health'){ const bad=state.systemHealth.filter(x=>x.status!=='healthy').length; return bad?'<span class="ns-navbadge is-warn">'+fmtNum(bad)+'</span>':''; }

function healthSummary(){
  const bad=state.systemHealth.filter(x=>x.status!=='healthy');
  if(state.offline) return {dot:'bad',text:{bn:"ডেলিভারি অফলাইন",en:"Delivery offline"}};
  if(bad.some(x=>x.status==='unavailable')) return {dot:'bad',text:{bn:"একটি সেবা অনুপলব্ধ",en:"1 service unavailable"}};
  if(bad.length) return {dot:'warn',text:{bn:"একটি সেবা ধীর",en:"1 service slow"}};
  return {dot:'ok',text:{bn:"সব সিস্টেম স্বাভাবিক",en:"All systems healthy"}};
}

    desc:{bn:pick(failed[0].reason),en:pick(failed[0].reason)},cta:{tab:'sent',label:'nav_sent'}});
  const degraded=state.systemHealth.filter(x=>x.status==='degraded');
  if(degraded.length) out.push({tone:'warn',icon:'pulse',title:{bn:pick(degraded[0].name)+' ধীর',en:pick(degraded[0].name)+' is slow'},
    desc:pick(degraded[0].action),cta:{tab:'health',label:'nav_health'}});
  const unavailable=state.systemHealth.filter(x=>x.status==='unavailable');
  if(unavailable.length) out.push({tone:'danger',icon:'xCircle',title:{bn:pick(unavailable[0].name)+' অনুপলব্ধ',en:pick(unavailable[0].name)+' unavailable'},

  const paused=state.campaigns.filter(x=>x.status==='paused');
  if(paused.length) out.push({tone:'warn',icon:'pause',title:{bn:'ক্যাম্পেইন পজ করা: '+pick(paused[0].name),en:'Campaign paused: '+pick(paused[0].name)},
