/* ============================================================
   REACH ESTIMATION (local simulation)
   ============================================================ */
function fmtRuleValue(r){
  if(r.field==='streak') return fmtNum(r.value||0);
  const vals=fieldValues(r.field);
  const found=vals.filter(v=>String(v.v)===String(r.value));
  if(found.length) return found[0].l;
  if(r.field==='level') return segName(r.value);
  return r.value||t('none');
}
function estimateReach(){
  const c=state.compose;
  let base=null;
  if(c.rulesApplied && c.rules.conditions.length){
    base = estimateFromRules(c);
  } else if(c.segmentId){
    const s=segOf(c.segmentId);
    base = s? s.count : null;
  } else {
    base = (state.analytics||SAMPLE_DATA.analytics).reach.estimated || null;
  }
  if(base==null) return null;
  let suppress=0;
  if(c.suppressed.bounced) suppress+=Math.round(base*0.011);
  if(c.suppressed.unsubscribed) suppress+=Math.round(base*0.023);
  if(c.suppressed.recent48) suppress+=Math.round(base*0.052);
  return {gross:base, suppression:suppress, net:Math.max(1,base-suppress)};
}
function estimateFromRules(c){
  const a=(state.analytics||SAMPLE_DATA.analytics);
  const est=a.reach.estimated||0;
  const conds=c.rules.conditions.filter(r=>r.value!==''&&r.value!=null);
  if(!conds.length) return est||null;
  if(!est) return null;
  const perCond=conds.map(r=>{
    if(r.field==='university'){
      const u=(state.analytics||SAMPLE_DATA.analytics).breakdownUniversity.find(x=>x.en===r.value||x.bn===r.value);
      return u?u.n:Math.round(est*0.2);
    }
    if(r.field==='course'){
      const cor=(state.analytics||SAMPLE_DATA.analytics).breakdownCourse.find(x=>x.en===String(r.value).replace(/^./,m=>m.toUpperCase())||x.bn===r.value);
      return cor?cor.n:Math.round(est*0.18);
    }
    if(r.field==='unit') return Math.round(est*(r.value==='A'?0.34:r.value==='B'?0.31:0.22));
    if(r.field==='activity') return Math.round(est*(r.value==='active7'?0.41:r.value==='inactive14'?0.19:r.value==='new'?0.28:0.22));
    if(r.field==='level') return Math.round(est*0.3);
    if(r.field==='subscription') return Math.round(est*(r.value==='active'?0.23:0.77));
    if(r.field==='engagement') return Math.round(est*(r.value==='high'?0.27:r.value==='medium'?0.34:0.18));
    if(r.field==='group') return Math.round(est*0.33);
    if(r.field==='streak') return Math.round(est*(Number(r.value)>6?0.22:0.35));
    return Math.round(est*0.5);
  });
  if(c.rules.match==='all'){
    let v=perCond.slice().sort((a,b)=>a-b)[0];
    for(let i=1;i<perCond.length;i++) v=Math.round(v*(perCond[i]/est)*1.25);
    return Math.max(12,Math.min(v,est));
  }
  return Math.min(est,perCond.reduce((s,x)=>s+x,0));
}
function personaFor(sample){
  return sample||'bn';
}
function personalized(text,sampleLang){
  let out=text;
  const missing=[];
  out=out.replace(/\{\{\s*([a-zA-Z_]+)\s*\}\}/g,(m,key)=>{
    const v=SAMPLE_DATA.variables.find(x=>x.key===key);
    if(!v){ missing.push(key); return m; }
    return pick(v.sample);
  });
  return {text:out,missing:missing};
}
function extractVars(text){
  const out=[]; const re=/\{\{\s*([a-zA-Z_]+)\s*\}\}/g; let m;
  while((m=re.exec(text))) out.push(m[1]);
  return out.filter((v,i,a)=>a.indexOf(v)===i);
}

/* ============================================================
   VALIDATION ENGINE
   ============================================================ */
function validateConfiguration(){
  const c=state.compose;
  const L=c.lang;
  const title=(c[L].title||'').trim();
  const body=(c[L].body||'').trim();
  const other=L==='bn'?'en':'bn';
  const checks=[];
  const blockers=[]; const warnings=[];

  function add(kind,key,status,text,fix){
    checks.push({key:key,status:status,text:text,fix:fix});
    if(status==='bad') blockers.push(key);
    if(status==='warn') warnings.push(key);
  }

  const hasAudience=!!(c.segmentId||(c.rulesApplied&&c.rules.conditions.some(r=>r.value)));
  add('audience','audience',hasAudience?'ok':'bad',hasAudience?(segName(c.segmentId)||rulesSummary()):t('val_audience_empty'),hasAudience?null:{action:'expand-step',step:'audience'});

  add('title','title',title?(title.length>65?'warn':'ok'):'bad',
    !title?t('val_title_required'):(title.length>65?t('val_title_long'):t('f_title')+', '+fmtNum(title.length)+'/'+'65'),
    !title?{action:'focus-field',field:'title'}:null);

  add('body','body',!body?'bad':(body.length<12?'warn':'ok'),
    !body?t('val_body_required'):(body.length<12?t('val_body_short'):t('f_body')),
    !body?{action:'focus-field',field:'body'}:null);

  const urlStatus=!c.targetUrl?'pending':(isValidTarget(c.targetUrl)?'ok':'bad');
  const urlText=!c.targetUrl?t('val_url_missing'):(isValidTarget(c.targetUrl)?t('val_url_ok'):t('val_url_invalid'));
  add('url','url',urlStatus,urlText,urlStatus==='bad'?{action:'focus-field',field:'targetUrl'}:null);

  const vars=extractVars(title).concat(extractVars(body));
  const unknown=vars.filter(v=>!SAMPLE_DATA.variables.some(x=>x.key===v));
  if(unknown.length){
    add('vars','vars','bad',t('val_vars_bad',{list:unknown.map(u=>'{{'+u+'}}').join(', ')}),{action:'clear-unknown-vars'});
  } else if(vars.includes('exam_date')){
    const who=(estimateReach()||{}).net||0;
    const affected=Math.max(1,Math.round(who*0.06));
    add('vars','vars','warn',t('val_vars_partial',{n:fmtNum(affected)}),{action:'goto',tab:'audience'});
  } else {
    add('vars','vars','ok',t('val_vars_ok'),null);
  }

  const reach=estimateReach();
  const _q=(state.quota||SAMPLE_DATA.quota); const remaining=_q.dailyCap-_q.used;
  if(reach && reach.net>remaining){
    add('quota','quota','warn',t('val_quota_low')+' ('+fmtNum(reach.net)+' > '+fmtNum(remaining)+')',{action:'goto',tab:'compose'});
  } else {
    add('quota','quota','ok',t('val_quota_ok'),null);
  }

  const dup=state.sent.find(x=>pick(x.title).toLowerCase()===title.toLowerCase()&&title.length>6);
  add('duplicate','duplicate',dup?'warn':'ok',dup?t('val_duplicate'):t('val_pass'),dup?{action:'goto',tab:'sent'}:null);

  if(c.schedule.mode==='later'){
    const when=c.schedule.when?new Date(c.schedule.when):null;
    if(!when||isNaN(when.getTime())){
      add('schedule','schedule','bad',t('val_schedule_past'),{action:'expand-step',step:'schedule'});
    } else if(when.getTime()<=Date.now()){
      add('schedule','schedule','bad',t('val_schedule_past')+', '+t('val_schedule_fix'),{action:'focus-field',field:'when'});
    } else {
      const conflict=findConflict(when);
      add('schedule','schedule',conflict?'warn':'ok',conflict?t('val_conflict'):t('val_schedule_ok'),conflict?{action:'goto',tab:'queue'}:null);
    }
  } else {
    add('schedule','schedule','ok',t('val_no_schedule'),null);
  }

  const smsChosen=c.channels.includes('sms');
  add('channel','channel',(!c.channels.length||smsChosen)?'bad':'ok',(!c.channels.length)?t('val_channel_bad'):(smsChosen?t('val_channel_bad'):t('val_channel_ok')),(!c.channels.length||smsChosen)?{action:'expand-step',step:'channel'}:null);

  const otherLang=(c[other].title||'').trim();
  add('translation','translation',otherLang?'ok':'warn',otherLang?t('val_pass'):t('val_translation'),otherLang?null:{action:'set-content-lang-other'});

  add('attachment','attachment',c.imageUrl&&!isValidUrl(c.imageUrl)?'bad':'ok',c.imageUrl&&!isValidUrl(c.imageUrl)?t('val_attachment_big'):t('val_attachment_ok'),null);
  add('frequency','frequency',c.frequencyCap<3?'warn':'ok',c.frequencyCap<3?t('val_frequency'):t('f_frequency')+' ≤ '+fmtNum(c.frequencyCap),null);
  add('overlap','overlap','warn',t('aud_overlap_warn'),{action:'goto',tab:'audience'});
  add('permission','permission','ok',t('val_permission'),null);
  add('approval','approval',state.approval==='approved'?'ok':'pending',state.approval==='approved'?t('val_approval_ok'):t('val_approval_pending'),null);

  return {checks:checks,blockers:blockers.length,warnings:warnings.length,blockerKeys:blockers,warningKeys:warnings};
}
function isValidUrl(u){
  if(!u) return false;
  if(/^admissionhub:\/\/[a-z0-9][a-z0-9\-\/_.?=&%]*$/i.test(u)) return true;
  try{ const p=new URL(u); return p.protocol==='https:'||p.protocol==='http:'; }catch(e){ return false; }
}
/* Upload a picked image to the Worker and put the returned https URL on the
 * draft. The Worker stores it in R2 and serves it from /api/files/<key>, so
 * FCM gets a stable same-origin image URL (no third-party host, no egress). */
function uploadNotificationImage(file){
  if(!file) return;
  const hint=document.getElementById('nsImgHint');
  const ext=(String(file.name||'').split('.').pop()||'').toLowerCase();
  const okExt={png:1,jpg:1,jpeg:1,webp:1};
  if(!okExt[ext]){ toast(t('img_upload_failed'),'warn',t('f_image_upload_hint')); return; }
  if(file.size>4*1024*1024){ toast(t('img_too_large'),'warn'); return; }
  if(hint){ hint.textContent=t('img_uploading'); }
  const btn=document.getElementById('nsImgPick');
  if(btn) btn.disabled=true;
  const done=(msgTone)=>{ if(btn) btn.disabled=false; if(hint) hint.textContent=t(msgTone); };
  file.arrayBuffer().then(function(buf){
    return apiFetch('/api/notifications/global/image',{
      method:'POST',
      headers:{ 'Content-Type':'application/octet-stream', 'X-File-Ext':ext, 'Content-Length':String(buf.byteLength) },
      body:buf
    });
  }).then(function(out){
    if(out.ok && out.data && out.data.url){
      state.compose.imageUrl=out.data.url; state.compose.dirty=true;
      done('f_image_upload_hint');
      toast(t('img_uploaded'),'ok');
      partialRefresh();
    } else {
      done('f_image_upload_hint');
      toast(t('img_upload_failed'),'warn',(out.data&&out.data.error)||('http '+out.status));
    }
  }).catch(function(e){ done('f_image_upload_hint'); toast(t('img_upload_failed'),'warn',String(e&&e.message||e).slice(0,120)); });
}
function isValidTarget(u){
  if(!u) return false;
  if(/^admissionhub:\/\//i.test(u)) return /^admissionhub:\/\/[a-z0-9\-]+(\/[a-z0-9\-_./?=&%]*)?$/i.test(u) && !/nov-10.*ref=push/i.test(u);
  return isValidUrl(u);
}
function findConflict(when){
  const w=when.getTime();
  return state.queue.some(q=>Math.abs(new Date(q.scheduledFor).getTime()-w) < 30*60000);
}

function ruleRowHTML(r,i){
  const fields=['university','unit','course','level','group','activity','subscription','engagement','streak'];
  const vals=fieldValues(r.field);
  const valueInput = r.field==='streak'
    ? '<input class="ns-input" type="number" min="0" data-rule-value="'+i+'" value="'+esc(r.value)+'">'
    : '<select class="ns-select" data-rule-value="'+i+'">'+
      '<option value="">'+esc(t('aud_select'))+'</option>'+
      vals.map(v=>'<option value="'+esc(v.v)+'"'+(String(r.value)===String(v.v)?' selected':'')+'>'+esc(v.l)+'</option>').join('')+
      '</select>';
  return '<div class="ns-rule-cond">'+
    '<select class="ns-select" data-rule-field="'+i+'" data-aria-bn="'+esc(t('aud_rule'))+'" aria-label="'+esc(t('aud_rule'))+'">'+
      fields.map(f=>'<option value="'+f+'"'+(r.field===f?' selected':'')+'>'+esc(fieldLabel(f))+'</option>').join('')+'</select>'+
    '<select class="ns-select" data-rule-op="'+i+'" data-aria-bn="'+esc(t('aud_rule'))+'" aria-label="'+esc(t('aud_rule'))+'">'+
      SAMPLE_DATA.operators.filter(o=>r.field==='streak'?['eq','neq','gt','lt'].includes(o.key):['eq','neq','in'].includes(o.key)).map(o=>'<option value="'+o.key+'"'+(r.op===o.key?' selected':'')+'>'+esc(LANG==='en'?o.en:o.bn)+'</option>').join('')+'</select>'+
    valueInput+
    '<button class="ns-rule-del" data-action="del-condition" data-i="'+i+'" data-aria-bn="'+esc(t('remove'))+'" data-aria-en="Remove" aria-label="'+esc(t('remove'))+'">'+ic('minus',15)+'</button>'+

function nestedGroupHTML(g,gi){
  return '<div class="ns-group"><div class="ns-group-head">'+ic('layers',14)+esc(t('aud_add_group'))+' · '+(g.match==='all'?'AND':'OR')+
    '<button class="ns-rule-del" style="margin-inline-start:auto" data-action="del-group" data-i="'+gi+'" data-aria-bn="'+esc(t('remove'))+'" data-aria-en="Remove" aria-label="'+esc(t('remove'))+'">'+ic('minus',15)+'</button></div>'+
    g.conditions.map((r,i)=>'<div style="margin-bottom:8px">'+ruleRowHTML(r,'g'+gi+'-'+i)+'</div>').join('')+
    '<button class="ns-btn ns-btn-ghost ns-btn-sm" data-action="add-group-condition" data-i="'+gi+'">'+ic('plus',15)+esc(t('aud_add_cond'))+'</button></div>';
}
function donutSVG(bands){
  const total=bands.reduce((s,x)=>s+x.n,0);
  const r=36,circ=2*Math.PI*r;
  let acc=0;
  const segs=bands.map(b=>{
    const frac=b.n/total, len=circ*frac, off=circ*acc;
    acc+=frac;
    return '<circle cx="46" cy="46" r="'+r+'" fill="none" stroke="'+b.color+'" stroke-width="15" stroke-dasharray="'+(len-2)+' '+(circ-len+2)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 46 46)"/>';
  }).join('');
  return '<svg viewBox="0 0 92 92" width="92" height="92" role="img" aria-label="'+esc(t('aud_breakdown_engage'))+'"><circle cx="46" cy="46" r="'+r+'" fill="none" stroke="var(--line)" stroke-width="15"/>'+segs+'</svg>';
}

function barChartSVG(series,max){
  const w=560,h=180,pad=26,bw=(w-pad*2)/series.length;
  const bars=series.map((s,i)=>{
    const x=pad+i*bw;
    const hs=Math.round(s.sent/max*(h-pad*2));
    const ho=Math.round(s.opened/max*(h-pad*2));
    const hc=Math.round(s.clicked/max*(h-pad*2));
    const cx=x+bw*0.18, cw=bw*0.20;
    return '<rect x="'+cx+'" y="'+(h-pad-hs)+'" width="'+cw+'" height="'+Math.max(2,hs)+'" rx="3" fill="var(--brand)"/>'+
      '<rect x="'+(cx+cw+3)+'" y="'+(h-pad-ho)+'" width="'+cw+'" height="'+Math.max(2,ho)+'" rx="3" fill="var(--blue)"/>'+
      '<rect x="'+(cx+(cw+3)*2)+'" y="'+(h-pad-hc)+'" width="'+cw+'" height="'+Math.max(2,hc)+'" rx="3" fill="var(--coral)"/>';
  }).join('');
  const labels=series.map((s,i)=>'<text x="'+(pad+i*bw+bw/2)+'" y="'+(h-6)+'" text-anchor="middle" font-size="9.5" fill="var(--muted)">'+esc(fmtDateShort(new Date(NOW.getTime()-s.d*864e5)))+'</text>').join('');
  return '<svg class="ns-chart" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" role="img" aria-label="'+esc(t('a_hist'))+'">'+

function render(){

  if(!root.querySelector('.ns-app')){
    root.innerHTML=shellHTML();
  }
  document.getElementById('nsSidebarNav').innerHTML=sidebarNavHTML();
  document.getElementById('nsSidebarFoot').innerHTML=sidebarFootHTML();
  document.getElementById('nsMobileNav').innerHTML=mobileNavHTML();
  document.getElementById('nsOfflineSlot').innerHTML=offlineStripHTML();

  view.innerHTML=viewHTMLFor(state.tab);
  view.setAttribute('aria-label',t(TAB_TITLES[state.tab]||'nav_overview'));
  refreshTexts();
  syncComposeInputs();
}
function syncComposeInputs(){
  if(state.tab!=='compose') return;
  const numEl=document.getElementById('nsTitleCount');
  if(!numEl) return;
  const c=state.compose, L=c.lang;
  const tl=(c[L].title||'').length, bl=(c[L].body||'').length;
  numEl.textContent=fmtNum(tl)+' '+t('f_chars');
  numEl.className='ns-counter '+(tl>65?'is-over':(tl>52?'is-near':''));
  const bc=document.getElementById('nsBodyCount');
  if(bc) bc.textContent=fmtNum(bl)+' '+t('f_chars');
}
function partialRefresh(){
  if(state.tab==='compose'){
    const view=document.getElementById('nsView');
    if(view){
      const scrollY=window.scrollY;
      view.innerHTML=viewHTMLFor('compose');
      refreshTexts(); syncComposeInputs();
      window.scrollTo(0,scrollY);
    }
  } else {
    const view=document.getElementById('nsView');
    if(view){
      const scrollY=window.scrollY;
      view.innerHTML=viewHTMLFor(state.tab);
      refreshTexts();
      window.scrollTo(0,scrollY);
    }
  }
  renderTopbarInto();
  const sn=document.getElementById('nsSidebarNav'); if(sn) sn.innerHTML=sidebarNavHTML();
  const sf=document.getElementById('nsSidebarFoot'); if(sf) sf.innerHTML=sidebarFootHTML();
  const mn=document.getElementById('nsMobileNav'); if(mn) mn.innerHTML=mobileNavHTML();
  const os=document.getElementById('nsOfflineSlot'); if(os) os.innerHTML=offlineStripHTML();
}

/* ============================================================
   TOASTS
   ============================================================ */
const toastTimers=[];
function toast(message,kind,desc){
  const host=document.getElementById('nsToasts');
  if(!host) return;
  const el=document.createElement('div');
  el.className='ns-toast'+(kind?' is-'+kind:'');
  const iconName=kind==='error'?'xCircle':(kind==='warn'?'alert':(kind==='ok'?'checkCircle':'info'));
  el.innerHTML=ic(iconName,18)+'<span>'+(desc?'<b>'+esc(desc)+'</b><br>':'')+esc(message)+'</span>';
  host.appendChild(el);
  const timer=setTimeout(()=>{
    el.classList.add('is-leaving');
    setTimeout(()=>el.remove(),200);
  },4200);
  toastTimers.push(timer);
  while(host.children.length>3){ host.removeChild(host.firstElementChild); }
  if(toastTimers.length>6){ clearTimeout(toastTimers.shift()); }
}

      (footHTML?'<div class="ns-sheet-foot">'+footHTML+'</div>':'')+
    '</section>';
  document.body.style.overflow='hidden';
  refreshTexts();
  const sheet=root.querySelector('.ns-sheet');
  if(sheet){
    const focusable=sheet.querySelector('button,input,select,textarea,[href],[tabindex]:not([tabindex="-1"])');
    if(focusable) setTimeout(()=>focusable.focus(),40);
    sheet.addEventListener('keydown',trapFocus);
    const grab=sheet.querySelector('.ns-sheet-grab');
    if(grab) enableDragDismiss(grab,sheet);
  }
}
function closeOverlay(){
  const root=document.getElementById('nsOverlayRoot');
  if(!root) return;
  const onClose=overlayState.onClose;
  root.innerHTML='';
  document.body.style.overflow='';
  overlayState={open:false,kind:null,lastFocus:null,onClose:null};
  if(overlayState.lastFocus && document.body.contains(overlayState.lastFocus)) { /* noop */ }
  if(onClose) onClose();
}
function afterOverlayClose(){
  const lf=overlayState.lastFocus;
  if(lf&&document.body.contains(lf)){ try{ lf.focus(); }catch(e){} }
  else { const main=document.getElementById('nsMain'); if(main) main.focus(); }
}
function trapFocus(e){
  if(e.key!=='Tab') return;
  const sheet=document.querySelector('.ns-sheet');
  if(!sheet) return;
  const f=Array.prototype.slice.call(sheet.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[href],[tabindex]:not([tabindex="-1"])'));
  if(!f.length) return;
  const first=f[0], last=f[f.length-1];
  if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
}
function enableDragDismiss(handle,sheet){
  let startY=null,moved=0;
  const onDown=(ev)=>{
    if(ev.pointerType==='mouse') return;
    startY=ev.clientY; moved=0; sheet.style.transition='none';
    handle.setPointerCapture&&handle.setPointerCapture(ev.pointerId);
  };
  const onMove=(ev)=>{
    if(startY==null) return;
    moved=Math.max(0,ev.clientY-startY);
    sheet.style.transform='translateY('+moved+'px)';
  };
  const onUp=()=>{
    if(startY==null) return;
    sheet.style.transition='';
    sheet.style.transform='';
    if(moved>90) doOverlayClose();
    startY=null;
  };
  handle.addEventListener('pointerdown',onDown);
  handle.addEventListener('pointermove',onMove);
  handle.addEventListener('pointerup',onUp);
  handle.addEventListener('pointercancel',onUp);
}
function doOverlayClose(){ closeOverlay(); afterOverlayClose(); }

function verifyToken(){

/* ============================================================
   PASSKEY LOGIN, enroll once, then enter with the device's own key.
   The token path above stays as the break-glass fallback.
   ============================================================ */
function b64uToBytes(v){
  const s=String(v||'').replace(/-/g,'+').replace(/_/g,'/');
  const pad=s+'='.repeat((4-s.length%4)%4);
  const bin=atob(pad);
  const out=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i);
  return out;
}
function bytesToB64u(buf){
  const bytes=new Uint8Array(buf);
  let s='';
  for(let i=0;i<bytes.length;i++) s+=String.fromCharCode(bytes[i]);
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function passkeySupported(){
  return Boolean(window.PublicKeyCredential&&navigator.credentials&&navigator.credentials.get&&navigator.credentials.create);
}
function publicKeyOptions(options,forCreate){
  const pk={challenge:b64uToBytes(options.challenge),timeout:options.timeout,userVerification:options.userVerification};
  if(forCreate){
    /* create() requires rp:{id,name}, a bare rpId is assertion-only and makes
     * the browser throw before the Face ID / Touch ID prompt can appear. */
    pk.rp={id:(options.rp&&options.rp.id)||options.rpId,name:(options.rp&&options.rp.name)||'AdmissionHub Admin'};
    pk.pubKeyCredParams=(options.pubKeyCredParams||[]).map(p=>({type:p.type,alg:p.alg}));
    if(options.user) pk.user={id:b64uToBytes(options.user.id),name:options.user.name,displayName:options.user.displayName};
    if(options.authenticatorSelection) pk.authenticatorSelection=options.authenticatorSelection;
    pk.attestation=options.attestation||'none';
    pk.excludeCredentials=(options.excludeCredentials||[]).map(c=>({type:c.type,id:b64uToBytes(c.id)}));
  }else{
    pk.rpId=options.rpId||(options.rp&&options.rp.id);
    pk.allowCredentials=(options.allowCredentials||[]).map(c=>({type:c.type,id:b64uToBytes(c.id),transports:c.transports||[]}));
  }
  return pk;
}
function credentialToJson(cred){
  const r=cred.response;
  const base={id:cred.id,rawId:bytesToB64u(cred.rawId),type:cred.type};
  if(r.attestationObject) return Object.assign(base,{clientDataJSON:bytesToB64u(r.clientDataJSON),attestationObject:bytesToB64u(r.attestationObject),transports:(r.getTransports&&r.getTransports())||[]});
  return Object.assign(base,{clientDataJSON:bytesToB64u(r.clientDataJSON),authenticatorData:bytesToB64u(r.authenticatorData),signature:bytesToB64u(r.signature),userHandle:r.userHandle?bytesToB64u(r.userHandle):undefined});
}
function gateMsg(text,bad){
  const msg=document.getElementById('nsAuthMsg');
  if(!msg) return;
  msg.textContent=text||'';
  msg.style.color=bad?'var(--danger)':'';
}
/* The gate always shows a passkey button. Before any credential is enrolled it
 * reads as "Set up a passkey" and asserts will return no-credential, so the
 * enrollment instruction is shown too. Once a credential exists the label flips
 * to "Sign in with passkey". */
let passkeyEnrolled=false;
function refreshPasskeyButton(){
  const btn=document.getElementById('nsPasskeyBtn');
  const label=document.getElementById('nsPasskeyLabel');
  const hint=document.getElementById('nsPasskeyHint');
  if(!btn) return;
  if(!passkeySupported()){ btn.hidden=true; if(hint) hint.hidden=true; return; }
  NS.api.get('/api/admin/webauthn/status').then(function(out){
    if(!document.getElementById('nsPasskeyBtn')) return;
    const enrolled=Boolean(out.ok&&out.data&&out.data.enrolled);
    passkeyEnrolled=enrolled;
    if(label) label.textContent=t(enrolled?'auth_passkey':'auth_passkey_setup');
    if(hint) hint.hidden=enrolled;
  }).catch(function(){
    passkeyEnrolled=false;
    if(label) label.textContent=t('auth_passkey');
    if(hint) hint.hidden=true;
  });
}
/* One button, two jobs: before enrollment it enrolls using the token in the
 * field, after enrollment it signs in with the device key. */
function onPasskeyButton(){
  if(passkeyEnrolled) return signInWithPasskey();
  return enrollFirstPasskey();
}
/* First-run enrollment straight from the gate: the token field is the admin
 * credential, so the owner does not have to enter the panel to add a passkey. */
function enrollFirstPasskey(){
  const token=(document.getElementById('nsToken')||{}).value||'';
  if(token.trim().length<4){
    gateMsg(t('auth_passkey_add')+', '+t('auth_token'),true);
    const inp=document.getElementById('nsToken'); if(inp) inp.focus();
    return;
  }
  NS.api.setToken(token.trim());
  addPasskeyToDevice();
}
function signInWithPasskey(){
  const btn=document.getElementById('nsPasskeyBtn');
  if(!btn||!passkeySupported()) return;
  btn.disabled=true; btn.innerHTML=ic('spinner',17)+esc(t('auth_passkey_wait'));
  NS.api.post('/api/admin/webauthn/challenge',{purpose:'assert'}).then(function(begin){
    if(!begin.ok||!begin.data||!begin.data.options){
      btn.disabled=false; btn.innerHTML=ic('lock',17)+'<span id="nsPasskeyLabel">'+esc(t('auth_passkey_setup'))+'</span>';
      /* 404 no-credential: nothing to assert yet. Point at the token path, which
       * is the only way to enroll the first passkey. */
      const hint=document.getElementById('nsPasskeyHint');
      if(hint) hint.hidden=false;
      gateMsg(begin.status===404?t('auth_passkey_none'):t('auth_passkey_fail')+' ('+begin.status+')',true);
      if(begin.status===404){ const inp=document.getElementById('nsToken'); if(inp) inp.focus(); }
      return null;
    }
    return navigator.credentials.get({publicKey:publicKeyOptions(begin.data.options,false)}).then(function(cred){
      return NS.api.post('/api/admin/webauthn/assert',{challengeId:begin.data.challengeId,response:credentialToJson(cred)});
    });
  }).then(function(out){
    if(!out) return;
    if(!out.ok||!out.data||!out.data.session){
      btn.disabled=false; btn.innerHTML=ic('lock',17)+'<span id="nsPasskeyLabel">'+esc(t('auth_passkey'))+'</span>';
      gateMsg(t('auth_passkey_fail')+' ('+out.status+')',true);
      return;
    }
    NS.api.setSession(out.data.session);
    return NS.api.get('/api/notifications/history').then(function(hist){
      state.authenticated=true;
      if(hist.ok) NS.hydrate(hist.data);
      render();
      toast(t('auth_success'),'ok',t('appSub'));
    });
  }).catch(function(){
    btn.disabled=false; btn.innerHTML=ic('lock',17)+'<span id="nsPasskeyLabel">'+esc(t('auth_passkey'))+'</span>';
    gateMsg(t('auth_passkey_fail'),true);
  });
}
/* Enrollment needs the admin token: it is a privileged change to the account. */
function addPasskeyToDevice(){
  if(!passkeySupported()) return;
  const answer=window.prompt(t('auth_passkey_add'));
  if(answer===null) return;
  const label=answer.trim();
  NS.api.post('/api/admin/webauthn/challenge',{purpose:'register'}).then(function(begin){
    if(!begin.ok||!begin.data||!begin.data.options) return gateMsg(t('auth_passkey_fail')+' ('+begin.status+')',true);
    return navigator.credentials.create({publicKey:publicKeyOptions(begin.data.options,true)}).then(function(cred){
      return NS.api.post('/api/admin/webauthn/register',{challengeId:begin.data.challengeId,response:credentialToJson(cred),label:label||'Admin device'});
    });
  }).then(function(out){
    if(!out) return;
    if(out.ok&&out.data&&out.data.registered){ toast(t('auth_passkey_added'),'ok',t('auth_passkey_ready')); refreshPasskeyButton(); }
    else gateMsg(t('auth_passkey_fail')+' ('+(out.status||0)+')',true);
  }).catch(function(){ gateMsg(t('auth_passkey_fail'),true); });
}
function signOutEverywhere(){
  NS.api.clearToken();
  NS.api.clearSession();
}

function approveConfiguration(){

  state.audit.unshift({at:new Date(),actor:'admin',action:'approved',target:state.compose.bn.title?{bn:state.compose.bn.title,en:state.compose.en.title||state.compose.bn.title}:{bn:t('review'),en:'Review'}});

function performSend(){
  if(state.approval!=='approved'){ toast(t('send_locked'),'warn'); return; }
  if(state.offline){ toast(t('offline_title'),'warn',t('offline_desc')); return; }
  const c=state.compose;
  const isSchedule=c.schedule.mode==='later';
  if(isSchedule && (!c.schedule.when || new Date(c.schedule.when).getTime() <= Date.now()+60000)){
    toast(t('sch_must_future')||'Schedule must be at least 1 minute ahead','warn'); return;
  }
  const payload={
    type:(c.type||'announcement'),
    title:(c.lang==='en'?c.en.title:c.bn.title||c.en.title)||'',
    body:(c.lang==='en'?c.en.body:c.bn.body||c.en.body)||'',
    imageUrl:c.imageUrl||'',
    targetUrl:c.targetUrl||'',
    audience:(c.segmentId||'all_students')
  };
  state.busy=true; render();
  const sendBtn=document.querySelector('[data-action="send-final"]');
  if(sendBtn){ sendBtn.disabled=true; sendBtn.innerHTML=ic('spinner',17)+esc(t('working')); }

  const finish=(kind,title,desc)=>{
    state.busy=false; state.approval='draft';
    state.compose=blankDraft();
    state.sectionOpen={type:true,channel:false,audience:false,content:true,media:false,more:false,schedule:false,ab:false};
    render();
    toast(t(title),kind,desc?t(desc):'');
    if(kind==='ok') refreshCenter();
  };

  const go=(path,body)=>{
    NS.api.post(path,body).then(out=>{
      const data=out.data||{};
      if(out.ok){
        finish('ok', isSchedule?'scheduled_ok':'sent_ok', isSchedule?'q_scheduled_desc':'sent_ok_desc');
      } else if(out.status===409){
        finish('warn','err_duplicate',null);
      } else if(out.status===429){
        finish('warn','err_rate',null);
      } else if(out.status===403){
        finish('error','auth_invalid',null);
      } else {
        finish('error','sent_fail',null);
      }
    });
  };

  // Attach this admin's own device token when available (matches old admin: best-effort).
  const afterToken=(own)=>{
    if(own && !isSchedule) payload.deviceToken=own;
    if(isSchedule){ payload.scheduledAt=new Date(c.schedule.when).getTime(); go('/api/notifications/global/schedule',payload); }
    else { go('/api/notifications/global/send',payload); }
  };
  try{
    if(window.AhFcm && typeof window.AhFcm.getToken==='function'){
      Promise.resolve(window.AhFcm.getToken()).then(afterToken).catch(()=>afterToken(null));
    } else { afterToken(null); }
  }catch(_){ afterToken(null); }
}

function saveTemplateH(){

function refreshCenter(){

function hydrateCenter(d){
  if(!d||typeof d!=='object') return;
  const items=Array.isArray(d.items)?d.items:[];
  /* Per-item effectiveness (opened/clicked/ctr) is computed server-side by
   * computeAnalytics and is NOT on the raw history row. Index it by id so the
   * expanded detail shows real numbers instead of zeros. */
  const metricsById={};
  const perItem=d.analytics&&Array.isArray(d.analytics.items)?d.analytics.items:[];
  perItem.forEach(function(m){ if(m&&m.id) metricsById[String(m.id)]=m; });
  const mapped=items.map(function(r){
    const m=metricsById[String(r.id)]||{};
    const conv={ id:r.id, status:r.status, type:r.type, audience:r.audience,
      title:{bn:r.title,en:r.title}, body:{bn:r.body||'',en:r.body||''},
      channels:['push','inapp'], imageUrl:r.imageUrl||'', targetUrl:r.targetUrl||'',
      cta:{bn:'',en:''},
      sentAt:r.sentAt?new Date(r.sentAt):null,
      createdAt:r.createdAt?new Date(r.createdAt):null,
      scheduledFor:r.scheduledAt?new Date(r.scheduledAt):null,
      reach:Number(r.reachEstimate||0), delivered:Number(r.delivered||0),
      opened:Number(m.opened||r.opened||0), clicked:Number(r.clicks||m.clicked||0),
      error:r.error||'', reason:'' };
    return conv;
  });
  state.sent=mapped.filter(function(r){ return r.status!=='scheduled'; });
  state.queue=mapped.filter(function(r){ return r.status==='scheduled'; }).map(function(r){
    return { id:r.id, status:r.status, type:r.type, audience:r.audience, channel:'push',
      priority:'normal', title:r.title, body:r.body,
      scheduledFor:r.scheduledFor||r.createdAt||new Date(),
      reach:r.reach, campaign:null };
  });
  state.lastSyncAt=new Date();
  state.quota={dailyCap:Number(d.dailyCap||SAMPLE_DATA.quota.dailyCap),
    /* Prefer the limiter's own counter. Only fall back to a client-side count of
     * today's sent rows when the server did not report one (older response or no
     * KV binding), so the number is never silently the whole history length. */
    used:(d.dailyUsed==null?state.sent.filter(function(r){
      const ts=r.sentAt||r.createdAt;
      return ts && new Date(ts).toISOString().slice(0,10)===new Date().toISOString().slice(0,10);
    }).length:Number(d.dailyUsed)),
    deliveryRate:(function(s){ const dv=s.reduce(function(a,r){return a+(Number(r.delivered)||0);},0); const rq=s.reduce(function(a,r){return a+(Number(r.reach)||0);},0); return rq?dv/rq:0; })(state.sent),
    window:SAMPLE_DATA.quota.window};
  state.analytics=analyticsFrom(mapped,d.analytics,d.reachEstimate,d.dailyCap);
  state.history=d.items||items;
  if(Array.isArray(d.templates)){
    state.templates=d.templates.map(function(tp){
      return { key:tp.key, category:tp.type||tp.category||'announcement',
        favorite:!!tp.favorite, ai:!!tp.ai, versions:Number(tp.versions||1), used:Number(tp.used||0),
        bn:tp.bn||{title:'',body:''}, en:tp.en||{title:'',body:''},
        perf:tp.perf||{openRate:0,clickRate:0} };
    });
  }
}
function analyticsFrom(rows,serverTotals,reachEstimate,dailyCap){
  const base=JSON.parse(JSON.stringify(SAMPLE_DATA.analytics));
  const sent=rows.filter(function(r){return r.status==='sent';});
  const sum=function(k){ return rows.reduce(function(s,r){return s+(Number(r[k])||0);},0); };
  const delivered=sum('delivered'), opened=sum('opened'), clicked=sum('clicks');
  if(rows.length){
    base.sentToday=sent.length; base.delivered=delivered; base.opened=opened; base.clicked=clicked;
    base.failed=rows.filter(function(r){return r.status==='failed';}).length;
    base.scheduled=rows.filter(function(r){return r.status==='scheduled';}).length;
    base.queued=base.scheduled;
    base.openRate=delivered?opened/delivered:0;
    base.clickRate=delivered?clicked/delivered:0;
  }
  if(serverTotals&&serverTotals.totals){
    const tt=serverTotals.totals;
    if(tt.sent!=null) base.sentToday=Number(tt.sent);
    if(tt.delivered!=null) base.delivered=Number(tt.delivered);
    if(tt.opened!=null) base.opened=Number(tt.opened);
    if(tt.clicked!=null) base.clicked=Number(tt.clicked);
    if(tt.failed!=null) base.failed=Number(tt.failed);
    if(tt.openRate!=null) base.openRate=Number(tt.openRate);
  }
  if(reachEstimate) base.reach.estimated=Number(reachEstimate);
  if(dailyCap) base.quotaCap=Number(dailyCap);
  base.channelPerf=[{key:'push',delivered:delivered||0,opened:opened||0,clicked:clicked||0}];
  base.failureReasons=rows.filter(function(r){return r.status==='failed'&&r.error;})
    .map(function(r){ return {bn:r.error,en:r.error,n:1}; });
  base.ab={a:{label:{bn:'A',en:'A'},sent:0,opened:0,clicked:0},b:{label:{bn:'B',en:'B'},sent:0,opened:0,clicked:0}};
  return base;
}

function runAIPlan(promptText){
  const c=state.compose;
  const L=c.lang;
  const hasPrompt=!!(promptText&&promptText.trim());
  const camp = /ক্যাম্পেইন|campaign/i.test(promptText||'');
  const ru = /RU|রাজশাহী/i.test(promptText||'');
  const unit = /A unit|ক ইউনিট|unit a/i.test(promptText||'');
  state.aiRunning=true;
  state.sectionOpen.content=true;
  if(ru||unit){
    c.rulesApplied=true; c.segmentId=null;
    c.rules.conditions=[{field:'university',op:'eq',value:ru?'RU':'RU'},{field:'unit',op:'eq',value:'A'}];
    if(/৭|7/i.test(promptText||'')) c.rules.conditions.push({field:'activity',op:'eq',value:'active7'});
  } else if(!c.segmentId){
    c.segmentId='all_students';
  }
  const steps=[
    {bn:"অডিয়েন্স শনাক্ত করছি",en:"Identifying the audience"},
    {bn:"রিচ অনুমান করছি",en:"Estimating reach"},
    {bn:"নোটিফিকেশন কপি তৈরি করছি",en:"Drafting notification copy"},
    {bn:"টার্গেটিং যাচাই করছি",en:"Validating targeting"},
    {bn:"সময়সূচি প্রস্তাব করছি",en:"Proposing a schedule"},
    {bn:"কনফিগারেশন প্রস্তুত",en:"Configuration prepared"}
  ];
  state.aiPlan={steps:steps.map(s=>({text:s,done:false})),index:0,campaign:camp};
  // seed the chat: user message, then the AI plan card
  const planMsg={role:'ai',text:t('chat_started_body'),plan:state.aiPlan,at:new Date()};
  chat.messages.push(planMsg);
  renderChatThread();
  render();
  let i=0;
  const tick=()=>{
    if(i>=steps.length){ finishAIPlan(); return; }
    state.aiPlan.index=i;
    state.aiPlan.steps[i].done=true;
    if(i===2){
      const tpl=state.templates.find(x=>x.key==='tpl_exam_date');
      if(tpl&&!c[L].title){ c[L].title=tpl[L].title; c[L].body=tpl[L].body; c.dirty=true; }
    }
    if(i===4){
      const when=hoursAhead(18);
      c.schedule.mode='later'; c.schedule.when=toLocalInput(when); c.schedule.tz='Asia/Dhaka';
    }
    if(i===3){
      c.targetUrl='admissionhub://universities/RU';
      c.cta[L] = L==='bn'?'প্রস্তুতি শুরু করুন':'Start preparing';
    }
    i++;
    render();
    renderChatThread();
    setTimeout(tick,620);
  };
  setTimeout(tick,320);
}
function finishAIPlan(){
  state.aiRunning=false;
  if(state.aiPlan) state.aiPlan.index=state.aiPlan.steps.length;
  state.aiActivity.unshift({at:new Date(),bn:"অডিয়েন্স ও কপি প্রস্তুত করেছি; অনুমোদনের অপেক্ষায়।",en:"Prepared the audience and copy; waiting for approval.",kind:"wait"});
  state.audit.unshift({at:new Date(),actor:'ai',action:'ai_prepared',target:{bn:state.compose.bn.title||t('review'),en:state.compose.en.title||'Review'}});
  // finalize the chat: mark the last plan step done and attach the summary card
  const lastMsg=chat.messages.slice().reverse().find(m=>m.plan);

    lastMsg.plan.steps.forEach(st=>st.done=true);
    lastMsg.text=t('chat_prepared_body');
    lastMsg.card=chatSummaryCard();

}

function applyFix(fix,key){
  if(typeof fix==='string'){ try{ fix=JSON.parse(fix); }catch(e){ return; } }
  if(!fix) return;
  if(fix.action==='expand-step'){ state.sectionOpen[fix.step]=true; }
  if(fix.action==='goto'){ state.tab=fix.tab; state.mobileTab=MOBILE_TABS.find(mt=>mt.tabs.includes(fix.tab))?.key||'more'; }
  if(fix.action==='open-review'){ openReview(); return; }
  if(fix.action==='focus-field'){
    state.sectionOpen.content=true; state.sectionOpen.media=true; state.sectionOpen.schedule=true;
    render();
    const map={title:'nsTitle',body:'nsBody',targetUrl:'nsTarget',when:'nsWhen'};
    const el=document.getElementById(map[fix.field]);
    if(el){ el.focus(); el.scrollIntoView({block:'center',behavior:'smooth'}); }
    return;
  }
  if(fix.action==='clear-unknown-vars'){
    const c=state.compose,L=c.lang;
    c[L].title=c[L].title.replace(/\{\{\s*([a-zA-Z_]+)\s*\}\}/g,(m,k)=>SAMPLE_DATA.variables.some(v=>v.key===k)?m:'');
    c[L].body=c[L].body.replace(/\{\{\s*([a-zA-Z_]+)\s*\}\}/g,(m,k)=>SAMPLE_DATA.variables.some(v=>v.key===k)?m:'');
    c.dirty=true;
  }
  if(fix.action==='set-content-lang-other'){
    state.compose.lang = state.compose.lang==='bn'?'en':'bn';
    state.sectionOpen.content=true;
  }
  render();
}

function findActionEl(target){
  let el=target;
  while(el && el!==document.body){
    if(el.dataset && el.dataset.action) return el;
    el=el.parentElement;
  }
  return null;
}

function fieldKey(f){

  return map[f]||f;
}
document.addEventListener('input',function(ev){
  const el=ev.target;
  if(!el||!el.dataset) return;
  const f=el.dataset.field;
  if(el.id==='nsTplSearch'||el.id==='nsSentSearch'){
    if(el.id==='nsTplSearch'){ state.templateQuery=el.value; const grid=document.querySelector('.ns-tpl-grid'); render(); const inp=document.getElementById('nsTplSearch'); if(inp){ inp.focus(); inp.setSelectionRange(inp.value.length,inp.value.length);} }
    else { state.sentFilter.q=el.value; debouncedSentSearch(); }
    return;
  }
  if(el.dataset.action==='tpl-search'){ state.templateQuery=el.value; }
  if(f==='title'||f==='body'){
    const L=state.compose.lang;
    state.compose[L][f]=el.value;
    state.compose.dirty=true;
    if(f==='title') state.compose.titleDirty=true; else state.compose.bodyDirty=true;
    syncComposeInputs();
    refreshPreviewOnly();
    return;
  }
  if(f==='imageUrl'){ state.compose.imageUrl=el.value; state.compose.dirty=true; refreshPreviewOnly(); return; }
  if(f==='targetUrl'){ state.compose.targetUrl=el.value; state.compose.dirty=true; return; }
  if(f==='cta'){ state.compose.cta[state.compose.lang]=el.value; state.compose.dirty=true; refreshPreviewOnly(); return; }
  if(f==='ab_title'){ state.compose.ab[state.compose.lang].title=el.value; return; }
  if(f==='ab_body'){ state.compose.ab[state.compose.lang].body=el.value; return; }
  if(f==='utm_source'||f==='utm_medium'||f==='utm_campaign'){ state.compose.utm[f.replace('utm_','')]=el.value; state.compose.dirty=true; return; }
  if(f==='frequencyCap'){ state.compose.frequencyCap=Number(el.value)||0; state.compose.dirty=true; return; }
  if(f==='when'){ state.compose.schedule.when=el.value; state.compose.dirty=true; return; }
  if(f==='segName'){ state.compose.segNameDraft=el.value; return; }
});

  if(!txt||state.aiRunning) return;
  ta.value=''; autoGrowChat(ta);
  pushChat({role:'user',text:txt,at:new Date()});
  pushChat({role:'thinking'});
  setTimeout(()=>{ chat.messages=chat.messages.filter(m=>m.role!=='thinking'); runAIPlan(txt); },520);
});
document.addEventListener('keydown',function(ev){
  if(ev.key==='Escape' && chat.open){ ev.preventDefault(); closeAIChat(); return; }
  if(ev.target && ev.target.id==='nsChatText' && ev.key==='Enter' && !ev.shiftKey){
    ev.preventDefault();
    const f=ev.target.closest('form');
    if(f) f.dispatchEvent(new Event('submit',{cancelable:true,bubbles:true}));
  }
},true);
let sentSearchTimer=null;
function debouncedSentSearch(){
  if(sentSearchTimer) clearTimeout(sentSearchTimer);
  sentSearchTimer=setTimeout(()=>{
    const inp=document.getElementById('nsSentSearch');
    const pos=inp?inp.selectionStart:null;
    partialRefresh();
    const again=document.getElementById('nsSentSearch');
    if(again){ again.focus(); if(pos!=null) again.setSelectionRange(pos,pos); }
  },240);
}
document.addEventListener('change',function(ev){
  const el=ev.target;
  if(!el||!el.dataset) return;
  if(el.id==='nsImageFile'){ uploadNotificationImage(el.files&&el.files[0]); return; }
  const f=el.dataset.field;
  if(el.tagName==='SELECT'){
    if(f==='priority'){ state.compose.priority=el.value; state.compose.dirty=true; return; }
    if(f==='campaignId'){ state.compose.campaignId=el.value||null; state.compose.dirty=true; return; }
    if(f==='recur'){ state.compose.schedule.recur=el.value; state.compose.dirty=true; return; }
    if(f==='tz'){ state.compose.schedule.tz=el.value; state.compose.dirty=true; return; }
    if(el.dataset.action==='sent-filter'){ state.sentFilter[el.dataset.key]=el.value; partialRefresh(); return; }
  }
  if(el.dataset.ruleField!=null){
    const i=el.dataset.ruleField;
    if(String(i).startsWith('g')){ const [gi,ri]=String(i).slice(1).split('-'); state.compose.rules.groups[Number(gi)].conditions[Number(ri)].field=el.value; state.compose.rules.groups[Number(gi)].conditions[Number(ri)].value=''; }
    else { state.compose.rules.conditions[Number(i)].field=el.value; state.compose.rules.conditions[Number(i)].value=''; }
    state.compose.rulesApplied=true; partialRefresh(); return;
  }
  if(el.dataset.ruleOp!=null){
    const i=el.dataset.ruleOp;
    if(String(i).startsWith('g')){ const [gi,ri]=String(i).slice(1).split('-'); state.compose.rules.groups[Number(gi)].conditions[Number(ri)].op=el.value; }
    else state.compose.rules.conditions[Number(i)].op=el.value;
    state.compose.rulesApplied=true; partialRefresh(); return;
  }
  if(el.dataset.ruleValue!=null){
    const i=el.dataset.ruleValue;
    if(String(i).startsWith('g')){ const [gi,ri]=String(i).slice(1).split('-'); state.compose.rules.groups[Number(gi)].conditions[Number(ri)].value=el.value; }
    else state.compose.rules.conditions[Number(i)].value=el.value;
    state.compose.rulesApplied=true; partialRefresh(); return;
  }
  if(el.dataset.action==='toggle-utm'||el.dataset.action==='toggle-ab'||el.dataset.action==='toggle-suppress') return;
});
/* checkboxes that use click already handled; also handle keyboard toggle for switches */
document.addEventListener('keydown',function(ev){
  if(ev.key==='Escape'){
    if(overlayState.open){ ev.preventDefault(); doOverlayClose(); return; }
  }
  if(ev.key==='Enter'){
    const el=findActionEl(ev.target);
    if(el&&el.tagName!=='BUTTON'&&el.dataset.action&&ev.target.tagName!=='TEXTAREA'&&ev.target.tagName!=='INPUT'){ ev.preventDefault(); el.click(); }
  }
});
/* visualViewport: keyboard inset */
function initKeyboard(){
  if(!window.visualViewport) return;
  const vv=window.visualViewport;
  const apply=()=>{
    const inset=Math.max(0,Math.round(window.innerHeight-vv.height-vv.offsetTop));
    document.documentElement.style.setProperty('--keyboard-inset',inset+'px');
    const active=document.activeElement;
    if(inset>120 && active && (active.tagName==='INPUT'||active.tagName==='TEXTAREA')){
      setTimeout(()=>{ try{ active.scrollIntoView({block:'center',behavior:'smooth'}); }catch(e){} },60);
    }
  };
  vv.addEventListener('resize',apply);
  vv.addEventListener('scroll',apply);
}
/* offline detection for the offline workflow demo */
function initOffline(){
  window.addEventListener('offline',()=>{ if(!state.offline) toggleOffline(true); });
  window.addEventListener('online',()=>{ if(state.offline&&!state.demoOffline) toast(t('offline_restored_desc'),'ok',t('offline_restored')); });
}

/* ============================================================
   PUBLIC API + INIT
   ============================================================ */

/* ============================================================
   REAL BACKEND CLIENT
   Talks to the existing Cloudflare Worker notification endpoints.
   The admin token is held in sessionStorage for this browser session only.
   ============================================================ */
const API_TOKEN_KEY='ahAdminTok';
const API_SESSION_KEY='ahAdminSess';
function apiToken(){ try{ return sessionStorage.getItem(API_TOKEN_KEY)||''; }catch(_){ return ''; } }
function apiSession(){ try{ return sessionStorage.getItem(API_SESSION_KEY)||''; }catch(_){ return ''; } }
/* Passkey sessions live in sessionStorage too: they are short-lived (30 min) and
 * scoped to this tab, which is the whole point, nothing long-lived to steal. */
function setApiSession(v){ try{ v?sessionStorage.setItem(API_SESSION_KEY,v):sessionStorage.removeItem(API_SESSION_KEY); }catch(_){} }
const API_BASE=(function(){
  try{
    // When this page is embedded in an iframe inside the app, the parent origin
    // (which is same-origin with the Worker) is the correct API host.
    if(window.location.protocol==='file:' && document.referrer){
      return new URL(document.referrer).origin;
    }
  }catch(_){}
  return '';
})();
function apiFetch(path,init){
  const controller=new AbortController();
  const timer=setTimeout(function(){controller.abort();},15000);
  const opts=Object.assign({credentials:'include',signal:controller.signal},init||{});
  opts.headers=Object.assign({'Content-Type':'application/json',
    'Authorization':'Bearer '+apiToken()},apiSession()?{'X-Admin-Session':apiSession()}:{},(init&&init.headers)||{});
  return fetch(API_BASE+path,opts).then(function(res){
    return res.json().catch(function(){return {};}).then(function(data){
      return {ok:res.ok,status:res.status,data:data};
    });
  }).catch(function(){ return {ok:false,status:0,data:{}}; })
    .then(function(v){ clearTimeout(timer); return v; });
}
function apiApi(){
  return {
    token:apiToken,
    session:apiSession,
    setToken:function(v){ try{ v?sessionStorage.setItem(API_TOKEN_KEY,v):sessionStorage.removeItem(API_TOKEN_KEY); }catch(_){} },
    setSession:setApiSession,
    clearToken:function(){ try{ sessionStorage.removeItem(API_TOKEN_KEY); }catch(_){} },
    clearSession:function(){ setApiSession(''); },
    get:function(path){ return apiFetch(path,{method:'GET'}); },
    post:function(path,body){ return apiFetch(path,{method:'POST',body:JSON.stringify(body||{})}); }
  };
}

/* Bootstrap: if a token is already present (same session), verify it silently and
   load live data without showing the gate again. */
function bootstrapAuth(){
  /* A passkey session is already an authenticated admin grant; verify it the
   * same way the token is verified, so a reload does not bounce to the gate. */
  if(!apiToken()&&!apiSession()) return;
  NS.api.get('/api/notifications/history').then(function(out){
    if(out.ok){ state.authenticated=true; NS.hydrate(out.data); render(); loadTemplates().then(render); }
    else { NS.api.clearToken(); NS.api.clearSession(); }
  });
}

const NS = {
  mount:function(el){
    const root=typeof el==='string'?document.querySelector(el):el;
    if(!root) return;
    root.id=root.id||'nsRoot';
    state.authenticated=false;
    render();
  },
  setLang:function(l){ applyLang(l); },
  setTheme:function(th){ applyTheme(th); },
  setState:function(patch){
    if(!patch||typeof patch!=='object') return;
    Object.keys(patch).forEach(k=>{
      if(k==='compose') Object.assign(state.compose,patch.compose);
      else state[k]=patch[k];
    });
    render();
  },
  SAMPLE_DATA:SAMPLE_DATA,
  get state(){ return state; }
};
NS.api=apiApi();
NS.hydrate=hydrateCenter;
NS.analyticsFrom=analyticsFrom;
NS.isAuthenticated=function(){ return !!(NS.api&&NS.api.token()); };
window.NotificationStudio = NS;

function init(){
  try{
    const savedTheme=localStorage.getItem('ns_theme');
    const savedLang=localStorage.getItem('ns_lang');
    if(savedTheme) THEME=savedTheme;
    if(savedLang) LANG=savedLang;
  }catch(e){}
  if(!['light','dark','pink','green'].includes(THEME)) THEME='light';
  if(!['bn','en'].includes(LANG)) LANG='bn';
  document.documentElement.setAttribute('data-theme',THEME);
  document.documentElement.setAttribute('data-lang',LANG);
  document.documentElement.setAttribute('lang',LANG);
  state.theme=THEME; state.lang=LANG;
  initKeyboard();
  initOffline();
  render();
  bootstrapAuth();
  const token=document.getElementById('nsToken');
  if(token){ token.addEventListener('keydown',e=>{ if(e.key==='Enter') verifyToken(); }); }
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init);
else init();
})();
